<!doctype html>
<html lang="en" data-default-language="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captain's Board</title>
<link rel="stylesheet" href="ship.css">
<style>
:root{
  --bg:#080f17; --bg2:#0e1720; --bg3:#16212c; --line:#213041;
  --fg:#e8eff7; --fg2:#93a7bd; --fg3:#5d7188; --brass:#d9a441;
  --ok:#3ecf8e; --warn:#f2b544; --bad:#f2645a; --wait:#c07bf0; --accent:#4da3ff;
  --k-merge:#3ecf8e; --k-dispatch:#4da3ff; --k-repin:#c07bf0;
  --k-scope:#f2b544; --k-skill:#f49ac2; --k-decision:#93a7bd;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);padding-bottom:40px}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--bg2);position:sticky;top:0;z-index:5}
.top b{font-weight:650} .top small{display:block;font:400 13px var(--mono);color:var(--fg3);
  letter-spacing:.08em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.15)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(242,100,90,.15)}
.spacer{flex:1}
.counts{display:flex;gap:22px;padding:14px 20px;border-bottom:1px solid var(--line)}
.counts b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.counts span{font:13px var(--mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.09em}
.counts .w b{color:var(--wait)} .counts .x b{color:var(--bad)}
.lanes-wrap,.logwrap{padding:16px 20px 0}
section>h2{margin:0 0 10px;font:600 13px var(--mono);color:var(--fg3);
  text-transform:uppercase;letter-spacing:.1em}
/* six lanes left to right in lifecycle order; narrower screens wrap them in
   the same reading order rather than scrolling the page sideways */
.lanes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;align-items:start}
@media(max-width:1100px){.lanes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane.l-captain{border-color:#3a2a52}
.card .hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 6px}
.card .hd .pchip{flex:0 1 auto;min-width:0;max-width:100%;align-self:center}
.card .t.missing{color:var(--fg3);font-style:italic}
.card .crew,.card .dep{font:13px var(--mono);color:var(--fg2);margin-top:4px}
.card .dep{color:var(--warn)}
/* T-116: one chip per crew member on a card: name, role, round */
.card .crew{display:flex;flex-wrap:wrap;gap:4px}
.card .cchip{display:inline-flex;gap:6px;align-items:baseline;padding:1px 7px;border:1px solid var(--line);border-radius:99px}
.card .cchip .cn{color:var(--fg)}.card .cchip .cr,.card .cchip .cd{color:var(--fg2)}
.card .badge{display:inline-block;margin:6px 6px 0 0;font:700 13px var(--mono);color:#fff;
  background:#6b3fa0;border-radius:5px;padding:2px 7px}
.card .badge.b-gate{background:#7c322b}
.lane .more{margin:4px 0 0;font-size:13px;color:var(--fg3)}
/* the engine the crew run on, from config.yaml */
.vend{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--mono);color:var(--fg2);
  border:1px solid var(--line);border-radius:7px;padding:4px 10px;flex-shrink:1;flex-wrap:wrap;overflow-wrap:anywhere}
.vend[hidden]{display:none}
.vend i{width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.vend.x{border-color:#4a3a1a;color:#e0b45c} .vend.x i{background:var(--brass)}
.vend b{font-weight:700;color:var(--brass)}
/* the sea strip under the header, as the prototype has it */
.counts{background:linear-gradient(180deg,#081824 0%,#0a2a44 55%,#0d3b5e 100%)}
.counts span{color:#7fa8c6}
/* the captain's portrait beside the first card; the rest are strips */
.deckrow{display:flex;gap:18px;align-items:flex-start}
#deck{flex:1;min-width:0}
@media(max-width:820px){.deckrow{flex-direction:column;align-items:stretch}}
#deck .also{margin:12px 0 8px;font:600 13px var(--mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.09em}
.dstrip{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--wait);
  border-radius:9px;margin-bottom:8px;min-width:0}
.dstrip>summary{cursor:pointer;min-height:44px;padding:10px 12px;font-size:16px;overflow-wrap:anywhere}
.dstrip>summary .meta{font:13px var(--mono);color:var(--fg3)}
.dstrip>summary .picked{font:700 13px var(--mono);font-style:normal;color:var(--brass)}
.kbadge{display:inline-block;flex-shrink:0;white-space:nowrap;font:700 12px/1.5 var(--sans);
  padding:2px 8px;border-radius:4px;margin-right:8px;vertical-align:baseline}
.k-merge{background:var(--k-merge);color:#080f17}
.k-dispatch{background:var(--k-dispatch);color:#080f17}
.k-repin{background:var(--k-repin);color:#080f17}
.k-scope{background:var(--k-scope);color:#080f17}
.k-skill{background:var(--k-skill);color:#080f17}
.k-decision{background:var(--k-decision);color:#080f17}
.k-retro{background:var(--k-decision);color:#080f17}
.dstrip[open]>summary{border-bottom:1px solid var(--line)}
.dstrip>.dcard{margin:0;border:0}
.links{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.links a{font-size:13px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--fg2);text-decoration:none}
.links a:hover{color:var(--fg);border-color:var(--accent)}
.log ul{max-height:260px}
.lane{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:70px}
.lane h3{margin:0 0 8px;font:600 10px var(--mono);color:var(--fg3);text-transform:uppercase;
  letter-spacing:.08em;display:flex;justify-content:space-between}
.lane h3 i{font-style:normal;background:var(--bg3);border-radius:99px;padding:0 7px;color:var(--fg2)}
.card{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--edge,#26323d);
  border-radius:8px;padding:8px 9px;margin-bottom:7px}
.card .id{font:600 10.5px var(--mono);color:var(--fg3);white-space:nowrap;flex:0 0 auto}
.card .t{font-size:12px;line-height:1.35;margin-top:3px}
.card .pr{font:600 10px var(--mono);color:var(--accent)}
.s-working{--edge:#2f5478} .s-review{--edge:#5a3f7d} .s-gate{--edge:#7c322b}
.s-captain{--edge:#8a6a2f} .s-merged{--edge:#2c5f49} .s-closed{--edge:#3a3a3a}
.log{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log ul{margin:0;padding:6px 0;list-style:none;max-height:64vh;overflow:auto}
.log li{display:grid;grid-template-columns:62px 90px 1fr;gap:10px;padding:5px 13px;font-size:12px;
  border-bottom:1px solid rgba(33,48,65,.5)}
.log li:last-child{border-bottom:0}
.log time{font:11px var(--mono);color:var(--fg3)}
.log .who{font:600 11px var(--mono);color:var(--fg2);overflow:hidden;text-overflow:ellipsis}
.log .k-merged{color:var(--ok)} .log .k-gate_failed{color:var(--bad)}
.log .k-approved{color:var(--ok)} .log .k-decision_requested{color:var(--wait)}
.log .k-greenlit{color:var(--brass)} .log .k-vendor_unavailable{color:var(--warn)}
.empty{color:var(--fg3);font-size:12px;padding:10px 13px}
.langs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:12px}
.langs button{padding:4px 11px;font:12px var(--sans);color:var(--fg2);background:none;border:none;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed=true]{background:#1d4b7a;color:#fff}
#pcount{background:var(--wait);color:#1a0d28;border-radius:99px;font:800 10px var(--mono);padding:1px 7px}
.dcard{background:var(--bg2);border:1px solid #3a2a52;border-radius:12px;padding:16px 18px;margin-bottom:10px}
.dcard h3{margin:0 0 4px;font-size:17px;line-height:1.35}
.dcard .meta{font:11px var(--mono);color:var(--fg3)}
.gates{margin:12px 0 0;padding:0;list-style:none;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:3px 14px}
.gates li{font-size:12px;color:var(--fg2);display:flex;gap:8px}
.gates li i{font-style:normal;width:12px;text-align:center;color:var(--ok)}
.gates li.w i,.gates li.w,.ci-only-evidence{color:var(--warn)}
.gates li.n i{color:var(--warn)} .gates li.n{color:var(--fg3)}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.acts button{font:750 12.5px var(--sans);border:none;border-radius:9px;padding:8px 18px;cursor:pointer}
.acts .go{background:linear-gradient(180deg,#e0b055,#b8862c);color:#2a1c05;box-shadow:0 2px 0 #6d4d13}
.acts .go:active{transform:translateY(2px);box-shadow:none}
.acts .alt{background:var(--bg3);color:var(--fg2);border:1px solid var(--line)}
.acts .said{font:11px var(--mono);color:var(--brass)}
.dcard a{color:var(--accent);font:11px var(--mono)}
/* the diagram is a page of its own, so it comes in as a page: the board's
   styles cannot leak into it and its styles cannot leak back out */
iframe.dg{display:block;width:100%;height:240px;margin:12px 0 0;border:1px solid var(--line);
  border-radius:10px;background:var(--bg3)}
iframe.dg[hidden]{display:none}
body{font-size:16px}
.top{flex-wrap:wrap;position:relative;gap:8px}
.top>*{min-width:0}.langs{margin-left:0;flex-shrink:0}
.langs button,.acts .said{font-size:13px}#gl{font-size:13px!important}
.top small,.counts span,section>h2,.lane h3,.card .id,.card .pr,.dcard .meta,.dcard a,.log time,.log .who,#pcount{font-size:13px}
#deckwrap>h2{font-size:13px!important}
.counts{flex-wrap:wrap;gap:16px}.counts>div{min-width:0}
.lane,.card,section,.dcard,.acts>*{min-width:0;overflow-wrap:anywhere}
.card .t,.log li,.explanation,.tradeoffs,.gates li,.empty,.acts button,.acts label,.acts textarea{font-size:16px}
.dcard h3{font-size:22px}.acts button,.langs button{min-height:44px;white-space:normal;max-width:100%}
.acts textarea{font:inherit}.gates{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.log li{grid-template-columns:minmax(0,62px) minmax(0,90px) minmax(0,1fr)}
.log .who{overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
#history{margin-top:16px}#history summary{cursor:pointer;min-height:44px;padding:10px;background:var(--bg2);font-size:16px}
.history-cards{padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:9px}
/* T-058: a card's own menu, the parked group and the drop target below the
   lanes, and the in-page step that confirms a drop */
.card[draggable="true"]{cursor:grab}
.card .cmenu{margin-left:auto;min-width:32px;min-height:32px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg2);color:var(--fg2);font:700 16px var(--mono);cursor:pointer;line-height:1}
.card .cacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .cacts button{min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg2);color:var(--fg);font:600 14px var(--sans);cursor:pointer}
.setaside{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:9px;margin-top:12px;align-items:start}
@media(max-width:620px){.setaside{grid-template-columns:minmax(0,1fr)}}
#parked{background:var(--bg2);border:1px dashed var(--line);border-radius:10px}
#parked summary{cursor:pointer;min-height:44px;padding:10px;font-size:16px}
#parked summary i{font-style:normal;background:var(--bg3);border-radius:99px;padding:0 7px;color:var(--fg2)}
.parked-cards{padding:0 9px 9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:9px}
#dropzone{min-height:44px;padding:10px;border:1px dashed #7c322b;border-radius:10px;color:var(--fg3);font-size:14px}
.lanes-wrap.dragging [data-zone]{outline:1px dashed var(--fg3);outline-offset:2px}
.lanes-wrap [data-zone].over{outline:2px solid var(--accent)}
#dropConfirm{margin-top:12px;padding:12px 14px;background:var(--bg2);border:1px solid #7c322b;border-radius:10px}
#dropConfirm[hidden]{display:none}#dropConfirm p{margin:0;font-size:16px}
#taskFeedback{margin:8px 0 0;color:var(--warn);font-size:14px}#taskFeedback:empty{display:none}
/* T-118: what a set-aside stops and leaves open, the reopening's reason, a
   lost crewman, a card under a final task, an effect */
#dropConfirm .note{margin:6px 0 0;font-size:14px;color:var(--fg2)}
#dropConfirm label{display:block;margin-top:8px;font-size:14px}
#dropConfirm textarea{display:block;width:100%;margin-top:4px;font:inherit;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px}
.card .badge.b-lost{background:#7c5a1b}
.card .badge.b-parked{background:#4a4f5c}
.dcard .final-note{margin:8px 0 0;padding:6px 10px;border:1px solid #7c322b;border-radius:7px;color:var(--warn);font-size:14px}
.acts .eff{font:600 12px var(--mono);font-style:normal;color:var(--brass)}
#effects{list-style:none;margin:0 0 8px;padding:0;color:var(--bad);font-size:14px}#effects:empty{display:none}
.log .k-agent_lost,.log .k-reopened,.log .k-worker_note_unsent{color:var(--warn)}
/* T-069: a pull request number is a link to it and keeps the look it had */
a[data-pr]{text-decoration:none}a[data-pr]:not(.pr):not(.prlink){color:inherit;font:inherit}
a[data-pr]:not(.prlink):hover,a[data-pr]:not(.prlink):focus-visible{text-decoration:underline}
a[data-pr]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media(max-width:420px){.top,.counts,.lanes-wrap,.logwrap{padding-left:12px;padding-right:12px}.log li{grid-template-columns:1fr 2fr}.log li>span:last-child{grid-column:1/-1}}
.top small,.counts span,section>h2,#deckwrap>h2,#gl{font-size:13px!important}
#readOnly{margin:0 20px 10px;padding:8px 12px;border:1px solid var(--warn);border-radius:8px;color:var(--warn);font-size:14px}
#readOnly[hidden],#readOnly [hidden]{display:none}
#readOnly a{color:var(--accent)}
#readOnly button{margin-left:8px;font:inherit;padding:2px 10px;border-radius:6px;border:1px solid var(--warn);background:transparent;color:var(--warn);cursor:pointer}
#readOnly button:disabled{opacity:.55;cursor:default}
#reloginSaid{margin-left:8px;color:var(--fg2)}
.cmenu:disabled{opacity:.45;cursor:not-allowed}
.card .lastrev{margin-top:4px;font:12px var(--mono);color:var(--fg3)}
#watch{margin:0;padding:6px 20px;font:13px var(--mono);color:var(--fg3)}
#watch.off,#watch .gap{color:var(--bad)}
#watch[hidden]{display:none}
.evidence-warning{border-left:3px solid var(--brass);background:var(--bg2);padding-left:8px}
/* T-125: the same stage stays mounted when its size changes. */
#voyage{margin:12px 20px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
#voyage-bar{display:flex;gap:8px;padding:8px}
#voyage-bar button{font:inherit;min-height:44px;padding:6px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;cursor:pointer}
#voyage-stage{display:block;width:100%;height:clamp(270px, 36vh, 440px);border:0}
/* T-274: reserve the stage's final height, so loading it never moves the tabs. */
#voyage-mount:not(.voyage-full *){min-height:clamp(270px, 36vh, 440px)}
#voyage-drawer[hidden],#voyage-mount[hidden],#voyage-workflow[hidden]{display:none}
.voyage-full{overflow:hidden}
.voyage-full #voyage{position:fixed;inset:0;margin:0;z-index:1000;border-radius:0;
  display:grid;grid-template-columns:minmax(0,1fr) min(640px,50vw);grid-template-rows:auto minmax(0,1fr)}
.voyage-full #voyage-bar{grid-column:1/-1}
.voyage-full #voyage-mount{min-width:0;min-height:0}
.voyage-full #voyage-stage{height:100%}
.voyage-full #voyage-drawer{min-width:0;min-height:0;overflow:auto;background:var(--bg)}
.voyage-full #voyage:has(#voyage-drawer[hidden]){grid-template-columns:minmax(0,1fr)}
/* The drawer is narrower than the viewport: size lanes to their container. */
.voyage-full #voyage-drawer .lanes{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.voyage-full #voyage-drawer .lane:has([role="menu"]){position:relative;z-index:1}
.voyage-full #voyage-drawer [role="menu"],
.voyage-full #voyage-drawer [role="dialog"],
.voyage-full #voyage-drawer [role="alertdialog"]{position:relative;z-index:2}
.voyage-full #voyage-drawer .counts{flex-wrap:wrap}
.voyage-hidden #capstage{display:none!important}
/* Reorder visually: moving an iframe's parent in the DOM reloads its stage. */
@media(max-width:650px){
  body{display:flex;flex-direction:column}
  body>#shipregion,body>.lanes-wrap,body>.logwrap{order:2}
  #voyage-stage{height:270px}
  #voyage-mount:not(.voyage-full *){min-height:270px}
  .voyage-full #voyage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,2fr) minmax(0,3fr)}
  .voyage-full #voyage:has(#voyage-drawer[hidden]){grid-template-rows:auto minmax(0,1fr)}
}

.intent-alignment{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}
.intent-alignment h4{color:var(--brass)}.intent-alignment h5{font-size:14px;margin:12px 0 5px}.intent-alignment p{margin:6px 0}
.intent-scope{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.intent-note,.intent-caution{border-left:3px solid var(--warn);padding:8px 12px;margin:10px 0;background:var(--bg2)}.intent-caution{border-color:var(--bad)}
.ste-pill,.ste-chip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 5px;font:11px var(--mono);color:var(--fg2)}.ste-pill{margin-left:8px;color:var(--brass)}.ste-chip{margin:2px}.ste-fail{color:var(--bad)}.ste-warn{color:var(--warn)}
.confirm-question{margin:12px 0}.question-controls button{font:inherit;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 8px 4px 0}.question-controls button[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}.question-controls button:disabled{opacity:.5}.question-controls label{display:block}.question-controls label[hidden]{display:none}.question-controls textarea{display:block;width:100%;font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px}
@media(max-width:540px){.intent-scope{grid-template-columns:1fr}}

/* Intent cards use a fixed reading order on an eight-pixel grid. */
.dcard.intent-card{padding:0;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.intent-card > section,.intent-card .intent-alignment > section,.intent-card > footer{padding:16px;display:grid;gap:8px;min-width:0;border-top:1px solid var(--line)}
.intent-card > .intent-header{border-top:0}
.intent-card > .acts{margin-top:0}
.intent-card .intent-header .gates{padding:0;gap:8px}
.intent-card .intent-alignment{border:0;margin:0;padding:0}
.intent-card h4{font-size:18px;color:var(--brass);margin:0;line-height:1.5}
.intent-card h5{font-size:16px;margin:0;line-height:1.5}
.intent-card p,.intent-card ul,.intent-card aside{margin:0;max-width:72ch}
.intent-card ul{padding-left:24px;display:grid;gap:8px}
.intent-card .intent-why{color:var(--fg2);max-width:72ch}
.intent-card .intent-scope{gap:8px;min-width:0}
.intent-card .intent-scope > div{min-width:0}
.intent-card .acts button,.intent-card .acts label,.intent-card .acts textarea,.intent-card .tradeoffs{font-size:16px;line-height:1.5}
.intent-card .acts .opt{white-space:normal;text-align:left;min-height:44px;max-width:72ch;width:100%;margin:0;color:var(--fg);background:var(--bg3)}
.intent-card .acts .option-box{display:grid;gap:8px;padding:16px;border:1px solid var(--line);background:var(--bg2)}
.intent-card .acts button:disabled{opacity:.55;cursor:default}
.intent-card .acts .option-box[aria-pressed="true"]{border-color:var(--brass);outline:2px solid var(--brass)}
.intent-card .acts .tradeoffs{display:block;font-weight:400;margin:0;color:var(--fg2)}
.intent-card .confirm-question{display:flex;align-items:flex-start;gap:8px;margin:0;min-width:0}
.intent-card .confirm-question > p{flex:1;min-width:0}
.intent-card .question-controls{flex:1;min-width:0;max-width:72ch}
.intent-card .question-controls button{min-height:44px;margin:0 8px 8px 0}

  if (!logAnchor) return;
  const generation = logGeneration;
  const query = new URLSearchParams({before: logNext || logAnchor});
  if (PROJECT) query.set('project', PROJECT);

    const response = await fetch('/api/events?' + query);

    if (response.status === 409 || response.status === 400) {
      const error = await response.json();
      if (generation !== logGeneration) return;
      if (error.code === 'staleCursor' || error.code === 'badCursor') { clearOlderLog(); renderOlderLog(); return; }

    if (generation !== logGeneration) return;

    logEnded = page.next === null;

// Recorded classification wins; old cards keep their authored title fallback.

  if (/^D-SK-/.test(d.id || '')) return 'skill';
  const en = String(d.details?.en?.title || d.title || '');
  const tw = String(d.details?.['zh-TW']?.title || d.title || '');
  for (const [kind, english, chinese] of [
    ['dispatch',DICT.en.kindDispatch + ' ',DICT['zh-TW'].kindDispatch],
    ['repin',DICT.en.kindRepin + ' ',DICT['zh-TW'].kindRepin],
    ['scope',DICT.en.kindScope,DICT['zh-TW'].kindScope],
    ['skill',DICT.en.kindSkillTitlePrefix,DICT['zh-TW'].kindSkill]

}

}

// a task card's identity: its project and its id, as the server wrote it
const keyOf = task => task?.key || task?.id;
const words = s => lang === 'zh-CN' ? cn(String(s ?? '')) : String(s ?? '');
const picks = new Map(), drafts = new Map(), answers = new Map(), sent = new Set(), answered = new Set();

const refused = new Map();
// strips the captain has opened in place; the first card is always open
const expanded = new Set();
const revealedSections = new Set();
const openDecisionSheets = new Set(), openWhys = new Set();
let latest, feedback = null, orderUntil = 0, orderTimer;

const readOnly = () => writable === false;

function pose() {
  const stage = document.getElementById('capstage');
  stage.dataset.pose = sent.size || Date.now() < orderUntil ? 'order' : picks.size ? 'ready' : 'idle';
  const label = stage.querySelector('.lbl span');
  if (label) label.textContent = t(stage.dataset.pose === 'ready' ? 'capReady' : stage.dataset.pose === 'order' ? 'capOrder' : 'capDeciding');
}

function chrome() {
  const themeToggle = document.getElementById("themeToggle"); themeToggle.title = t("themeToggle"); themeToggle.setAttribute("aria-label", t("themeToggle"));
  showRetro();
  document.getElementById("h-brand").innerHTML =
    esc(t("brand")) + "<small>" + esc(t("sub")) + "</small>";
  document.getElementById("awaiting").textContent = t("awaiting");
  document.getElementById("h-fleet").textContent = t("fleet");
  document.getElementById("h-log").textContent = t("log");
  SHIP.patch(document.getElementById("langs"), LANGS.map(l =>
    `<button aria-pressed="${l === lang}" data-l="${l}">${LANGNAME[l]}</button>`).join(""));
  document.getElementById("langs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("board.lang", lang); } catch {}
      document.documentElement.lang = lang; chrome();
      drawTaskDetail();
      // straight away, so the drawing changes language with the chrome
      // rather than after the state comes back
      DIAGRAM.mount(document.getElementById("deck"), lang).catch(() => {});
      fetch(STATE_URL).then(x => x.json()).then(render).catch(() => {}); });

function render(s) {
  // Native details toggles are delivered later. Read live disclosure before
  // any patch can overwrite a just-opened (or just-closed) strip with stale
  // state, regardless of whether this render came from a sheet or a refresh.
  document.querySelectorAll('#deck details.dstrip').forEach(el => {
    if (el.open) expanded.add(el.dataset.id); else expanded.delete(el.dataset.id);
  });
  const focus = document.activeElement;
  const focusSheet = focus?.closest?.('.decision-sheet')?.dataset.id;
  const focusKey = focus?.dataset?.id;
  const focusChoice = focus?.dataset?.c;
  const selection = focus?.tagName === 'TEXTAREA' ? [focus.selectionStart, focus.selectionEnd] : null;
  latest = s;
  refreshTaskDetail();
  prUrls = s.pr_urls || null;
  // A refused merge stays up until the same task or pull request is merged
  // afterwards; the server says which refusals have been overtaken.
  // A merge runs after the answer (T-054): its record says running until the
  // helper exits, then merged or failed.
  const failures = (s.responses || []).filter(d => (d.merge === 'failed' || (!d.merge && d.merged?.ok === false)) && !d.superseded)
    .sort((a,b) => String(a.ts || '').localeCompare(String(b.ts || '')));
  const failed = failures[failures.length - 1];
  if (failed && (feedback?.decisionId !== failed.id || feedback.key !== 'mergeRefused'))
    feedback = {key:'mergeRefused',decisionId:failed.id,task:failed.task};
  if (feedback?.key === 'mergeRefused'
      && (s.responses || []).some(d => d.id === feedback.decisionId && d.superseded)) feedback = null;
  // a merge said running until its record says it went through
  if (feedback?.key === 'mergeRunning'
      && (s.responses || []).some(d => d.id === feedback.decisionId && d.merge === 'merged')) feedback = {...feedback, key:'recorded'};
  document.getElementById("gl").textContent = s.greenlit ? t("greenlit") : t("notGreenlit");
  showWritable();
  // T-127: the vendors actually running now, such as "claude ×2 · cursor-agent ×1";
  // config.yaml's default (eng, below) shows only when no crew is aboard.
  const engine = document.getElementById("engine"), eng = s.engine, live = s.engineLive;
  engine.hidden = !eng && !live;
  engine.className = "vend" + (!live && eng?.cross ? " x" : "");
  engine.innerHTML = live
    ? live.map(v => `<i aria-hidden="true"></i>${esc(v.vendor)}${v.count > 1 ? ` <b>×${esc(v.count)}</b>` : ""}`).join(" · ")
    : eng ? `<i aria-hidden="true"></i>${esc(eng.vendor)}` +
        (eng.cross ? ` <b>⇄ ${esc(eng.reviewer)}</b>` : "") : "";
  engine.title = live ? t("engineLive") : eng ? `${t("engine")}${eng.cross ? " · " + t("crossVendor") : ""}${eng.rule ? ` · ${eng.rule} (${eng.host ?? "?"} → ${eng.vendor})` : ""}` : "";
  document.getElementById("counts").innerHTML = [
    ["merged", t("merged"), s.counts.merged, ""], ["inflight", t("inflight"), s.counts.inflight, ""],
    ["waiting", t("waitingOnYou"), s.counts.waiting ?? 0, "w"],
    ["blocked", t("blocked"), s.counts.blocked, "x"],
    ["ready", t("ready"), s.counts.ready, ""], ["backlog", t("backlog"), s.counts.backlog, ""],
  ].map(([k, l, n, c]) => `<div class="${c}" data-count="${k}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("");

  // whether firstmate is watched: the beacon, the last wake and its reason,
  // what waits, and any gap - work in flight with no live watcher (T-137)
  const wv = WATCH.watchLine(s.watch, t);
  const wl = document.getElementById("watch");
  wl.dataset.watch = wv.state;
  wl.className = wv.state === "on" ? "" : "off";
  wl.innerHTML = [...wv.parts.map(esc), wv.gap ? `<span class="gap">${esc(wv.gap)}</span>` : '']
    .filter(Boolean).join(' · ');

  const badge = b => b.kind === 'gate' ? (b.gate ? t("gateFailedN").replace('{n}', b.gate.n).replace('{label}', t('gate_' + b.gate.name)) : t("gateFailed"))
    : b.kind === 'ask' ? 'ASK-PASS-CRITERIA'
    : b.kind === 'decision' ? (b.options ? `${b.id} · ${t("optionsN").replace('{n}', b.options)}` : b.id)
    : b.kind === 'lost' ? t("lostCrew").replace('{name}', b.actor)
    : b.kind === 'parked' ? t("parkedPending") : '';
  // The server supplies titles from the task's own definition, pin,
  // skill-update proposal or first decision. The page never invents one.
  const title = task => {
    const text = (lang === 'zh-TW' || lang === 'zh-CN') && typeof task.title_tw === 'string' && task.title_tw.trim()
      ? words(task.title_tw) : task.title;
    return `<div class="t${text ? '' : ' missing'}">${said(text || t("titleMissing"), task)}</div>`;
  };
  // a blocker the captain parked or dropped will not arrive by itself, so
  // the card says which it is
  const blocker = b => b.stage === 'parked' ? `${b.id} (${t('parked')})`
    : b.stage === 'closed' ? `${b.id} (${t('dropped')})` : b.id;
  // T-058: the server says which actions a card offers; a card with none is
  // neither draggable nor given a menu
  // T-054: a card is its project and its id, so two projects' T-004 never
  // share a menu, a drag or a drop
  const menu = task => {
    const acts = task.actions || [];
    if (!acts.length) return '';
    // T-145: a tab that cannot write shows the menu disabled, saying why
    if (readOnly()) return `<button class="cmenu" data-key="${esc(keyOf(task))}" disabled${tipAttr()}` +
      ` aria-label="${esc(t('cardActions').replace('{id}', task.id))}">&#8943;</button>`;
    const open = menuOpen === keyOf(task);
    return `<button class="cmenu" data-menu="${esc(task.id)}" data-key="${esc(keyOf(task))}" aria-haspopup="menu" aria-expanded="${open}"` +
      ` aria-label="${esc(t('cardActions').replace('{id}', task.id))}">&#8943;</button>` +
      (open ? `<div class="cacts" role="menu">` + acts.map(a =>
        `<button role="menuitem" data-act="${esc(a)}" data-for="${esc(task.id)}" data-key="${esc(keyOf(task))}">${esc(t(a))}</button>`).join('') + `</div>` : '');
  };
  // T-145: how long the task's latest review round took, wall-clock, as
  // /api/state's last_review says (T-153), and how it ended
  const clock = n => { const h = Math.floor(n / 3600), m = Math.floor(n / 60) % 60, sec = n % 60;
    const two = x => String(x).padStart(2, '0');
    return h ? `${h}:${two(m)}:${two(sec)}` : `${m}:${two(sec)}`; };
  const lastReview = task => {
    const r = task.last_review;
    if (!r || !Number.isInteger(r.seconds) || r.seconds < 0) return '';
    const how = r.outcome === 'approved' ? t('lastReviewApproved') : r.outcome === 'rejected' ? t('lastReviewRejected') : t('lastReviewOther');
    return `<div class="lastrev" data-last-review="${esc(r.seconds)}">` +
      `${esc(t('lastReview').replace('{time}', clock(r.seconds)).replace('{outcome}', how))}</div>`;
  };
  const card = (task, k) => `<div tabindex="0" role="button" aria-haspopup="dialog" class="card s-${k}" data-task="${esc(task.id)}" data-key="${esc(keyOf(task))}"` +
    `${task.project ? ` data-project="${esc(task.project)}"` : ''}${(task.actions || []).some(a => a !== 'reopen') && !readOnly() ? ' draggable="true"' : ''}>` +
    `<div class="hd"><span class="id">${esc(task.id)}</span>${multi() ? chip(task.project) : ''}` +
    `${task.pr ? prRef(task.pr, task.pr_url) : ''}${menu(task)}</div>` +
    title(task) +
    ((task.crew || []).length ? `<div class="crew">${task.crew.map(crewChip).join('')}</div>` : '') +
    lastReview(task) +
    ((task.blocked_on || []).length ? `<div class="dep">${esc(t("blockedOn"))} ${esc((task.blocked_by || task.blocked_on.map(id => ({id}))).map(blocker).join(', '))}</div>` : '') +
    (task.badges || []).map(b => `<span class="badge b-${esc(b.kind)}">${esc(badge(b))}</span>`).join('') + `</div>`;
  SHIP.patch(document.getElementById("lanes"), (s.lanes || []).map(k => {
    let items = s.tasks.filter(task => task.stage === k), more = '';
    if (k === 'merged') {
      // newest first; the rest are one click away in the history
      items = [...items].sort((a, b) => (b.merged_seq ?? -1) - (a.merged_seq ?? -1));
      if (items.length > MERGED_SHOWN)
        more = `<p class="more">${esc(t("mergedMore").replace('{n}', items.length - MERGED_SHOWN))}</p>`;
    }
    const total = items.length;
    if (k === 'merged') items = items.slice(0, MERGED_SHOWN);
    // ready and backlog take a parked card back; where it lands is up to its
    // dependencies, not to which of the two it was dropped on
    const zone = k === 'ready' || k === 'backlog' ? ' data-zone="unpark"' : '';
    return `<div class="lane l-${k}" data-lane="${k}"${zone}><h3>${esc(t(laneKey(k)))}<i>${total}</i></h3>` +
      items.map(task => card(task, k)).join("") + more + `</div>`;
  }).join(""));

  // the parked group below the lanes, collapsed until opened
  const parkedTasks = s.tasks.filter(task => task.stage === 'parked');
  const parkedGroup = document.getElementById('parked');
  parkedGroup.querySelector('summary').innerHTML = `${esc(t('parked'))} <i>${parkedTasks.length}</i>`;
  SHIP.patch(parkedGroup.querySelector('.parked-cards'), parkedTasks.map(task => card(task, 'parked')).join(''));
  document.getElementById('dropzone').textContent = t('dropZone');
  // the confirming step, in the page: it goes away by itself if the task
  // stopped offering the action while it was up
  if (confirming && !(s.tasks.find(x => keyOf(x) === confirming)?.actions || []).includes(confirmAction)) { confirming = null; confirmAction = null; }
  if (menuOpen && !(s.tasks.find(x => keyOf(x) === menuOpen)?.actions || []).length) menuOpen = null;
  const confirmBox = document.getElementById('dropConfirm');
  confirmBox.hidden = !confirming;
  const doomed = confirming ? s.tasks.find(x => keyOf(x) === confirming) : null;
  // T-118: setting aside work in flight says what it stops and what it
  // leaves: the crew aboard are stopped, the pull request stays open
  const notes = doomed && confirmAction !== 'reopen' ? [
    (doomed.crew || []).length ? t('crewStopNote').replace('{crew}', doomed.crew.map(c => c.name).join(', ')) : '',
    doomed.pr ? t('prStaysOpen').replace('{pr}', '#' + doomed.pr) : ''].filter(Boolean) : [];
  const question = !doomed ? '' : confirmAction === 'drop' ? t('dropConfirm').replace('{id}', doomed.id)
    // a pending card outranks a park: parked from the captain's lane, the
    // task stays there until its card is answered, and the text says so
    : confirmAction === 'park' ? t(doomed.stage === 'captain' ? 'parkConfirmCaptain' : 'parkConfirm').replace('{id}', doomed.id)
    : t('reopenConfirm').replace('{id}', doomed.id).replace('{stage}', laneLabel(doomed.stage));
  const yes = confirmAction === 'drop' ? 'dropYes' : confirmAction === 'park' ? 'parkYes' : 'reopenYes';
  // the drop's own attributes stay on its buttons, as T-058 named them
  const dropMark = (a, id) => confirmAction === 'drop' ? ` ${a}="${esc(id)}"` : '';
  const reopenForm = doomed && confirmAction === 'reopen'
    ? `<label>${esc(t('reopenReason'))}<textarea data-reopen-reason data-key="${esc(confirming)}">${esc(reopenReason)}</textarea></label>` : '';
  const ready = confirmAction !== 'reopen' || reopenReason.trim();
  SHIP.patch(confirmBox, doomed ? `<p id="dropConfirmText">${esc(question)}` +
    `${multi() ? ' ' + chip(doomed.project) : ''}</p>` +
    notes.map(n => `<p class="note">${said(n, doomed)}</p>`).join('') + reopenForm +
    `<div class="acts"><button class="go" data-confirm="${esc(confirmAction)}"${dropMark('data-confirm-drop', doomed.id)} data-key="${esc(confirming)}"${ready ? '' : ' disabled'}>${esc(t(yes))}</button>` +
    `<button data-cancel="${esc(confirmAction)}"${dropMark('data-cancel-drop', doomed.id)} data-key="${esc(confirming)}">${esc(t('cancel'))}</button></div>` : '');
  confirmBox.setAttribute('aria-labelledby', 'dropConfirmText');
  document.getElementById('taskFeedback').textContent = taskFeedback ? t(taskFeedback) : '';

  const completed = s.tasks.filter(item => ['merged','closed'].includes(item.stage));
  const history = document.getElementById('history');
  history.querySelector('summary').textContent = `${t('history')} · ${t('laneMerged')} ${completed.filter(x=>x.stage==='merged').length} · ${t('laneClosed')} ${completed.filter(x=>x.stage==='closed').length}`;
  // T-118: a finished task the lanes do not show - every closed one, and the
  // merged ones past the lane's first few - is reopened from here
  const inLane = new Set([...document.querySelectorAll('#lanes [data-key]')].map(el => el.dataset.key));
  SHIP.patch(history.querySelector('.history-cards'), completed.map(item =>
    `<div tabindex="0" role="button" aria-haspopup="dialog" class="card s-${item.stage}" data-task="${esc(item.id)}" data-key="${esc(keyOf(item))}" data-project="${esc(item.project || '')}" data-history="${esc(item.id)}"><div class="hd"><span class="id">${esc(item.id)}</span>${multi() ? ' ' + chip(item.project) : ''} <span>${esc(t(item.stage==='merged'?'laneMerged':'laneClosed'))}</span>` +
    (item.pr ? ` ${prRef(item.pr, item.pr_url)}` : '') + (inLane.has(keyOf(item)) ? '' : menu(item)) + `</div>` + title(item) + `</div>`).join(''));

  const deck = document.getElementById("deck");
  const wrap = document.getElementById("deckwrap");
  // in the server's order: every project's cards in one list, oldest request
  // first, so answering one never moves another
  const pend = [...(s.pending || [])];
  const pendingIds = new Set(pend.map(d => d.id));
  for (const set of [openDecisionSheets, openWhys]) for (const id of set) if (!pendingIds.has(id)) set.delete(id);
  for (const id of answered) if (!pendingIds.has(id)) answered.delete(id);
  for (const key of revealedSections) if (!pendingIds.has(JSON.parse(key)[0])) revealedSections.delete(key);
  for (const id of [...picks.keys()]) if (!pendingIds.has(id)) picks.delete(id);
  for (const id of [...drafts.keys()]) if (!pendingIds.has(id)) drafts.delete(id);
  for (const id of [...answers.keys()]) if (!pendingIds.has(id)) answers.delete(id);
  for (const id of [...sent]) if (!pendingIds.has(id)) sent.delete(id);
  for (const id of [...expanded]) if (!pendingIds.has(id)) expanded.delete(id);
  for (const id of [...refused.keys()]) if (!pendingIds.has(id)) refused.delete(id);
  // merges answered and still running: said by name, and "outcome unknown"
  // when GitHub could not tell the board how one ended
  const runningMerges = (s.responses || []).filter(d => d.merge === 'running');
  // T-118: an answer whose effect failed stays up with its reason until what
  // it asked for has happened some other way; a merge's is the refusal above
  const failedEffects = (s.responses || []).filter(d => d.effect_outcome === 'failed' && d.effect !== 'merge' && !d.effect_superseded);
  wrap.hidden = pend.length === 0 && !feedback && !runningMerges.length && !failedEffects.length;
  if (!document.getElementById('effects')) {
    const list = document.createElement('ul'); list.id = 'effects';
    list.setAttribute('role', 'status'); list.setAttribute('aria-live', 'polite');
    wrap.insertBefore(list, wrap.querySelector('.deckrow'));
  }
  SHIP.patch(document.getElementById('effects'), failedEffects.map(d =>
    `<li id="effect-${esc(d.id)}" data-effect="${esc(d.effect)}">${esc(d.id)}${multi() ? ' · ' + chip(projOf(d)) : ''} · ${esc(d.task || '')} · ` +
    `${esc(t('effectFailed').replace('{effect}', effectLabel(d.effect)))}: ${said(d.effect_reason || '', d)}</li>`).join(''));
  if (!document.getElementById('merging')) {
    const list = document.createElement('ul'); list.id = 'merging';
    list.setAttribute('role', 'status'); list.setAttribute('aria-live', 'polite');
    wrap.insertBefore(list, wrap.querySelector('.deckrow'));
  }
  SHIP.patch(document.getElementById('merging'), runningMerges.map(d =>
    `<li id="merging-${esc(d.id)}" class="${d.merge_unknown ? 'unknown' : 'running'}">${esc(d.id)}` +
    `${multi() ? ' · ' + chip(projOf(d)) : ''}${d.pr ? ' · ' + prRef(d.pr, d.pr_url) : ''} · ` +
    `${esc(t(d.merge_unknown ? 'mergeUnknown' : 'mergeRunning'))}</li>`).join(''));
  if (!document.getElementById('orderFeedback')) {
    const status = document.createElement('p'); status.id = 'orderFeedback';
    status.setAttribute('role', 'status'); status.setAttribute('aria-live', 'polite');
    wrap.append(status);
  }
  document.getElementById("pcount").textContent = pend.length || "";
  // Links go only where the data is: a local file the record names, the pull
  // request it names, and design.md when the repository has one.
  const links = d => {
    const out = [];
    const project = d.project || s.project || s.default_project || '';
    const query = project ? `&project=${encodeURIComponent(project)}` : '';
    if (typeof d.path === 'string' && d.path)
      out.push(`<a href="/file?path=${encodeURIComponent(d.path)}${query}" data-project="${esc(project)}" data-open="${esc(d.path)}" target="_blank" rel="noreferrer">&#8599; ${esc(t("openLocal"))}</a>`);
    if (d.pr) out.push(prRef(d.pr, d.pr_url, 'prlink', `${esc(t("viewPr"))} #${esc(d.pr)}`));
    const designPath = s.design_docs?.[project];
    if (designPath)
      out.push(`<a href="/file?path=${encodeURIComponent(designPath)}${query}" data-project="${esc(project)}" data-open="${esc(designPath)}" target="_blank" rel="noreferrer">&#9776; ${esc(t("viewDesign"))}</a>`);
    return out.length ? `<div class="links">${out.join('')}</div>` : '';
  };
  // whose card it is: an id that names its owner (T-047) shows the project and
  // task read out of it; a project's name is data and is not translated. With
  // several projects on the board every card carries its recorded project,
  // which is also the one its merge runs in (T-054). A board of one project
  // shows an owned id exactly as it did before, with no chip.
  const whose = d => {
    const own = d.owner || DIAGRAM.owner(d.id);
    const p = multi() ? chip(projOf(d))
      : own ? `<span class="project">${esc(own.project)}</span>` : '';
    return `${esc(d.id)}${p ? ` · ${p}` : ''} · ${esc(d.task || own?.task || '')}`;
  };
  const full = d => {
    const gates = d.gates || [], content = localized(d), pick = picks.get(d.id);
    // an answered card, or a tab that cannot write (T-122), takes no choice
    const locked = sent.has(d.id) || answered.has(d.id) || readOnly();
    // D only where the card offers it: a readiness card's drop (T-059);
    // a retrospective card offers A and C only (T-273)
    const options = ['A','B','C', ...(d.details?.en?.options?.D ? ['D'] : [])]
      .filter(k => d.purpose !== 'retro' || k === 'A' || k === 'C').map(k => {
      const o = content?.options?.[k];
      // T-118: what the option does when chosen, as the server will carry it out
      const eff = d.details?.effect?.[k] ?? (d.kind === 'merge' ? (k === 'A' ? 'merge' : 'hold') : null);
      return `<button class="opt" data-id="${esc(d.id)}" data-c="${k}" aria-pressed="${pick === k}" ${locked?'disabled':''}${tipAttr()}>${k}${o || k !== 'D' ? ' · ' : ''}${esc(o ? words(o.description) : k === 'D' ? '' : t(k === 'A' ? (d.kind === 'merge' ? 'mergeInto' : 'chooseA') : k === 'B' ? 'sendBack' : 'hold'))}` +
        `${eff ? ` <i class="eff">→ ${esc(effectLabel(eff))}</i>` : ''}</button>` +
        (o ? `<p class="tradeoffs"><b>${esc(t('pros'))}</b> ${said(words(o.pros), d)}<br><b>${esc(t('cons'))}</b> ${said(words(o.cons), d)}</p>` : '');
    }).join('');
    return `<div class="dcard${content?.intent ? ' intent-card' : ''}" id="card-${esc(d.id)}">${content?.intent ? '<section class="intent-header">' : ''}<div class="meta">${kindBadge(d)} ${whose(d)}` +
      `${stePill(d)}</div><h3>${said(content ? words(content.title) : d.title || t("waiting"), d)}</h3>` +
      // T-118: a card whose task is already merged or closed is shown, and
      // says so: it may have been raised under the wrong task
      (d.task_final ? `<p class="final-note" role="note">${esc(t('finalNote').replace('{task}', d.task || '').replace('{stage}', laneLabel(d.task_final)))}</p>` : '') +
      links(d) +
      (content?.intent ? '' : `<p class="explanation">${said(content ? words(content.explanation) : t('missingDetails'), d)}</p>`) +
      (content?.intent ? '' : DIAGRAM.embed(d.id) + (content ? `<div class="change-fallback"><section><b>${esc(t('before'))}</b><p>${said(words(content.before || (content.before_nodes || []).map(node => node.label).join(' → ')), d)}</p></section><span aria-hidden="true">→</span><section><b>${esc(t('after'))}</b><p>${said(words(content.after || (content.after_nodes || []).map(node => node.label).join(' → ')), d)}</p></section></div>` : '') + plainBlock(content)) +

      (d.kind === "merge" && d.gates
        ? `<ul class="gates">${GATES().map(({n,name})=>{const g=t("gate_"+name), warning=gates[name]==="not_runnable", ok=gatePassed(gates,name);return `<li class="${warning?"w":ok?"y":"n"}"><i>${warning?"&#9888;":ok?"&#10003;":"&#8211;"}</i>${n}. ${esc(g)}${warning?` · ${esc(t('gateNotRunnable').replace('{reason}', () => d.not_runnable?.[name] || ''))}`:''}</li>`;}).join("")}</ul>`
        : "") +
      (d.kind === "merge" && GATES().some(({name}) => gates?.[name] === "not_runnable")
        ? `<p class="ci-only-evidence" role="note">${esc(t('ciOnlyEvidence'))}</p>` : '') +
      (content?.intent ? `</section>${intentBody(d, content, locked)}` :
      retroItemsHtml(d, content, locked) +
      `<div class="decision-bar">${decisionDetailsButton(d)}<div class="acts">${options}

    const effectDone = r.effect && r.effect !== 'merge' && r.outcome === 'done';
    const changeRequested = r.decision?.chosen === 'change';
    feedback = {key:changeRequested ? 'changeRequested' : merge === 'failed' ? 'mergeRefused' : merge === 'running' ? 'mergeRunning'
      : effectFailed ? 'effectRefused' : chosen === 'custom' ? 'customRecorded' : effectDone ? 'effectDone' : 'recorded', decisionId:id,
      task:decision?.task || r.decision?.task || null,
      cry:changeRequested || effectFailed ? '' : 'AYE, CAPTAIN! / ORDERS AWAY', decision,
      literal:changeRequested ? '' : chosen === 'custom' ? text : r.effect && r.effect !== 'merge' ? `${effectLabel(r.effect)}${r.reason ? ': ' + r.reason : ''}` : '',
      eventFailed:r.eventRecorded === false};
    if (['recorded', 'customRecorded', 'effectDone', 'mergeRunning'].includes(feedback.key)) {
      orderUntil = Date.now() + 3200;
      clearTimeout(orderTimer);
      orderTimer = setTimeout(() => render(latest), 3200);
    } else {
      orderUntil = 0;
      clearTimeout(orderTimer);
    }
  }
  render(latest);
  fetch(STATE_URL).then(x => x.json()).then(render).catch(() => {});
}
// T-058: park, unpark and drop. Two ways to each - the card's menu (which is
// also the keyboard path) and drag and drop - and one way to the server.
// T-054: each is addressed by the card's key, its project and its id.
const taskByKey = k => (latest?.tasks || []).find(x => keyOf(x) === k);
const actionsOf = k => taskByKey(k)?.actions || [];
async function act(k, action, extra = {}) {
  menuOpen = null; confirming = null; confirmAction = null; taskFeedback = null;
  const task = taskByKey(k);
  const r = task && !readOnly() ? await fetch('/tasks', {
    method: 'POST', headers: credential({ 'content-type': 'application/json' }),
    body: JSON.stringify({ task: task.id, action, ...(task.project ? { project: task.project } : {}), ...extra }),
  }).catch(() => null) : null;
  // every refusal is shown by its own code - T-122's 403s, and T-118's 409
  // asking to confirm and 400 asking for a reason - and only an unknown one
  // falls back to the generic line
  const said = !r || r.ok ? null : r.status === 403 ? await refusedFor(r) : await r.json().catch(() => null);
  if (!r || !r.ok) taskFeedback = said?.code && Object.hasOwn(DICT.en, said.code) ? said.code : 'actionFailed';
  if (action === 'reopen' && r?.ok) reopenReason = '';
  const s = await fetch(STATE_URL).then(x => x.json()).catch(() => null);
  render(s || latest);
}
// T-118: which actions ask first - a drop always, a reopening always, a
// park when the server says the task has crew aboard or an open pull request
const asks = (k, action) => action === 'drop' || action === 'reopen' || (action === 'park' && taskByKey(k)?.confirm);
function askFor(k, action) {
  menuOpen = null; confirming = k; confirmAction = action;
  if (action === 'reopen') reopenReason = '';
  render(latest);
  document.querySelector(action === 'reopen' ? '[data-reopen-reason]' : '[data-confirm]')?.focus();
}
const choose = (k, action) => asks(k, action) ? askFor(k, action) : act(k, action);
const menuButton = k => document.querySelector(`.cmenu[data-key="${CSS.escape(k)}"]`);
const board = document.querySelector('.lanes-wrap');
let detailDragged = false;
board.addEventListener('pointerdown', () => { detailDragged = false; });
board.addEventListener('click', event => {
  if (detailDragged || event.target.closest('a,button,input,textarea,[data-pr],[data-drag-handle]')) return;
  const card = event.target.closest('.card[data-key]');
  if (card) openTaskDetail(card.dataset.key, card);
});
board.addEventListener('keydown', event => {
  if (!['Enter',' '].includes(event.key) || !event.target.matches('.card[data-key]')) return;
  event.preventDefault(); openTaskDetail(event.target.dataset.key, event.target);
});
board.addEventListener('click', e => {
  const el = e.target.closest('[data-menu],[data-act],[data-confirm],[data-cancel]');
  if (!el) return;
  const k = el.dataset.key;
  if (el.dataset.menu) {
    menuOpen = menuOpen === k ? null : k; render(latest);
    if (menuOpen) document.querySelector(`.cacts [data-key="${CSS.escape(k)}"]`)?.focus();
  } else if (el.dataset.act) {
    choose(k, el.dataset.act);
  } else if (el.dataset.confirm) {
    // confirmed in the page: the server sets aside work in flight, and
    // reopens a final task, only when told the captain confirmed it
    const action = el.dataset.confirm;
    act(k, action, action === 'reopen' ? {confirm:true, reason:reopenReason} : {confirm:true});
  } else if (el.dataset.cancel) {
    confirming = null; confirmAction = null; render(latest);
    menuButton(k)?.focus();
  }
});
// the reopening's reason, kept as typed across every render
board.addEventListener('input', e => {
  const el = e.target;
  if (!el.matches?.('[data-reopen-reason]')) return;
  reopenReason = el.value;
  const go = document.querySelector('#dropConfirm [data-confirm="reopen"]');
  if (go) go.disabled = !reopenReason.trim();
});
board.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !(menuOpen || confirming)) return;
  const k = menuOpen || confirming;
  menuOpen = null; confirming = null; confirmAction = null; render(latest);
  menuButton(k)?.focus();
});
// T-069: a press that starts on a pull request number is a click on its
// link, never the start of dragging the card it sits on
let pressedOn = null;
board.addEventListener('pointerdown', e => { pressedOn = e.target; }, true);
board.addEventListener('dragstart', e => {
  if (e.target.closest?.('.card')) detailDragged = true;
  if (pressedOn?.closest?.('a[data-pr]')) { e.preventDefault(); return; }
  const cardEl = e.target.closest?.('.card[draggable="true"]');
  if (!cardEl) return;
  dragging = cardEl.dataset.key || cardEl.dataset.task;
  e.dataTransfer.setData('text/plain', cardEl.dataset.task);
  e.dataTransfer.effectAllowed = 'move';
  board.classList.add('dragging');
});
board.addEventListener('dragend', () => {
  dragging = null; board.classList.remove('dragging');
  board.querySelectorAll('.over').forEach(el => el.classList.remove('over'));
});
// a zone takes a card only when that card offers the zone's action
const zoneFor = e => {
  const z = e.target.closest?.('[data-zone]');
  return z && dragging && actionsOf(dragging).includes(z.dataset.zone) ? z : null;
};
board.addEventListener('dragover', e => {
  const z = zoneFor(e);
  if (!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; z.classList.add('over');
});
board.addEventListener('dragleave', e => {
  const z = e.target.closest?.('[data-zone]');
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
board.addEventListener('drop', e => {
  const z = zoneFor(e);
  if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const id = dragging; dragging = null; board.classList.remove('dragging');
  choose(id, z.dataset.zone);
});

let es;
function connect() {
  es = new EventSource(EVENTS_URL);
  es.addEventListener("state", e => { document.getElementById("live").classList.remove("off"); render(JSON.parse(e.data)); });
  es.addEventListener("reload", () => location.reload());
  es.onerror = () => { document.getElementById("live").classList.add("off"); es.close();
    // a board that came back may hold another secret: ask again
    setTimeout(() => { connect(); checkSession(); }, 1500); };
}
fetch("/api/i18n").then(r => r.json()).then(dd => { DICT = dd; })
  .catch(() => {})
  .finally(() => {
    document.documentElement.lang = lang;
    chrome();
    checkSession();
    connect();
    fetch(STATE_URL).then(r => r.json()).then(render).catch(() => {});
  });
</script>
<script src="board.js"></script>
</body>
