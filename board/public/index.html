<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captain's Board</title>
<link rel="stylesheet" href="ship.css">
<style>
:root{
  --bg:#080f17; --bg2:#0e1720; --bg3:#16212c; --line:#213041;
  --fg:#e8eff7; --fg2:#93a7bd; --fg3:#5d7188; --brass:#d9a441;
  --ok:#3ecf8e; --warn:#f2b544; --bad:#f2645a; --wait:#c07bf0; --accent:#4da3ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);padding-bottom:40px}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--bg2);position:sticky;top:0;z-index:5}
.top b{font-weight:650} .top small{display:block;font:400 10.5px var(--mono);color:var(--fg3);
  letter-spacing:.08em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.15)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(242,100,90,.15)}
.spacer{flex:1}
.counts{display:flex;gap:22px;padding:14px 20px;border-bottom:1px solid var(--line)}
.counts b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.counts span{font:10.5px var(--mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.09em}
.counts .w b{color:var(--wait)} .counts .x b{color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px 20px}
@media(max-width:860px){main{grid-template-columns:1fr}}
section>h2{margin:0 0 10px;font:600 10.5px var(--mono);color:var(--fg3);
  text-transform:uppercase;letter-spacing:.1em}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.lane{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:70px}
.lane h3{margin:0 0 8px;font:600 10px var(--mono);color:var(--fg3);text-transform:uppercase;
  letter-spacing:.08em;display:flex;justify-content:space-between}
.lane h3 i{font-style:normal;background:var(--bg3);border-radius:99px;padding:0 7px;color:var(--fg2)}
.card{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--edge,#26323d);
  border-radius:8px;padding:8px 9px;margin-bottom:7px}
.card .id{font:600 10.5px var(--mono);color:var(--fg3)}
.card .t{font-size:12px;line-height:1.35;margin-top:3px}
.card .pr{font:600 10px var(--mono);color:var(--accent)}
.s-working{--edge:#2f5478} .s-review{--edge:#5a3f7d} .s-gate{--edge:#7c322b}
.s-captain{--edge:#8a6a2f} .s-merged{--edge:#2c5f49} .s-closed{--edge:#3a3a3a}
.log{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log ul{margin:0;padding:6px 0;list-style:none;max-height:64vh;overflow:auto}
.log li{display:grid;grid-template-columns:62px 90px 1fr;gap:10px;padding:5px 13px;font-size:12px;
  border-bottom:1px solid rgba(33,48,65,.5)}
.log li:last-child{border-bottom:0}
.log time{font:11px var(--mono);color:var(--fg3)}
.log .who{font:600 11px var(--mono);color:var(--fg2);overflow:hidden;text-overflow:ellipsis}
.log .k-merged{color:var(--ok)} .log .k-gate_failed{color:var(--bad)}
.log .k-approved{color:var(--ok)} .log .k-decision_requested{color:var(--wait)}
.log .k-greenlit{color:var(--brass)} .log .k-vendor_unavailable{color:var(--warn)}
.empty{color:var(--fg3);font-size:12px;padding:10px 13px}
.langs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:12px}
.langs button{padding:4px 11px;font:12px var(--sans);color:var(--fg2);background:none;border:none;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed=true]{background:#1d4b7a;color:#fff}
#pcount{background:var(--wait);color:#1a0d28;border-radius:99px;font:800 10px var(--mono);padding:1px 7px}
.dcard{background:var(--bg2);border:1px solid #3a2a52;border-radius:12px;padding:16px 18px;margin-bottom:10px}
.dcard h3{margin:0 0 4px;font-size:17px;line-height:1.35}
.dcard .meta{font:11px var(--mono);color:var(--fg3)}
.gates{margin:12px 0 0;padding:0;list-style:none;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:3px 14px}
.gates li{font-size:12px;color:var(--fg2);display:flex;gap:8px}
.gates li i{font-style:normal;width:12px;text-align:center;color:var(--ok)}
.gates li.n i{color:var(--warn)} .gates li.n{color:var(--fg3)}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.acts button{font:750 12.5px var(--sans);border:none;border-radius:9px;padding:8px 18px;cursor:pointer}
.acts .go{background:linear-gradient(180deg,#e0b055,#b8862c);color:#2a1c05;box-shadow:0 2px 0 #6d4d13}
.acts .go:active{transform:translateY(2px);box-shadow:none}
.acts .alt{background:var(--bg3);color:var(--fg2);border:1px solid var(--line)}
.acts .said{font:11px var(--mono);color:var(--brass)}
.dcard a{color:var(--accent);font:11px var(--mono)}
</style>
</head>
<body>
<div class="top">
  <span class="dot" id="live"></span>
  <b id="h-brand"></b>
  <span class="spacer"></span>
  <span id="gl" style="font:600 11px var(--mono);color:var(--brass)"></span>
  <span class="langs" id="langs"></span>
</div>
<div class="counts" id="counts"></div>
<section style="padding:0 20px">
   <div class="scene" id="scene"></div>
  <div class="roster" id="roster"></div>
</section>
<section id="deckwrap" style="padding:0 20px" hidden>
  <h2 style="margin:16px 0 10px;font:600 10.5px var(--mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.1em">
    <span id="awaiting"></span> <span id="pcount"></span></h2>
  <div id="deck"></div>
</section>
<main>
  <section>
    <h2 id="h-fleet"></h2>
    <div class="lanes" id="lanes"></div>
  </section>
  <section>
    <h2 id="h-log"></h2>
    <div class="log"><ul id="log"></ul></div>
  </section>
</main>
<script src="ship.js"></script>
<script>
const LANES = [["queued","laneQueued"],["working","laneWorking"],["gate","laneGate"],
               ["review","laneReview"],["captain","laneCaptain"],["merged","laneMerged"]];
// every string the reader sees comes from the dictionary; zh-CN is derived
// from zh-TW by the table, so there is no third file to keep in step
const LANGS = ["en", "zh-TW", "zh-CN"], LANGNAME = { "en": "EN", "zh-TW": "\u7e41", "zh-CN": "\u7b80" };
let lang = localStorage.getItem("board.lang") ||
  new URLSearchParams(location.search).get("lang") || "zh-TW";
if (!LANGS.includes(lang)) lang = "zh-TW";
let DICT = { en: {}, "zh-TW": {}, tw2cn: [] };
const cn = (x) => DICT.tw2cn.reduce((acc, pair) => acc.split(pair[0]).join(pair[1]), x);
const t = (k) => lang === "zh-CN" ? cn(DICT["zh-TW"][k] ?? DICT.en[k] ?? k)
                                  : (DICT[lang] && DICT[lang][k]) || DICT.en[k] || k;
const GATES = () => [1,2,3,4,5,6,7].map(n => t("gate" + n));
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function chrome() {
  document.getElementById("h-brand").innerHTML =
    esc(t("brand")) + "<small>" + esc(t("sub")) + "</small>";
  document.getElementById("awaiting").textContent = t("awaiting");
  document.getElementById("h-fleet").textContent = t("fleet");
  document.getElementById("h-log").textContent = t("log");
  document.getElementById("langs").innerHTML = LANGS.map(l =>
    `<button aria-pressed="${l === lang}" data-l="${l}">${LANGNAME[l]}</button>`).join("");
  document.getElementById("langs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { lang = b.dataset.l; localStorage.setItem("board.lang", lang);
      document.documentElement.lang = lang; chrome();
      fetch("/api/state").then(x => x.json()).then(render).catch(() => {}); });
}

let lastMerged = null;
function render(s) {
  document.getElementById("gl").textContent = s.greenlit ? t("greenlit") : t("notGreenlit");
  document.getElementById("counts").innerHTML = [
    [t("merged"), s.counts.merged, ""], [t("inflight"), s.counts.inflight, ""],
    [t("blocked"), s.counts.blocked, "x"], [t("queued"), s.counts.queued, ""],
  ].map(([l, n, c]) => `<div class="${c}"><b>${n}</b><span>${l}</span></div>`).join("");

  document.getElementById("lanes").innerHTML = LANES.map(([k, label]) => {
    const items = s.tasks.filter(t => t.stage === k);
    return `<div class="lane"><h3>${t(label)}<i>${items.length}</i></h3>` +
      items.map(t => `<div class="card s-${k}"><span class="id">${esc(t.id)}</span>` +
        (t.pr ? ` <span class="pr">#${t.pr}</span>` : "") +
        `<div class="t">${esc(t.title)}</div></div>`).join("") + `</div>`;
  }).join("");

  const deck = document.getElementById("deck");
  const wrap = document.getElementById("deckwrap");
  const pend = s.pending || [];
  wrap.hidden = pend.length === 0;
  document.getElementById("pcount").textContent = pend.length || "";
  deck.innerHTML = pend.map(d => {
    const gates = (d.gates || []).length ? d.gates : [1,1,1,1,1,1,0];
    return `<div class="dcard"><div class="meta">${esc(d.id)} · ${esc(d.task || "")}` +
      (d.pr ? ` · <a href="https://github.com/BenjaminLu/firstmate-workflow/pull/${d.pr}" target="_blank" rel="noreferrer">#${d.pr}</a>` : "") +
      `</div><h3>${esc(d.title || t("waiting"))}</h3>` +
      (d.kind === "merge"
        ? `<ul class="gates">${GATES().map((g,i)=>`<li class="${gates[i]?"y":"n"}"><i>${gates[i]?"&#10003;":"&#8211;"}</i>${i+1}. ${g}</li>`).join("")}</ul>`
        : "") +
      `<div class="acts">
         <button class="go"  data-id="${esc(d.id)}" data-c="A">${d.kind==="merge"?esc(t("mergeInto")):esc(t("chooseA"))}</button>
         <button class="alt" data-id="${esc(d.id)}" data-c="B">${esc(t("sendBack"))}</button>
         <button class="alt" data-id="${esc(d.id)}" data-c="C">${esc(t("hold"))}</button>
         <span class="said" id="said-${esc(d.id)}"></span>
       </div></div>`;
  }).join("");
  deck.querySelectorAll("button").forEach(b => b.onclick = () => answer(b.dataset.id, b.dataset.c));

  const crew = SHIP.render(document.getElementById("scene"), s, t);
  SHIP.roster(document.getElementById("roster"), crew, t);
  // a merge that lands while the board is open is worth a broadside
  if (lastMerged !== null && s.counts.merged > lastMerged) SHIP.ahoy(document.getElementById("scene"));
  lastMerged = s.counts.merged;

  const log = document.getElementById("log");
  log.innerHTML = s.recent.length ? s.recent.map(e => {
    const t = (e.ts || "").slice(11, 19);
    const text = (e.summary && (e.summary.en || e.summary["zh-TW"])) || e.type;
    return `<li><time>${esc(t)}</time><span class="who">${esc(e.actor)}</span>` +
      `<span class="k-${esc(e.type)}">${esc(text)}</span></li>`;
  }).join("") : `<li class="empty">${esc(t("nothingYet"))}</li>`;
}

async function answer(id, chosen) {
  const said = document.getElementById("said-" + id);
  if (said) said.textContent = t("sending");
  const r = await fetch("/decisions", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ id, chosen }),
  }).then(x => x.json()).catch(() => ({ error: t("unreachable") }));
  if (said) said.textContent = r.error ? r.error
    : r.merged ? (r.merged.ok ? r.merged.out : t("mergeRefused")) : t("recorded");
  fetch("/api/state").then(x => x.json()).then(render).catch(() => {});
}

let es;
function connect() {
  es = new EventSource("/events");
  es.addEventListener("state", e => { document.getElementById("live").classList.remove("off"); render(JSON.parse(e.data)); });
  es.addEventListener("reload", () => location.reload());
  es.onerror = () => { document.getElementById("live").classList.add("off"); es.close(); setTimeout(connect, 1500); };
}
fetch("/api/i18n").then(r => r.json()).then(dd => { DICT = dd; })
  .catch(() => {})
  .finally(() => {
    document.documentElement.lang = lang;
    chrome();
    connect();
    fetch("/api/state").then(r => r.json()).then(render).catch(() => {});
  });
</script>
</body>
</html>
