<!doctype html>
<!--
  PROTOTYPE - THROWAWAY. Not production code. No tests, no error handling.
  Question: "What should the captain's board look like?"
  Three structurally different variants of the captain's board, switchable via
  ?variant=A|B|C, on a standalone throwaway page (sub-shape B: no existing page).
  Fake data only. Nothing here is wired to a real backend.
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE - Captain's Board</title>
<style>
:root{
  --bg:#0b1016; --bg2:#111923; --bg3:#18222e; --line:#243141;
  --fg:#e6edf5; --fg2:#93a4b8; --fg3:#5f7186;
  --accent:#4da3ff; --accent2:#0d5ba8;
  --ok:#3ecf8e; --warn:#f2b544; --bad:#f2645a; --idle:#5f7186; --wait:#c07bf0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans CJK TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:88px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.86em}

/* ---------- shared chrome (header + lang + flow overlay) ---------- */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.15)}
.brand small{display:block;font-weight:400;color:var(--fg3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.top .spacer{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.langs button{padding:5px 11px;font-size:12px;color:var(--fg2)}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed=true]{background:var(--accent2);color:#fff}
.ghost{padding:5px 11px;font-size:12px;color:var(--fg2);border:1px solid var(--line);border-radius:7px}
.ghost:hover{color:var(--fg);border-color:var(--fg3)}

.overlay{position:fixed;inset:0;background:rgba(3,7,12,.82);z-index:60;display:none;overflow:auto;padding:40px 20px}
.overlay.on{display:block}
.overlay .sheet{max-width:1000px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:26px}
.overlay h2{margin:0 0 18px;font-size:17px}

/* lifecycle diagram */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .st{flex:1 1 128px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 12px;position:relative}
.flow .st b{display:block;font-size:12.5px;margin-bottom:3px}
.flow .st span{font-size:11px;color:var(--fg2);line-height:1.4;display:block}
.flow .st.gate{border-color:#4a3a1a;background:#1c1710}
.flow .st.cap{border-color:#3a2a52;background:#181226}
.flow .arrow{align-self:center;color:var(--fg3);font-size:16px}
.gatelist{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.gatelist li{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;font-size:12.5px}
.gatelist li b{color:var(--warn);font-family:var(--mono);margin-right:7px}

/* ---------- shared atoms ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-merged{color:var(--ok);background:rgba(62,207,142,.12)}
.s-review{color:var(--accent);background:rgba(77,163,255,.12)}
.s-working{color:var(--accent);background:rgba(77,163,255,.12)}
.s-gate{color:var(--bad);background:rgba(242,100,90,.12)}
.s-queued{color:var(--idle);background:rgba(95,113,134,.15)}
.s-captain{color:var(--wait);background:rgba(192,123,240,.14)}
.tid{font-family:var(--mono);font-size:11.5px;color:var(--fg3);letter-spacing:.03em}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.links a,.links button{font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--fg2);display:inline-flex;gap:5px;align-items:center}
.links a:hover,.links button:hover{color:var(--fg);border-color:var(--accent);text-decoration:none}
.muted{color:var(--fg2)}
.tiny{font-size:11.5px}

/* ---------- VARIANT A : bridge, decision-first 3 columns ---------- */
.v-a{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:0;height:calc(100vh - 53px - 88px);min-height:560px}
.v-a .col{overflow:auto;padding:16px}
.v-a .col.mid{background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.v-a h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg3);margin:0 0 11px}
.v-a .crew{display:flex;flex-direction:column;gap:8px}
.v-a .crew .m{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px}
.v-a .crew .m .nm{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:4px}
.v-a .crew .m .bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:7px}
.v-a .crew .m .bar i{display:block;height:100%;background:var(--accent)}
.v-a .big{background:var(--bg2);border:1px solid #3a2a52;border-radius:14px;padding:20px;margin-bottom:16px}
.v-a .big .hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.v-a .big h2{margin:0;font-size:19px;line-height:1.35;flex:1}
.v-a .big .why{color:var(--fg2);font-size:13px;margin:0 0 16px}
.v-a .opts{display:grid;gap:10px}
.v-a .opt{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--bg3);cursor:pointer;transition:border-color .12s,background .12s}
.v-a .opt:hover{border-color:var(--accent)}
.v-a .opt[aria-pressed=true]{border-color:var(--accent);background:rgba(77,163,255,.09)}
.v-a .opt .k{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;margin-bottom:4px}
.v-a .opt .k em{font-style:normal;font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent2);border-radius:5px;padding:1px 6px}
.v-a .opt p{margin:0;font-size:12.5px;color:var(--fg2)}
.v-a .send{margin-top:15px;display:flex;gap:10px;align-items:center}
.v-a .send button.go{background:var(--accent2);color:#fff;padding:9px 20px;border-radius:9px;font-weight:650;font-size:13.5px}
.v-a .send button.go[disabled]{opacity:.4;cursor:not-allowed}
.v-a .dg{margin:15px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg3)}
.v-a .dg .cap{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--fg3)}
.v-a .dg .canvas{padding:16px}
.v-a .queue{display:flex;flex-direction:column;gap:7px}
.v-a .queue .q{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px}
.v-a .queue .q.on{border-color:var(--wait)}

/* ---------- VARIANT B : voyage, single timeline stream ---------- */
.v-b{max-width:860px;margin:0 auto;padding:18px 20px}
.v-b .strip{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.v-b .strip .c{flex:1 1 118px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.v-b .strip .c b{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.v-b .strip .c span{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.07em}
.v-b .stream{position:relative;padding-left:26px}
.v-b .stream::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.v-b .ev{position:relative;margin-bottom:16px}
.v-b .ev::before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--fg3);box-shadow:0 0 0 3px var(--bg)}
.v-b .ev.ok::before{background:var(--ok)}
.v-b .ev.bad::before{background:var(--bad)}
.v-b .ev.cap::before{background:var(--wait)}
.v-b .ev .when{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.v-b .ev .line{margin-top:2px;font-size:13.5px}
.v-b .ev .line b{font-weight:650}
.v-b .ev .body{margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.v-b .ev.cap .body{border-color:#3a2a52}
.v-b .ev .body h4{margin:0 0 5px;font-size:15px}
.v-b .ev .body p{margin:0 0 12px;font-size:12.5px;color:var(--fg2)}
.v-b .inline-opts{display:flex;flex-direction:column;gap:7px}
.v-b .inline-opts label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);cursor:pointer}
.v-b .inline-opts label:hover{border-color:var(--accent)}
.v-b .inline-opts input{margin-top:3px;accent-color:var(--accent)}
.v-b .inline-opts .k{font-weight:650;font-size:13px}
.v-b .inline-opts p{margin:2px 0 0;font-size:12px}
.v-b .act{margin-top:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.v-b .act .go{background:var(--accent2);color:#fff;padding:7px 17px;border-radius:8px;font-weight:650;font-size:13px}

/* ---------- VARIANT C : fleet, kanban by lifecycle stage ---------- */
.v-c{padding:16px 18px}
.v-c .lanes{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;align-items:start;overflow-x:auto}
.v-c .lane{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:150px}
.v-c .lane>h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);display:flex;justify-content:space-between}
.v-c .lane>h3 i{font-style:normal;background:var(--bg3);border-radius:99px;padding:0 7px;color:var(--fg2)}
.v-c .lane.hot{border-color:#3a2a52}
.v-c .card{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer}
.v-c .card:hover{border-color:var(--accent)}
.v-c .card .tt{font-size:12.5px;font-weight:600;line-height:1.4;margin:4px 0 6px}
.v-c .card .who{font-size:11px;color:var(--fg3);display:flex;justify-content:space-between;align-items:center}
.v-c .card .badge{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:700;color:#fff;background:#6b3fa0;border-radius:5px;padding:2px 7px}
.v-c .card .rounds{display:flex;gap:3px;margin-top:7px}
.v-c .card .rounds i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.v-c .card .rounds i.done{background:var(--bad)}
.v-c .card .rounds i.now{background:var(--warn)}
.v-c .modal{position:fixed;inset:0;background:rgba(3,7,12,.82);z-index:55;display:none;overflow:auto;padding:40px 20px}
.v-c .modal.on{display:block}
.v-c .modal .sheet{max-width:720px;margin:0 auto;background:var(--bg2);border:1px solid #3a2a52;border-radius:14px;padding:24px}
.v-c .modal h2{margin:0 0 6px;font-size:18px}
.v-c .modal .opts{display:grid;gap:9px;margin-top:14px}
.v-c .modal .opt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg3);cursor:pointer}
.v-c .modal .opt:hover{border-color:var(--accent)}
.v-c .modal .opt[aria-pressed=true]{border-color:var(--accent);background:rgba(77,163,255,.09)}
.v-c .modal .go{margin-top:14px;background:var(--accent2);color:#fff;padding:9px 20px;border-radius:9px;font-weight:650}

/* ---------- switcher (prototype-only chrome) ---------- */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;display:flex;align-items:center;gap:2px;background:#f2f5f8;color:#0b1016;border-radius:99px;padding:5px;box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12)}
.switcher button{width:34px;height:34px;border-radius:99px;font-size:16px;font-weight:700;color:#4a5866}
.switcher button:hover{background:#dde4ec}
.switcher .lbl{padding:0 15px;font-size:12.5px;font-weight:700;white-space:nowrap;font-family:var(--mono)}
.switcher .lbl em{font-style:normal;font-weight:500;color:#5a6876;font-family:var(--sans)}
.switcher .tag{background:#0b1016;color:#f2f5f8;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:99px;margin-left:4px}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:90;background:var(--bg3);border:1px solid var(--accent);border-radius:9px;padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media(max-width:900px){
  .v-a{grid-template-columns:1fr;height:auto}
  .v-a .col.mid{border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .v-c .lanes{grid-template-columns:repeat(6,240px)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="flowOverlay"><div class="sheet" id="flowSheet"></div></div>
<div class="switcher" id="switcher"></div>
<script>
/* =========================================================================
   PROTOTYPE DATA + I18N  (throwaway, in-memory only)
   ========================================================================= */
const LANGS = ['en','zh-TW','zh-CN'];
const LANGNAME = {'en':'EN','zh-TW':'繁','zh-CN':'简'};
let lang = localStorage.getItem('proto.lang') || new URLSearchParams(location.search).get('lang') || 'zh-TW';
if(!LANGS.includes(lang)) lang = 'zh-TW';
const K = {'en':'en','zh-TW':'tw','zh-CN':'cn'};
const L = o => (o && o[K[lang]]) || '';

const UI = {
  brand:      {en:"Captain's Board",       tw:'船長看板',           cn:'船长看板'},
  sub:        {en:'firstmate-workflow',    tw:'firstmate-workflow', cn:'firstmate-workflow'},
  flowBtn:    {en:'Lifecycle',             tw:'流程',               cn:'流程'},
  crew:       {en:'Crew',                  tw:'船員',               cn:'船员'},
  decisions:  {en:'Awaiting your call',    tw:'等你拍板',           cn:'等你拍板'},
  queue:      {en:'Decision queue',        tw:'決策佇列',           cn:'决策队列'},
  tasks:      {en:'Tasks',                 tw:'任務',               cn:'任务'},
  options:    {en:'Options',               tw:'選項',               cn:'选项'},
  diagram:    {en:'Diagram',               tw:'圖解',               cn:'图解'},
  openLocal:  {en:'Open locally',          tw:'開啟本地檔案',       cn:'打开本地文件'},
  viewPR:     {en:'View PR',               tw:'前往 PR',            cn:'前往 PR'},
  viewDesign: {en:'design.md',             tw:'design.md',          cn:'design.md'},
  submit:     {en:'Submit decision',       tw:'送出決定',           cn:'提交决定'},
  pickFirst:  {en:'Pick an option first',  tw:'先選一個選項',       cn:'先选一个选项'},
  sent:       {en:'Decision written to state/decisions/{id}.json — firstmate woke up',
               tw:'決定已寫入 state/decisions/{id}.json —— firstmate 已喚醒',
               cn:'决定已写入 state/decisions/{id}.json —— firstmate 已唤醒'},
  opened:     {en:'Would run: code {p}',   tw:'將執行：code {p}',   cn:'将执行：code {p}'},
  summary:    {en:'Summary (tri-lingual, emitted by the agent)',
               tw:'摘要（三語，由 agent 產出）', cn:'摘要（三语，由 agent 产出）'},
  round:      {en:'Round',                 tw:'輪次',               cn:'轮次'},
  blockedBy:  {en:'Blocked by',            tw:'卡在',               cn:'卡在'},
  running:    {en:'running',               tw:'執行中',             cn:'执行中'},
  idle:       {en:'idle slot',             tw:'空閒名額',           cn:'空闲名额'},
  gateFail:   {en:'Gate 5 failed',         tw:'第 5 道閘未過',      cn:'第 5 道闸未过'},
  askCrit:    {en:'ASK-PASS-CRITERIA sent',tw:'已發 ASK-PASS-CRITERIA', cn:'已发 ASK-PASS-CRITERIA'},
  statMerged: {en:'merged',                tw:'已合併',             cn:'已合并'},
  statReview: {en:'in review',             tw:'審核中',             cn:'审核中'},
  statWorking:{en:'working',               tw:'施工中',             cn:'施工中'},
  statGate:   {en:'gate failed',           tw:'閘門擋下',           cn:'闸门拦下'},
  statQueued: {en:'queued',                tw:'排隊中',             cn:'排队中'},
  statCaptain:{en:'awaiting captain',      tw:'等船長',             cn:'等船长'},
  laneQueued: {en:'Queued',                tw:'排隊',               cn:'排队'},
  laneWorking:{en:'Working',               tw:'施工',               cn:'施工'},
  laneGate:   {en:'Gate',                  tw:'閘門',               cn:'闸门'},
  laneReview: {en:'Review',                tw:'審核',               cn:'审核'},
  laneCaptain:{en:'Captain',               tw:'船長',               cn:'船长'},
  laneMerged: {en:'Merged',                tw:'已合併',             cn:'已合并'},
  nDone:      {en:'merged',                tw:'已合併',             cn:'已合并'},
  nFlight:    {en:'in flight',             tw:'進行中',             cn:'进行中'},
  nWait:      {en:'awaiting you',          tw:'等你',               cn:'等你'},
  nBlocked:   {en:'blocked',               tw:'受阻',               cn:'受阻'},
  flowTitle:  {en:'Lifecycle — where the captain is in the loop',
               tw:'生命週期 —— 船長在哪些環節介入', cn:'生命周期 —— 船长在哪些环节介入'},
  gatesTitle: {en:'fm-gate.sh — deterministic gates. Exit codes decide, not opinions.',
               tw:'fm-gate.sh —— 確定性閘門。exit code 說了算，不是模型印象。',
               cn:'fm-gate.sh —— 确定性闸门。exit code 说了算，不是模型印象。'},
  origin:     {en:'Source text stays zh-TW on GitHub',
               tw:'GitHub 上的原文維持單語（zh-TW）', cn:'GitHub 上的原文保持单语（zh-TW）'},
};
const T = k => L(UI[k]);

const FLOW = [
  {t:{en:'Grill',tw:'對談盤問',cn:'对谈盘问'},      d:{en:'/grilling until the frontier is empty',tw:'/grilling 直到 frontier 清空',cn:'/grilling 直到 frontier 清空'}},
  {t:{en:'Prototype',tw:'提案視覺化',cn:'提案可视化'},d:{en:'/prototype — variants the captain can click',tw:'/prototype 產出可點的方案',cn:'/prototype 产出可点的方案'}},
  {t:{en:'Green-light',tw:'船長成案',cn:'船长立项'}, d:{en:'no dispatch without this event',tw:'沒有這個事件不准派工',cn:'没有这个事件不准派工'},cap:1},
  {t:{en:'design.md',tw:'design.md',cn:'design.md'}, d:{en:'spec + task DAG, version controlled',tw:'規格 + 任務 DAG，進版控',cn:'规格 + 任务 DAG，进版控'}},
  {t:{en:'Dispatch',tw:'派工',cn:'派工'},            d:{en:'ready tasks only, max 3 in flight',tw:'只派 ready 的，並行上限 3',cn:'只派 ready 的，并行上限 3'}},
  {t:{en:'Worker',tw:'工人',cn:'工人'},              d:{en:'own worktree, opens a PR',tw:'自己的 worktree，開 PR',cn:'自己的 worktree，开 PR'}},
  {t:{en:'7 gates',tw:'七道閘',cn:'七道闸'},          d:{en:'exit codes only, no model opinion',tw:'只看 exit code',cn:'只看 exit code'},gate:1},
  {t:{en:'Reviewer',tw:'審核者',cn:'审核者'},        d:{en:'sees the diff only — adversarial',tw:'只看 diff，對抗式',cn:'只看 diff，对抗式'}},
  {t:{en:'Merge',tw:'合併',cn:'合并'},               d:{en:'you press the button',tw:'你按下按鈕',cn:'你按下按钮'},cap:1},
];
const GATES = [
  {en:'branch exists and has commits',            tw:'分支存在且有 commit',                  cn:'分支存在且有 commit'},
  {en:'rebase onto main is clean',                tw:'rebase 到 main 乾淨',                  cn:'rebase 到 main 干净'},
  {en:'ci.sh exits 0 (same script as GHA)',       tw:'ci.sh exit 0（與 GHA 同一支）',        cn:'ci.sh exit 0（与 GHA 同一支）'},
  {en:'diff stays inside the declared file scope',tw:'diff 不超出宣告的檔案範圍',            cn:'diff 不超出声明的文件范围'},

function VariantB(){
  const n = {done:TASKS.filter(t=>t.st==='merged').length,

             wait:DECISIONS.length,

          + '<div class="line"><b>'+d.id+'</b> &middot; '+T('decisions')+'</div>'
          + '<div class="body"><h4>'+L(d.title)+'</h4><p>'+L(d.why)+'</p>'
          + '<div class="inline-opts">'+d.opts.map(o=>'<label><input type="radio" name="'+d.id+'" '+(sel===o.k?'checked':'')
              + ' onchange="chosen[\''+d.id+'\']=\''+o.k+'\';render()"><span><span class="k">'+o.k+' &middot; '+L(o.t)+'</span>'
              + '<p class="muted">'+L(o.d)+'</p></span></label>').join('')+'</div>'

          + '<div class="act"><button class="go" onclick="submit(\''+d.id+'\')">'+T('submit')+'</button>'
          + '<span class="tiny muted">'+(sel?d.id+' &rarr; '+sel:T('pickFirst'))+'</span></div>'
          + '</div></div>';
      }
      return '<div class="ev '+e.kind+'"><div class="when">'+e.tm+'</div><div class="line">'+L(e.txt)+'</div></div>';
    }).join('')
  + '</div></div>';
}

/* =========================================================================
   VARIANT C — "Fleet": kanban by lifecycle stage, decisions as badges
   ========================================================================= */
const LANES = [['queued','laneQueued'],['working','laneWorking'],['gate','laneGate'],['review','laneReview'],['captain','laneCaptain'],['merged','laneMerged']];
let openCard = null;
function VariantC(){
  const decOf = t => DECISIONS.find(d=>d.task===t.id);
  const lane = (st,key)=>{
    const items = st==='captain' ? [] : TASKS.filter(t=>t.st===st);
    const cap = st==='captain' ? DECISIONS : [];
    const body = items.map(t=>{
      const d = decOf(t);
      return '<div class="card" onclick="'+(d?'openCard=\''+d.id+'\';render()':'toast(\''+t.file+'\')')+'">'
        + '<span class="tid">'+t.id+'</span>'
        + '<div class="tt">'+L(t.title)+'</div>'
        + '<div class="who"><span>'+(t.who||'—')+'</span><span>'+(t.pr?'#'+t.pr:(t.dep?T('blockedBy')+' '+t.dep.join(','):''))+'</span></div>'
        + (t.round? '<div class="rounds">'+[1,2,3].map(r=>'<i class="'+(r<t.round?'done':r===t.round?'now':'')+'"></i>').join('')+'</div>':'')
        + (t.note? '<span class="badge">'+T(t.note)+'</span>':'')
        + '</div>';
    }).join('') + cap.map(d=>'<div class="card" onclick="openCard=\''+d.id+'\';render()">'
        + '<span class="tid">'+d.id+' &middot; '+d.task+'</span><div class="tt">'+L(d.title)+'</div>'
        + '<span class="badge">'+d.opts.length+' '+T('options')+'</span></div>').join('');
    const cnt = items.length + cap.length;
    return '<div class="lane'+(st==='captain'?' hot':'')+'"><h3>'+T(key)+'<i>'+cnt+'</i></h3>'+body+'</div>';
  };
  const d = DECISIONS.find(x=>x.id===openCard);
  const sel = d && chosen[d.id];
  const modal = d ? '<div class="modal on" onclick="if(event.target===this){openCard=null;render()}"><div class="sheet">'
      + '<span class="tid">'+d.id+' &middot; '+d.task+'</span><h2>'+L(d.title)+'</h2>'
      + '<p class="muted tiny">'+L(d.why)+'</p>'
      + '<div class="opts">'+d.opts.map(o=>'<button class="opt" aria-pressed="'+(sel===o.k)+'" onclick="chosen[\''+d.id+'\']=\''+o.k+'\';render()">'
          + '<div style="font-weight:650">'+o.k+' &middot; '+L(o.t)+'</div><p class="muted tiny" style="margin:3px 0 0">'+L(o.d)+'</p></button>').join('')+'</div>'
      + '<div style="margin-top:14px">'+diagram(d,sel)+'</div>'
      + linkRow(d)
      + '<button class="go" onclick="submit(\''+d.id+'\')">'+T('submit')+'</button>'
      + '</div></div>' : '';
  return topBar() + '<div class="v-c"><div class="lanes">'+LANES.map(([s,k])=>lane(s,k)).join('')+'</div>'+modal+'</div>';
}

  A:{name:{en:'Bridge — decision first',  tw:'艦橋 —— 決策優先', cn:'舰桥 —— 决策优先'}, fn:VariantA},
  B:{name:{en:'Voyage — one timeline',    tw:'航程 —— 單一時間流', cn:'航程 —— 单一时间流'}, fn:VariantB},
  C:{name:{en:'Fleet — kanban by stage',  tw:'艦隊 —— 階段看板', cn:'舰队 —— 阶段看板'}, fn:VariantC},
};
const ORDER = ['A','B','C'];
function go(step){
  const i = (ORDER.indexOf(variant) + step + ORDER.length) % ORDER.length;
  variant = ORDER[i]; openCard = null;
  const u = new URL(location); u.searchParams.set('variant', variant);
  history.replaceState(null,'',u); render();
}
function renderSwitcher(){
  document.getElementById('switcher').innerHTML =
      '<button onclick="go(-1)" aria-label="previous">&#8249;</button>'
    + '<span class="lbl">'+variant+' <em>'+L(VARIANTS[variant].name)+'</em></span>'
    + '<button onclick="go(1)" aria-label="next">&#8250;</button>'
    + '<span class="tag">PROTOTYPE</span>';
}
addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='ArrowRight') go(1);
  if(e.key==='Escape'){ openCard=null; document.getElementById('flowOverlay').classList.remove('on'); render(); }
});
function render(){
  document.documentElement.lang = lang;
  app.innerHTML = VARIANTS[variant].fn();
  renderSwitcher();
}
render();
</script>
</body>
</html>
