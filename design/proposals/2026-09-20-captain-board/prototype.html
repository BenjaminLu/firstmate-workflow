<!doctype html>
<!--
  PROTOTYPE - THROWAWAY. Not production code. No tests, no error handling.
  Question: "How much motion does the captain's board need to feel like sailing?"
  Layout is settled: A+C merged (sea header / crew rail / decision deck / stage lanes).
  Two motion levels, switchable via ?variant=1|2 :
     1 = Steady  (live data, restrained motion)
     2 = Full sail (live data + full nautical motion)
  Fake data, simulated tick. Nothing is wired to a real backend.
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE - Captain's Board</title>
<style>
:root{
  --bg:#070d14; --bg2:#0e1720; --bg3:#15212d; --line:#213041;
  --fg:#e8eff7; --fg2:#93a7bd; --fg3:#5d7188;
  --accent:#4da3ff; --accent2:#0d5ba8; --sea:#0a2a44; --sea2:#0d3b5e;
  --ok:#3ecf8e; --warn:#f2b544; --bad:#f2645a; --wait:#c07bf0; --brass:#d9a441;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans CJK TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:92px;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--fg2)} .tiny{font-size:11.5px} .dim{color:var(--fg3)}
.num{font-variant-numeric:tabular-nums}

/* ===== header ===== */
.top{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;font-weight:650}
.brand small{display:block;font-weight:400;color:var(--fg3);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.top .spacer{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.langs button{padding:5px 11px;font-size:12px;color:var(--fg2)}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed=true]{background:var(--accent2);color:#fff}
.ghost{padding:5px 11px;font-size:12px;color:var(--fg2);border:1px solid var(--line);border-radius:7px}
.ghost:hover{color:var(--fg);border-color:var(--fg3)}
.clock{font-family:var(--mono);font-size:12px;color:var(--fg3);letter-spacing:.06em}

/* ===== compass (ship's wheel) ===== */
.compass{width:34px;height:34px;flex:0 0 34px;position:relative}
.compass svg{display:block}
.compass .rose{transform-origin:50% 50%}
.m-full .compass .rose{animation:roll 9s ease-in-out infinite}
.m-full .compass .sweep{animation:sweep 4s linear infinite;transform-origin:50% 50%}
.compass .sweep{opacity:0}
.m-full .compass .sweep{opacity:1}
@keyframes roll{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ===== sea strip ===== */
.sea{position:relative;height:104px;overflow:hidden;background:linear-gradient(180deg,#081824 0%,var(--sea) 55%,var(--sea2) 100%);border-bottom:1px solid var(--line)}
.sea .waves{position:absolute;inset:auto 0 0 0;height:74px}
.sea .waves svg{position:absolute;bottom:0;left:0;width:220%;height:100%}
.sea .w1{opacity:.55} .sea .w2{opacity:.35} .sea .w3{opacity:.22}
.m-full .sea .w1{animation:drift 13s linear infinite}
.m-full .sea .w2{animation:drift 21s linear infinite reverse}
.m-full .sea .w3{animation:drift 31s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sea .stats{position:relative;z-index:2;display:flex;gap:26px;align-items:center;height:100%;padding:0 22px}
.sea .stat b{display:block;font-size:27px;line-height:1;letter-spacing:-.5px}
.sea .stat span{font-size:10.5px;color:#7fa8c6;text-transform:uppercase;letter-spacing:.09em}
.sea .stat.hot b{color:var(--wait)}
.sea .stat.bad b{color:var(--bad)}
.sea .flag{margin-left:auto;text-align:right}
.sea .flag .hd{font-family:var(--mono);font-size:21px;color:var(--brass);letter-spacing:1px}
.sea .flag .lb{font-size:10.5px;color:#7fa8c6;text-transform:uppercase;letter-spacing:.09em}
.m-full .sea .ship{animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-5px) rotate(1.2deg)}}
.flash{animation:flash .6s ease-out}
@keyframes flash{0%{color:var(--brass);text-shadow:0 0 14px rgba(217,164,65,.6)}100%{}}

/* ===== crew rail ===== */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:9px;padding:14px 18px}
.mem{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;position:relative;overflow:hidden}
.mem.act{border-color:#2c4a66}
.mem .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mem .nm{font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--fg3)}
.dot.working{background:var(--accent)} .dot.review{background:var(--accent)}
.dot.gate{background:var(--bad)} .dot.merged{background:var(--ok)} .dot.queued{background:var(--fg3)}
.m-full .dot.working,.m-full .dot.review{animation:breathe 1.9s ease-in-out infinite}
.m-full .dot.gate{animation:breathe 1s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 currentColor;opacity:1}50%{box-shadow:0 0 0 4px rgba(77,163,255,.18);opacity:.75}}
.mem .tk{font-size:11.5px;color:var(--fg2);margin-top:5px;min-height:17px}
.mem .bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:8px}
.mem .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .85s linear}
.mem .bar i.bad{background:linear-gradient(90deg,#7a2a25,var(--bad))}
.mem .wake{position:absolute;inset:0;pointer-events:none;opacity:0}
.m-full .mem.act .wake{opacity:1;background:linear-gradient(90deg,transparent,rgba(77,163,255,.07),transparent);background-size:200% 100%;animation:wake 2.6s linear infinite}
@keyframes wake{from{background-position:200% 0}to{background-position:-200% 0}}

/* ===== decision deck ===== */
.deck{padding:6px 18px 0}
.deck h3,.lanes-wrap h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg3);margin:10px 0 11px;display:flex;align-items:center;gap:9px}
.deck h3 .n{background:var(--wait);color:#1a0d28;border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px}
.card-d{background:var(--bg2);border:1px solid #3a2a52;border-radius:14px;padding:19px 21px;position:relative;overflow:hidden}
.m-full .card-d::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:2px;background:linear-gradient(90deg,transparent,var(--wait),transparent);animation:scanline 4.5s linear infinite}
@keyframes scanline{to{left:120%}}
.card-d .hd{display:flex;gap:12px;align-items:flex-start;margin-bottom:5px}
.card-d h2{margin:0;font-size:18.5px;line-height:1.35;flex:1}
.card-d .why{color:var(--fg2);font-size:12.8px;margin:0 0 15px}
.opts{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.opt{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--bg3);cursor:pointer;text-align:left;transition:border-color .13s,background .13s,transform .13s}
.opt:hover{border-color:var(--accent)}
.m-full .opt:hover{transform:translateY(-2px)}
.opt[aria-pressed=true]{border-color:var(--accent);background:rgba(77,163,255,.1)}
.opt .k{display:flex;align-items:center;gap:9px;font-weight:650;font-size:13.5px;margin-bottom:4px}
.opt .k em{font-style:normal;font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent2);border-radius:5px;padding:1px 6px}
.opt p{margin:0;font-size:12.3px;color:var(--fg2)}
.dg{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg3)}
.dg .cap{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--fg3)}
.dg .canvas{padding:15px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.links a{font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;color:var(--fg2)}
.links a:hover{color:var(--fg);border-color:var(--accent);text-decoration:none}
.send{margin-top:15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
/* engine-order telegraph button */
.go{background:linear-gradient(180deg,#e0b055,#b8862c);color:#2a1c05;padding:9px 22px;border-radius:9px;font-weight:750;font-size:13.5px;letter-spacing:.02em;box-shadow:0 2px 0 #6d4d13}
.go:active{transform:translateY(2px);box-shadow:0 0 0 #6d4d13}
.go[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.stack .q{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--wait);border-radius:9px;padding:9px 12px;font-size:12.5px;cursor:pointer}
.stack .q:hover{border-color:var(--accent)}

/* ===== lanes ===== */
.lanes-wrap{padding:8px 18px 0}
.lanes{display:grid;grid-template-columns:repeat(6,minmax(172px,1fr));gap:9px;align-items:start;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px;min-height:118px}
.lane>h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);display:flex;justify-content:space-between}
.lane>h4 i{font-style:normal;background:var(--bg3);border-radius:99px;padding:0 7px;color:var(--fg2)}
.lane.hot{border-color:#3a2a52}
.tcard{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer;position:relative}
.tcard:hover{border-color:var(--accent)}
.tcard.enter{animation:slidein .45s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.tcard .tid{font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.tcard .tt{font-size:12.2px;font-weight:600;line-height:1.38;margin:3px 0 6px}
.tcard .ft{font-size:10.5px;color:var(--fg3);display:flex;justify-content:space-between;gap:6px}
.tcard .rounds{display:flex;gap:3px;margin-top:6px}
.tcard .rounds i{width:13px;height:4px;border-radius:2px;background:var(--line)}
.tcard .rounds i.done{background:var(--bad)} .tcard .rounds i.now{background:var(--warn)}
.tcard .badge{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;color:#fff;background:#6b3fa0;border-radius:5px;padding:2px 7px}

/* ===== ticker ===== */
.ticker{margin:14px 18px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg2);overflow:hidden}
.ticker h4{margin:0;padding:8px 13px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3)}
.ticker ul{margin:0;padding:6px 0;list-style:none;max-height:150px;overflow:auto}
.ticker li{padding:4px 13px;font-size:12.2px;display:flex;gap:11px}
.ticker li.new{animation:rowin .5s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-8px);background:rgba(77,163,255,.1)}to{opacity:1;transform:none}}
.ticker li time{font-family:var(--mono);font-size:11px;color:var(--fg3);flex:0 0 58px}
.ticker li.ok{color:var(--ok)} .ticker li.bad{color:var(--bad)} .ticker li.cap{color:var(--wait)}

/* ===== overlays / switcher ===== */
.overlay{position:fixed;inset:0;background:rgba(3,7,12,.85);z-index:60;display:none;overflow:auto;padding:40px 20px}
.overlay.on{display:block}
.overlay .sheet{max-width:1000px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:26px}
.overlay h2{margin:0 0 16px;font-size:17px}
.flow{display:flex;flex-wrap:wrap;gap:7px}
.flow .st{flex:1 1 124px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.flow .st b{display:block;font-size:12.3px;margin-bottom:3px}
.flow .st span{font-size:11px;color:var(--fg2);display:block;line-height:1.4}
.flow .st.gate{border-color:#4a3a1a;background:#1c1710}
.flow .st.cap{border-color:#3a2a52;background:#181226}
.flow .arrow{align-self:center;color:var(--fg3)}
.gatelist{margin:16px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:8px}
.gatelist li{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;font-size:12.3px}
.gatelist li b{color:var(--warn);font-family:var(--mono);margin-right:7px}
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;display:flex;align-items:center;gap:2px;background:#f2f5f8;color:#0b1016;border-radius:99px;padding:5px;box-shadow:0 10px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12)}
.switcher button{width:34px;height:34px;border-radius:99px;font-size:16px;font-weight:700;color:#4a5866}
.switcher button:hover{background:#dde4ec}
.switcher .lbl{padding:0 15px;font-size:12.5px;font-weight:700;white-space:nowrap;font-family:var(--mono)}
.switcher .lbl em{font-style:normal;font-weight:500;color:#5a6876;font-family:var(--sans)}
.switcher .tag{background:#0b1016;color:#f2f5f8;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:99px;margin-left:4px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:90;background:var(--bg3);border:1px solid var(--accent);border-radius:9px;padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media(max-width:980px){ .lanes{grid-template-columns:repeat(6,190px)} }
@media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ===== 3D crew — box-face geometry, zero dependency ===== */
.m-3d .rail{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}
.m-3d .mem{padding-top:8px}
.stage{height:132px;position:relative;perspective:560px;touch-action:none;perspective-origin:50% 42%;
  margin:-2px -4px 5px;overflow:hidden;border-radius:9px;
  background:radial-gradient(120% 80% at 50% 0%,rgba(19,66,102,.6),rgba(8,18,28,0) 70%)}
.deckline{position:absolute;left:-14%;right:-14%;bottom:12px;height:56px;
  background:repeating-linear-gradient(90deg,#1d2f3f 0 17px,#17252f 17px 34px);
  transform:rotateX(76deg);transform-origin:50% 100%;opacity:.9;
  box-shadow:inset 0 14px 22px rgba(0,0,0,.45)}
.pivot{position:absolute;left:50%;bottom:30px;width:92px;height:100px;margin-left:-46px;
  transform-style:preserve-3d;cursor:grab;touch-action:none;
  transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-26deg)) scale(var(--sc,1));
  transition:transform .16s ease-out}
.pivot.dragging{cursor:grabbing;transition:none}
.fig{position:absolute;inset:0;transform-style:preserve-3d}
.fig *{position:absolute;transform-style:preserve-3d}
/* generic box: front + right + top face, shading from geometry */
.bx{width:var(--w);height:var(--h)}
.bx>i{display:block;background:var(--c);border-radius:2px}
.bx>i.fr{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/2))}
.bx>i.sd{width:var(--d);height:var(--h);left:calc(var(--w)/2 - var(--d)/2);
  transform:rotateY(90deg) translateZ(calc(var(--w)/2));filter:brightness(.58)}
.bx>i.tp{width:var(--w);height:var(--d);top:calc(var(--h)/2 - var(--d)/2);
  transform:rotateX(90deg) translateZ(calc(var(--h)/2));filter:brightness(1.34)}
.bx>i.lf{width:var(--d);height:var(--h);left:calc(var(--w)/2 - var(--d)/2);
  transform:rotateY(-90deg) translateZ(calc(var(--w)/2));filter:brightness(.8)}
.bx>i.bk{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/-2)) rotateY(180deg);
  filter:brightness(.45)}
.fig .sh{left:50%;bottom:-8px;width:64px;height:16px;margin-left:-32px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.62),transparent 72%);transform:translateZ(-16px)}
/* geometry: everything centred on x=46, stacked bottom-up. no gaps, arms at the body's sides. */
.fig .shoeL{--w:13px;--h:6px;--d:16px;left:31px;bottom:0}
.fig .shoeR{--w:13px;--h:6px;--d:16px;left:48px;bottom:0}
.fig .legL {--w:11px;--h:22px;--d:12px;left:32px;bottom:5px}
.fig .legR {--w:11px;--h:22px;--d:12px;left:49px;bottom:5px}
.fig .torso{--w:32px;--h:34px;--d:20px;left:30px;bottom:24px}
.fig .belt {--w:33px;--h:4px;--d:21px;left:29px;bottom:27px}
.fig .neck {--w:10px;--h:7px;--d:10px;left:41px;bottom:55px}
.fig .head {--w:21px;--h:20px;--d:19px;left:36px;bottom:61px}
.fig .brim {--w:29px;--h:3px;--d:26px;left:32px;bottom:77px}
.fig .crown{--w:22px;--h:8px;--d:20px;left:35px;bottom:79px}
.fig .eye{left:41px;bottom:70px;width:3px;height:3.5px;border-radius:1px;background:#1b2836;
  box-shadow:8px 0 0 #1b2836;transform:translateZ(10px)}
/* arms hang from the shoulder, flush against the torso, at the body's own depth */
.fig .armL{--w:8px;--h:23px;--d:11px;left:22px;bottom:31px;transform-origin:50% 2px;transform:rotate(6deg)}
.fig .armR{--w:8px;--h:23px;--d:11px;left:62px;bottom:31px;transform-origin:50% 2px;transform:rotate(-6deg)}
.fig .handL,.fig .handR{--w:9px;--h:8px;--d:11px;left:-1px;bottom:-6px}
.fig .tool{left:-4px;bottom:-9px;width:0;height:0}
/* role palettes */
.fig{--trouser:#27394a;--shoe:#151f29}
.fig.r-fm{--skin:#f0cfa9;--suit:#2c4d74;--hat:#d9a441;--trouser:#1f3244}
.fig.r-w {--skin:#f0cfa9;--suit:#b4672a;--hat:#e8ae3e}
.fig.r-r {--skin:#f0cfa9;--suit:#6b45a0;--hat:#c07bf0}
.fig .head,.fig .neck,.fig .handL,.fig .handR{--c:var(--skin)}
.fig .torso,.fig .armL,.fig .armR{--c:var(--suit)}
.fig .legL,.fig .legR{--c:var(--trouser)}
.fig .shoeL,.fig .shoeR{--c:var(--shoe)}
.fig .belt{--c:#1a2632}
.fig .crown,.fig .brim{--c:var(--hat)}
/* props */
.prop{left:50%;bottom:6px;margin-left:-23px;width:46px;height:46px;opacity:0;transform:translateZ(22px)}
.fig.r-fm .armL{transform:rotate(-58deg)}
.fig.r-fm .armR{transform:rotate(-58deg)}
.fig.r-w  .tool{width:16px;height:10px;border-radius:2px;background:linear-gradient(180deg,#c2cedb,#63717e);
  box-shadow:0 0 0 2px #26313c;transform:translateZ(6px)}
.fig.r-w  .tool::after{content:"";position:absolute;left:5px;top:9px;width:5px;height:13px;border-radius:2px;
  background:#6b4f2c;box-shadow:0 0 0 1px #2a2013}
.fig.r-r  .tool{width:26px;height:7px;border-radius:4px;left:-17px;bottom:2px;
  background:linear-gradient(90deg,#e2eaf3,#6d7c8c);box-shadow:0 0 0 2px #26313c;transform:translateZ(6px)}
/* state-driven motion — these only translate/scale; orientation lives on .pivot */
.m-3d .fig{animation:bobk 4.4s ease-in-out infinite}
.m-3d .fig.s-working{animation:bobk 2.5s ease-in-out infinite}
.m-3d .fig.s-working .armR{animation:hammer var(--sp,.62s) ease-in-out infinite}
.m-3d .fig.s-review{animation:scank 3.6s ease-in-out infinite}
.fig.s-review .armR{transform:rotate(-112deg)}
.fig.s-gate{filter:saturate(.5) brightness(.86)}
.fig.s-gate .armR{transform:rotate(13deg)}
.fig.s-gate .neck{bottom:52px} .fig.s-gate .head{bottom:57px}
.fig.s-gate .brim{bottom:73px} .fig.s-gate .crown{bottom:75px} .fig.s-gate .eye{bottom:66px}
.m-3d .fig.s-gate{animation:slumpk 2.2s ease-in-out infinite}
.fig.s-queued{filter:grayscale(.75) brightness(.6)}
.m-3d .fig.s-queued{animation:bobk 6.5s ease-in-out infinite}
.fig.react{animation:joltk .55s ease-out !important}
@keyframes bobk{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes slumpk{0%,100%{transform:translateY(3px)}50%{transform:translateY(6px)}}
@keyframes scank{0%,100%{transform:rotateY(-17deg)}50%{transform:rotateY(19deg)}}
@keyframes joltk{0%{transform:translateY(-10px) scale(1.09)}100%{transform:translateY(0) scale(1)}}
@keyframes hammer{0%,100%{transform:rotate(-14deg)}45%{transform:rotate(-86deg)}}

/* ===== level 4: one shared deck, crew interact on it ===== */
.scene{position:relative;height:266px;margin:13px 18px 0;border:1px solid var(--line);border-radius:13px;
  overflow:hidden;perspective:900px;perspective-origin:50% 38%;
  background:linear-gradient(180deg,#050f19 0%,#0a2739 46%,#040c14 100%)}
.scene .horizon{position:absolute;left:0;right:0;top:0;height:58px;

.scene .planks-unused{position:absolute;left:-22%;right:-22%;bottom:62px;height:150px;
  background:repeating-linear-gradient(90deg,#223645 0 27px,#1b2b38 27px 54px);
  transform:rotateX(74deg);transform-origin:50% 100%;box-shadow:inset 0 32px 54px rgba(0,0,0,.55)}
.scene .plat{position:absolute;bottom:116px;left:64%;margin-left:-50px;width:100px;height:13px;border-radius:5px;

.scene .pivot{bottom:calc(var(--deckY) + 10px + var(--r,0) * var(--rowH));left:var(--px)}
.vend{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);color:var(--fg2);
  border:1px solid var(--line);border-radius:7px;padding:4px 10px;letter-spacing:.02em}
.vend i{width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.vend.x{border-color:#4a3a1a;color:#e0b45c} .vend.x i{background:var(--brass)}
.vend b{font-weight:700;color:var(--brass)}
.scene .tag .vd{margin-top:2px;font:600 9.5px var(--mono);color:#5d84a3;letter-spacing:.02em}
.scene .tag .vd.x{color:var(--brass)}
.scene.dens-2 .tag .job,.scene.dens-2 .tag .vd{display:none}
.scene.dens-2 .tag .who{font-size:10px}
.scene.dens-3 .tag .job,.scene.dens-3 .tag .vd,.scene.dens-3 .tag .pct{display:none}
.scene.dens-3 .tag .who{font-size:9.5px;gap:4px}
.scene.dens-3 .tag .pb{width:92%}
.scene .hint{position:absolute;top:9px;left:0;right:0;text-align:center;

.scene .tag{position:absolute;bottom:calc(var(--deckY) + var(--r,0) * var(--rowH) - 30px);
  left:var(--px);transform:translateX(-50%);
  width:var(--plateW,15.5%);min-width:0;max-width:196px;text-align:center;z-index:4}
.scene .tag .who{display:flex;align-items:center;justify-content:center;gap:6px;
  font:650 11px var(--mono);color:#cfe0ef;letter-spacing:.03em}
.scene .tag .job{margin-top:3px;font-size:10.5px;color:#8fb2cc;line-height:1.32;

  min-height:28px;word-break:break-word;overflow-wrap:anywhere}
.scene .tag .job b{color:#b9d3e8;font-weight:600;font-family:var(--mono);font-size:10.5px}
.scene .tag .pb{margin:5px auto 0;width:78%;height:3px;background:rgba(255,255,255,.1);
  border-radius:2px;overflow:hidden}
.scene .tag .pb i{display:block;height:100%;background:var(--accent);transition:width .85s linear}
.scene .tag .pb i.bad{background:var(--bad)}

.scene .tag.st-gate .who{color:var(--bad)}
.scene .tag.st-queued{opacity:.5}
.scene .tag.st-review .who{color:#d9b6ff}
/* things that travel between crew */
.flyer{position:absolute;bottom:calc(var(--deckY) + 74px);width:22px;height:16px;border-radius:3px;z-index:6;
  display:flex;align-items:center;justify-content:center;font:800 8.5px var(--sans);color:#0b1016;

@keyframes fly{
  0%  {left:var(--sx);transform:translateY(8px) scale(.55) rotate(-25deg);opacity:0}

.crewline{display:flex;flex-wrap:wrap;gap:8px;padding:11px 18px 0}

.scene{height:var(--sceneH,266px)}

.scene{--deckY:104px;--rowH:68px;--oak:#3b2617;--oakL:#6b482a;--oakD:#1b1009;

  box-shadow:0 0 0 1px var(--gold),inset 0 0 3px #000}

.m-full .lantern{animation:lamp 3.4s ease-in-out infinite}
@keyframes lamp{0%,100%{box-shadow:0 0 12px 3px rgba(240,196,99,.26)}

.figurehead{position:absolute;right:4%;bottom:-18px;width:18px;height:20px;

/* upper decks: the ship grows taller, not longer */
.updeck{position:absolute;left:50%;transform:translateX(-50%);

  width:var(--dw);transform-style:preserve-3d}
.updeck .plate{position:absolute;left:0;right:0;bottom:0;height:150px;

.updeck .rail{position:absolute;left:0;right:0;bottom:-13px;height:15px;
  background:linear-gradient(180deg,var(--oakL) 0 28%,var(--trim) 28% 64%,var(--oak) 64% 100%);
  clip-path:polygon(10% 0,90% 0,86% 100%,14% 100%);
  box-shadow:0 4px 12px rgba(0,0,0,.55),inset 0 -1px 0 var(--gold)}
.updeck .skirt{position:absolute;left:8%;right:8%;bottom:-40px;height:30px;
  background:linear-gradient(180deg,var(--oak),var(--oakD));
  clip-path:polygon(6% 0,94% 0,86% 100%,14% 100%);opacity:.95}
/* masts, ratlines, sails, jolly roger */
.mast{position:absolute;bottom:20px;width:6px;border-radius:2px;
  background:linear-gradient(90deg,#8a6438,#33230f);transform:translateX(-50%);
  box-shadow:0 0 12px rgba(0,0,0,.55)}
.mast .yard{position:absolute;left:50%;width:var(--yw,74px);height:5px;border-radius:2px;
  transform:translateX(-50%);background:linear-gradient(90deg,#33230f,#8a6438,#33230f)}
.mast .ratline{position:absolute;left:50%;bottom:0;width:var(--rw,46px);height:var(--rh,54px);
  transform:translateX(-50%);opacity:.5;
  background:repeating-linear-gradient(180deg,var(--rope) 0 1px,transparent 1px 8px);
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.mast .sail{position:absolute;left:50%;transform:translateX(-50%);width:var(--sw,66px);
  box-shadow:0 6px 22px rgba(0,0,0,.5);opacity:.96;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,var(--canvas),#a89b81);
  clip-path:polygon(7% 0,93% 0,100% 84%,90% 100%,80% 85%,68% 99%,56% 84%,44% 99%,32% 85%,20% 100%,10% 86%,0 84%)}
.mast .sail.main{background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,#5a1414,#2a0909)}
.mast .sail .skull{position:absolute;left:50%;top:24%;width:44%;transform:translateX(-50%);opacity:.92}
.m-full .mast .sail{animation:luff 6s ease-in-out infinite;transform-origin:50% 0}
@keyframes luff{0%,100%{transform:translateX(-50%) skewX(-2deg) scaleX(1)}
                50%{transform:translateX(-50%) skewX(2deg) scaleX(.96)}}
.jolly{position:absolute;top:-5px;left:6px;width:32px;height:18px;background:#0b0b0d;
  border:1px solid #2a2a2e;display:flex;align-items:center;justify-content:center;
  clip-path:polygon(0 0,100% 0,84% 50%,100% 100%,0 100%)}
.jolly svg{width:13px;height:13px;margin-right:4px}
.m-full .jolly{animation:flagwave 2.4s ease-in-out infinite;transform-origin:0 50%}
@keyframes flagwave{0%,100%{transform:skewY(-5deg) scaleX(1)}50%{transform:skewY(6deg) scaleX(.9)}}
.stay{position:absolute;height:1px;background:var(--rope);opacity:.45;transform-origin:0 50%}
.helm{position:absolute;left:var(--hx,25%);bottom:calc(var(--topR,0) * var(--rowH) + 9px);
  width:46px;height:46px;transform:translateX(-50%) translateZ(30px);z-index:2}
.helm .wheel{position:absolute;inset:0}

@keyframes helmspin{to{transform:rotate(360deg)}}
.helm .ring{position:absolute;inset:0;border-radius:50%;border:5px solid #a87c35;
  box-shadow:inset 0 0 0 3px #131c25,0 0 18px rgba(201,151,47,.35)}
.helm .wheel i{position:absolute;left:50%;top:50%;width:58px;height:4px;margin:-2px 0 0 -29px;
  border-radius:2px;background:linear-gradient(90deg,#6b4c1f,#c9972f,#6b4c1f)}
.helm .wheel i:nth-child(2){transform:rotate(45deg)}
.helm .wheel i:nth-child(3){transform:rotate(90deg)}
.helm .wheel i:nth-child(4){transform:rotate(135deg)}
.helm .hub{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border-radius:50%;background:#1a242f;box-shadow:0 0 0 2px #c9972f}
.helm .binnacle{position:absolute;left:50%;bottom:-13px;width:17px;height:15px;margin-left:-8.5px;
  border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#6b482a,#2a1c10);
  box-shadow:0 0 0 1px #a87c35}
.bowsprit{position:absolute;right:-8%;bottom:34px;width:21%;height:5px;border-radius:2px;
  background:linear-gradient(90deg,#33230f,#8a6438);transform:rotate(-14deg);transform-origin:0 50%}
/* tier badge + crew stepper */
.shipbar{position:absolute;top:8px;left:0;right:0;z-index:5;display:flex;
  align-items:center;justify-content:center;gap:14px;font-size:10.5px;color:#7fa8c6}
.shipbar .tier{font:650 11px var(--mono);color:var(--brass);letter-spacing:.04em}
.shipbar .step{display:flex;align-items:center;gap:1px;background:rgba(9,20,30,.72);

.shipbar .step button:hover{background:#172c3d;color:#fff}
.shipbar .step span{padding:0 7px;font:650 11px var(--mono);color:#cfe0ef}

.deckrow{display:flex;gap:18px;align-items:flex-start}
.deckrow .card-d{flex:1;min-width:0}

.fig .sash{position:absolute;left:28px;bottom:36px;width:36px;height:5px;background:var(--gold,#c9972f);

.fig .buckle{position:absolute;left:41px;bottom:25px;width:10px;height:7px;border-radius:2px;

.fig .epaL,.fig .epaR{--w:11px;--h:5px;--d:12px;--c:#d0a340}
.fig .epaL{left:20px;bottom:56px} .fig .epaR{left:53px;bottom:56px}
.fig .tricorn{--w:38px;--h:6px;--d:32px;left:23px;bottom:79px;--c:var(--hat)}
.fig .tricrown{--w:24px;--h:10px;--d:22px;left:30px;bottom:82px;--c:var(--hat)}

.m-full .fig.r-cap .plume{animation:plumewave 3.2s ease-in-out infinite;transform-origin:0 50%}

.fig .patch{position:absolute;left:39px;bottom:69px;width:8px;height:7px;border-radius:2px;background:#0d0d11;

.fig .beard{--w:16px;--h:6px;--d:14px;left:38px;bottom:60px;--c:#3a2f28}

.fig.c-idle  .armR{transform:rotate(6deg)}

.m-3d .fig.r-cap{animation:bobk 4s ease-in-out infinite}
.m-3d .fig.c-order{animation:joltk .55s ease-out}
@media(max-width:820px){ .deckrow{flex-direction:column} .capstage{flex:0 0 auto;height:236px} }

const byId=id=>TASKS.find(t=>t.id===id);
const inFlight=()=>TASKS.filter(t=>['working','gate','review'].includes(t.st)).length;
const depsOk=t=>!t.dep||t.dep.every(d=>byId(d).st==='merged');
let lanesDirty=true, deckDirty=true;

function tick(){
  heading += rnd(-0.55,0.55); if(heading<310)heading=310; if(heading>324)heading=324;
  for(const c of CREW){
    if(c.id==='firstmate'){ c.pct=100; continue; }
    if(!c.task){ c.pct=0; c.st='queued'; continue; }
    const t=byId(c.task);
    c.pct=Math.min(100,c.pct+rnd(1.6,5.4)); t.pct=c.pct; c.st=t.st;
    if(c.pct>=100) advance(t,c);
  }
  // dispatch queued work into free worker slots
  const free=CREW.filter(c=>c.role==='w'&&!c.task);
  for(const c of free){
    const t=TASKS.find(x=>x.st==='queued'&&depsOk(x));
    if(!t||inFlight()>=3) break;
    t.st='working'; t.who=c.id; t.round=1; t.pct=0; c.task=t.id; c.pct=0; c.st='working';
    emit('','dispatch',{t:t.id,w:c.id}); fly('firstmate',c.id,'order'); lanesDirty=true;
  }
  paint();
}
function advance(t,c){
  c.pct=0; t.pct=0; lanesDirty=true;
  if(t.st==='working'){
    if(Math.random()<0.25){ t.st='gate'; t.note='gateFail'; emit('bad','gatebad',{t:t.id}); fly(c.id,c.id,'reject'); }
    else { t.st='review'; t.note=null; t.pr=t.pr||(10+seq%9); emit('ok','gate',{t:t.id}); fly(c.id,'reviewer-1','parcel');
           emit('','review',{t:t.id,r:t.round}); c.task=null; c.st='queued';
           const rv=CREW.find(x=>x.role==='r'); if(!rv.task){rv.task=t.id;rv.pct=0;rv.st='review';} }
  } else if(t.st==='gate'){
    t.round++; t.st='working'; t.note=null;
    if(t.round>=3){ t.note='askCrit'; emit('cap','ask',{w:c.id,t:t.id}); }
    else emit('','commit',{w:c.id,pr:t.pr||'—'});
  } else if(t.st==='review'){
    if(t.round>=3||Math.random()<0.6){ emit('ok','approve',{t:t.id}); fly('reviewer-1','firstmate','approve'); t.st='merged'; t.note=null;
      emit('ok','merged',{t:t.id}); }
    else { t.round++; t.st='working'; emit('','review',{t:t.id,r:t.round});
      const w=CREW.find(x=>x.role==='w'&&!x.task); if(w){w.task=t.id;w.pct=0;w.st='working';t.who=w.id;fly('reviewer-1',w.id,'reject');} }
    if(c.role==='r'){ c.task=null; c.st='queued';
      const nx=TASKS.find(x=>x.st==='review'); if(nx){c.task=nx.id;c.pct=nx.pct;c.st='review';} }
  }
}

function applyRot(){
  document.querySelectorAll('.pivot').forEach(p=>{
    const r=ROT[p.dataset.pivot]||(p.dataset.pivot==='captain'?CAPDEF:DEF);
    p.style.setProperty('--rx',r.rx+'deg');
    p.style.setProperty('--ry',r.ry+'deg');
  });
}
let drag=null;
addEventListener('pointerdown',e=>{
  const host=e.target.closest('.scene,.stage,.capstage'); if(!host) return;
  const pv=e.target.closest('.pivot');
  const ids = pv ? [pv.dataset.pivot] : [...host.querySelectorAll('.pivot')].map(x=>x.dataset.pivot);
  if(!ids.length) return;
  drag={x:e.clientX,y:e.clientY,ids,moved:false,
        base:Object.fromEntries(ids.map(i=>[i,{...(ROT[i]||(i==='captain'?CAPDEF:DEF))}]))};
  e.preventDefault();
});
addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(dx,dy)<4) return;
  if(!drag.moved){ drag.moved=true;
    drag.ids.forEach(i=>document.querySelector('.pivot[data-pivot="'+i+'"]')?.classList.add('dragging')); }
  for(const i of drag.ids){
    const b=drag.base[i];
    ROT[i]={ry:b.ry+dx*0.6, rx:Math.max(-12,Math.min(38,b.rx-dy*0.35))};
  }
  applyRot();
});
addEventListener('pointerup',()=>{
  if(!drag) return;
  drag.ids.forEach(i=>document.querySelector('.pivot[data-pivot="'+i+'"]')?.classList.remove('dragging'));
  drag=null;
});
addEventListener('dblclick',e=>{
  if(!e.target.closest('.scene,.stage,.capstage')) return;
  const pv=e.target.closest('.pivot');
  if(pv) delete ROT[pv.dataset.pivot]; else for(const k in ROT) delete ROT[k];
  applyRot();
});

const FLYLABEL={order:'ORD',parcel:'PR',reject:'✕',approve:'✓'};
function fly(from,to,kind){
  if(variant!==4) return;
  const sc=document.querySelector('.scene'); if(!sc) return;
  const sx=posOf(from), ex=posOf(to);
  const f=document.createElement('div');
  f.className='flyer '+kind;
  f.style.setProperty('--sx',sx); f.style.setProperty('--ex',ex);
  f.style.setProperty('--dur', from===to ? '.8s' : '1.15s');
  f.textContent=FLYLABEL[kind]||'';
  sc.appendChild(f);
  setTimeout(()=>{
    const tgt=sc.querySelector('.fig[data-crew="'+to+'"]');
    if(tgt){ tgt.classList.add('react'); setTimeout(()=>tgt.classList.remove('react'),560); }
  }, from===to?600:900);
  setTimeout(()=>f.remove(), 1400);
}

const SHIP=[
 {max:3, masts:1, rows:1, deckW:42, name:{en:'Cutter',          tw:'單桅小艇',  cn:'单桅小艇'}},
 {max:5, masts:2, rows:1, deckW:54, name:{en:'Schooner',        tw:'雙桅縱帆船',cn:'双桅纵帆船'}},
 {max:8, masts:3, rows:2, deckW:66, name:{en:'Frigate',         tw:'三桅巡防艦',cn:'三桅巡防舰'}},
 {max:12,masts:4, rows:2, deckW:74, name:{en:'Ship of the line',tw:'四桅戰列艦',cn:'四桅战列舰'}},
 {max:99,masts:5, rows:3, deckW:82, name:{en:'Flagship',        tw:'旗艦',      cn:'旗舰'}},
];
const ROWH=68, DECKY=104;
// how far above the mast foot the tallest crew member's head reaches
const headroom = sp => (sp.rows-1)*ROWH + 100;
const mastH = (sp,isMain) => 96 + headroom(sp) + sp.masts*5 + (isMain?28:0);
const sceneH = sp => DECKY + 20 + mastH(sp,true) + 46;
const shipOf = n => SHIP.find(s=>n<=s.max);
let DENS=1, ROWS=1;
const deckOrder = () => [...CREW.filter(c=>c.role==='w'),...CREW.filter(c=>c.role==='fm'),
                         ...CREW.filter(c=>c.role==='r')];
function layout(){
  const ord=deckOrder(), n=ord.length, sp=shipOf(n);
  const rows=sp.rows;
  sp.sceneH = sceneH(sp);
  // capacity is proportional to each deck's width; upper decks are shorter
  const wOf = r => sp.deckW*(1-0.18*r);
  const wsum = Array.from({length:rows},(_,r)=>wOf(r)).reduce((a,b)=>a+b,0);
  const cap = Array.from({length:rows},(_,r)=>Math.max(1,Math.round(n*wOf(r)/wsum)));
  while(cap.reduce((a,b)=>a+b,0)>n) cap[cap.indexOf(Math.max(...cap))]--;
  while(cap.reduce((a,b)=>a+b,0)<n) cap[0]++;
  // firstmate takes the highest deck (the helm); reviewer the next one down
  const fm=ord.find(c=>c.role==='fm'), rv=ord.find(c=>c.role==='r');
  const ws=ord.filter(c=>c.role==='w');
  const buckets=Array.from({length:rows},()=>[]);
  buckets[rows-1].push(fm);
  (rows>1?buckets[rows-2]:buckets[0]).push(rv);
  let r=0;
  for(const w of ws){ while(buckets[r].length>=cap[r] && r<rows-1) r++; buckets[r].push(w); }
  buckets.forEach((b,ri)=>{
    const w=wOf(ri), lo=50-w/2+5, hi=50+w/2-(ri===0?9:6), m=b.length;
    const pw = m<=1 ? '24%' : ((hi-lo)/(m-1)*0.88).toFixed(2)+'%';   // per deck, not global
    b.forEach((c,k)=>{ c.row=ri; c.px = m===1 ? 50 : lo+(hi-lo)*k/(m-1); c.plateW = pw; });
  });
  const widest=Math.max(...buckets.map(b=>b.length));
  CREW.forEach(c=>{ c.sc = Math.max(0.52, Math.min(0.9, 4.2/Math.max(3,widest))); });
  DENS = widest<=4 ? 1 : widest<=7 ? 2 : 3;
  ROWS = rows;
  return sp;
}
const posOf = id => { const c=CREW.find(x=>x.id===id); return c? c.px.toFixed(2)+'%' : '50%'; };
function addCrew(d){
  if(d>0){
    if(CREW.length>=14) return;
    const ws=CREW.filter(c=>c.role==='w');
    const id='worker-'+(Math.max(0,...ws.map(w=>+w.id.split('-')[1]))+1);
    CREW.splice(CREW.length-1,0,{id,role:'w',st:'queued',task:null,pct:0});
  } else {
    const ws=CREW.filter(c=>c.role==='w');
    if(ws.length<=1) return;
    const victim=[...ws].reverse().find(w=>!w.task) || ws[ws.length-1];
    if(victim.task){ const t=byId(victim.task); if(t){t.st='queued';t.who=null;t.pct=0;} lanesDirty=true; }
    CREW.splice(CREW.indexOf(victim),1);
  }
  const sc=document.getElementById('scene'); if(sc) sc.innerHTML=scene();
  paint();
}

function shipMarkup(sp,n){
  const SKULL = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2C7 2 4 5.4 4 9.6c0 2.3 1 3.9 2.3 5 .5.4.7.9.7 1.5V18h2v-2h2v2h2v-2h2v2h2v-1.9c0-.6.2-1.1.7-1.5C19 13.5 20 11.9 20 9.6 20 5.4 17 2 12 2z\" fill=\"#e8e4da\"/><circle cx=\"9\" cy=\"10\" r=\"2.2\" fill=\"#0c0c0e\"/><circle cx=\"15\" cy=\"10\" r=\"2.2\" fill=\"#0c0c0e\"/><path d=\"M12 12.4l-1.2 2.4h2.4z\" fill=\"#0c0c0e\"/></svg>";
  const mainIdx = Math.floor(sp.masts/2);
  const clear = headroom(sp);            // sails must hang entirely above this
  let m='';
  for(let i=0;i<sp.masts;i++){
    const x = sp.masts===1 ? 50 : 20 + 60*i/(sp.masts-1);
    const isMain = i===mainIdx;
    const h = mastH(sp,isMain);
    const w = 60 + sp.masts*7;
    const sailH = Math.max(58, h - 16 - clear);
    m += '<div class="mast" style="left:'+x+'%;height:'+h+'px;--yw:'+w+'px;--sw:'+(w-8)+'px;'
       + '--rw:'+Math.round(w*0.6)+'px;--rh:'+Math.round(clear*0.68)+'px">'
       + '<div class="ratline"></div><div class="yard" style="top:10px"></div>'
       + '<div class="sail'+(isMain?' main':'')+'" style="top:16px;height:'+sailH+'px">'
       +   (isMain&&sp.masts>=3?'<span class="skull">'+SKULL+'</span>':'') + '</div>'
       + (isMain?'<div class="jolly">'+SKULL+'</div>':'') + '</div>';
  }
  let up='';
  for(let r=1;r<sp.rows;r++){
    up += '<div class="updeck" style="--r:'+r+';--dw:'+(sp.deckW*(1-0.18*r)).toFixed(1)+'%">'
        + '<div class="plate"></div><div class="skirt"></div><div class="rail"></div></div>';
  }
  const fx = sp.masts===1 ? 50 : 20;
  const stay = '<div class="stay" style="left:'+fx+'%;bottom:'+(20+mastH(sp,false))
             + 'px;width:'+(100-fx)+'%;transform:rotate(29deg)"></div>';
  const fm = CREW.find(c=>c.role==='fm');
  const hx = fm ? ((fm.px - (50 - sp.deckW/2)) / sp.deckW * 100).toFixed(2) : '25';
  const helm = '<div class="helm" style="--hx:'+hx+'%;--topR:'+(sp.rows-1)+'">'
    + '<div class="wheel"><i></i><i></i><i></i><i></i><div class="ring"></div></div>'
    + '<div class="hub"></div><div class="binnacle"></div></div>';
  const ports = Array.from({length:Math.min(13,3+sp.masts*3)},()=>'<i></i>').join('');
  return '<div class="ship"><div class="moon"></div><div class="hull" style="--deckW:'+sp.deckW+'%">'
    + '<div class="deckplate"></div><div class="hullbody"></div><div class="gunwale"></div>'
    + '<div class="ports" style="--portGap:'+(9+sp.masts*3)+'px">'+ports+'</div>'
    + '<div class="lantern"></div><div class="figurehead"></div>'
    + up + helm + m + stay + '<div class="bowsprit"></div></div></div>';
}
function plate(c){
  const t=c.task?byId(c.task):null;
  const job = c.id==='firstmate' ? T('coord') : (t ? '<b>'+c.task+'</b> '+L(t.title) : T('idle'));
  const vd = vendorOf(c);
  const odd = c.role==='r' && crossVendor();
  const nm = DENS===3 ? c.id.replace('worker-','w').replace('reviewer-','r').replace('firstmate','fm') : c.id;
  return '<div class="who"><i class="dot '+c.st+'"></i>'+nm+'</div>'
    +'<div class="vd'+(odd?' x':'')+'">'+vd+'</div>'
    +'<div class="job">'+job+'</div>'
    +'<div class="pb"><i class="'+(c.st==='gate'?'bad':'')+'" style="width:'+c.pct+'%"></i></div>'
    +'<div class="pct">'+Math.round(c.pct)+'%</div>';
}
function scene(){
  const sp=layout(), n=deckOrder().length;
  return '<div class="scene dens-'+DENS+'" style="--sceneH:'+sp.sceneH+'px">'
    + '<div class="horizon"></div>'
    + shipMarkup(sp,n)
    + '<div class="shipbar"><span class="tier">'+L(sp.name)+'</span>'
    + '<span>'+T('crewN').replace('{n}',n)+'</span>'
    + '<span class="step"><button onclick="addCrew(-1)" aria-label="fewer">&minus;</button>'
    + '<span>'+n+'</span><button onclick="addCrew(1)" aria-label="more">+</button></span>'
    + '<span>'+T('dragHint')+'</span></div>'
    + CREW.map(c=>figureRaw(c)).join('')
    + CREW.map(c=>'<div class="tag st-'+c.st+'" data-tag="'+c.id+'" style="--px:'+posOf(c.id)+';--r:'+(c.row||0)+';--plateW:'+(c.plateW||'15%')+'">'
        + plate(c) + '</div>').join('')
    + '</div>';
}

     +'<p class="why">'+L(d.why)+'</p><div class="opts">'
     +d.opts.map(o=>'<button class="opt" aria-pressed="'+(sel===o.k)+'" onclick="pick(\''+d.id+'\',\''+o.k+'\')">'
        +'<span class="k"><em>'+o.k+'</em>'+L(o.t)+'</span><p>'+L(o.d)+'</p></button>').join('')+'</div>'
     +'<div class="dg"><div class="cap"><span>'+T('diagram')+(sel?' · '+sel:'')+'</span>'

     +'<span class="tiny dim">'+(sel?d.id+' → '+sel:T('pickFirst'))+'</span></div></div></div>'

        +'<span class="tiny dim mono">'+x.id+' · '+x.task+'</span><div>'+L(x.title)+'</div></div>').join('')+'</div>';
    deckDirty=false;
  }
  if(lanesDirty){
    document.getElementById('lanes').innerHTML=LANES.map(([st,key])=>{

      const body=items.map(t=>'<div class="tcard enter" onclick="toast(\''+t.file+'\')"><span class="tid">'+t.id+'</span>'
          +'<div class="tt">'+L(t.title)+'</div>'
          +'<div class="ft"><span>'+(t.who||'—')+'</span><span>'+(t.pr?'#'+t.pr:(t.dep?T('blockedBy')+' '+t.dep.join(','):''))+'</span></div>'
          +(t.round?'<div class="rounds">'+[1,2,3].map(r=>'<i class="'+(r<t.round?'done':r===t.round?'now':'')+'"></i>').join('')+'</div>':'')
          +(t.note?'<span class="badge">'+T(t.note)+'</span>':'')+'</div>').join('')
        +caps.map(x=>'<div class="tcard enter" onclick="setDec(\''+x.id+'\')"><span class="tid">'+x.id+' · '+x.task+'</span>'
          +'<div class="tt">'+L(x.title)+'</div><span class="badge">'+x.opts.length+' '+T('options')+'</span></div>').join('');
      return '<div class="lane'+(st==='captain'?' hot':'')+'"><h4>'+T(key)+'<i>'+(items.length+caps.length)+'</i></h4>'+body+'</div>';
    }).join('');
    lanesDirty=false;
  }
  applyRot();
  const lg=document.getElementById('log');
  if(lg) lg.innerHTML=evs.slice(0,14).map(e=>'<li class="'+e.kind+'"><time>'+e.tm+'</time><span>'+fmt(e.msg,e.vars)+'</span></li>').join('');
}
function openFlow(){
  document.getElementById('flowSheet').innerHTML='<h2>'+T('flowTitle')+'</h2><div class="flow">'
   +FLOW.map((f,i)=>'<div class="st'+(f.gate?' gate':'')+(f.cap?' cap':'')+'"><b>'+L(f.t)+'</b><span>'+L(f.d)+'</span></div>'
      +(i<FLOW.length-1?'<div class="arrow">&#8250;</div>':'')).join('')
   +'</div><h2 style="margin:24px 0 0;font-size:13.5px;color:var(--warn)">'+T('gatesTitle')+'</h2>'
   +'<ul class="gatelist">'+GATES.map((g,i)=>'<li><b>'+(i+1)+'</b>'+L(g)+'</li>').join('')+'</ul>'
   +'<p class="tiny dim" style="margin:18px 0 0">'+T('origin')+'</p>';
  document.getElementById('flowOverlay').classList.add('on');
}
document.getElementById('flowOverlay').onclick=e=>{if(e.target.id==='flowOverlay')e.currentTarget.classList.remove('on')};

/* ====================== SWITCHER (prototype-only) ====================== */
const MOTION={1:{en:'Steady — live data, calm',tw:'穩舵 —— 會動但克制',cn:'稳舵 —— 会动但克制'},
              2:{en:'Full sail — waves, wake, sweep',tw:'滿帆 —— 海浪、尾流、雷達',cn:'满帆 —— 海浪、尾流、雷达'},
              3:{en:'Full sail + 3D crew',tw:'滿帆＋3D 船員',cn:'满帆＋3D 船员'},
              4:{en:'Shared deck — crew interact',tw:'同一甲板 —— 船員互動',cn:'同一甲板 —— 船员互动'}};
function go(step){ step=step||1; variant=((variant-1+step+4)%4)+1;
  const u=new URL(location); u.searchParams.set('variant',variant); history.replaceState(null,'',u); shell(); }
function sw(){ document.getElementById('switcher').innerHTML=
   '<button onclick="go(-1)" aria-label="previous">&#8249;</button>'
  +'<span class="lbl">'+variant+' <em>'+L(MOTION[variant])+'</em></span>'
  +'<button onclick="go(1)" aria-label="next">&#8250;</button><span class="tag">PROTOTYPE</span>'; }
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='ArrowRight') go(1);
  if(e.key==='Escape') document.getElementById('flowOverlay').classList.remove('on');
});
shell();
setInterval(tick,900);
</script>
