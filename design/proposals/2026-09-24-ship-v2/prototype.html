<!doctype html>
<!--
  PROTOTYPE v2 (T-070) - a design artefact, not production code.
  Question: what does the captain's whole board look like when its ship sails a
  living sea, with every motion tied to real state, and the page around it reads
  as a ship's log and a chart table?
  Fixture data only. Nothing is wired to a backend, nothing dispatches, and
  nothing changes unless the captain acts on the page or presses a switch. Opens from disk with no network;
  the two OFL faces are vendored under ./fonts (see README.md).
  The production board is rewritten from this, not promoted from it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype v2: the living ship</title>
<style>
/* ===== type: one engraved display face in one place, one condensed sans for everything else ===== */
@font-face{font-family:"IM Fell English SC";font-style:normal;font-weight:400;font-display:swap;
  src:local("IM FELL English SC"),local("IMFeENsc28P"),url("fonts/im-fell-english-sc-400.woff2") format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:400;font-display:swap;
  src:local("Barlow Semi Condensed"),local("BarlowSemiCondensed-Regular"),url("fonts/barlow-semi-condensed-400.woff2") format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;
  src:local("Barlow Semi Condensed Medium"),local("BarlowSemiCondensed-Medium"),url("fonts/barlow-semi-condensed-500.woff2") format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:600;font-display:swap;
  src:local("Barlow Semi Condensed SemiBold"),local("BarlowSemiCondensed-SemiBold"),url("fonts/barlow-semi-condensed-600.woff2") format("woff2")}

/* the hour cross-fades: these are registered so a change of time interpolates instead of snapping */
@property --sky0{syntax:"<color>";inherits:true;initial-value:#5F9EBB}
@property --sky1{syntax:"<color>";inherits:true;initial-value:#8FC1D4}
@property --sky2{syntax:"<color>";inherits:true;initial-value:#D3E6E8}
@property --glow{syntax:"<color>";inherits:true;initial-value:#F4F0DC}
@property --sea0{syntax:"<color>";inherits:true;initial-value:#A5CDD0}
@property --sea1{syntax:"<color>";inherits:true;initial-value:#4B8E9A}
@property --sea2{syntax:"<color>";inherits:true;initial-value:#23606F}
@property --sea3{syntax:"<color>";inherits:true;initial-value:#153F4C}
@property --isle{syntax:"<color>";inherits:true;initial-value:#86A8AA}
@property --cloud{syntax:"<color>";inherits:true;initial-value:#F5F7F6}
@property --cloudS{syntax:"<color>";inherits:true;initial-value:#BACDD3}
@property --amb{syntax:"<color>";inherits:true;initial-value:#FFFFFF}
@property --rim{syntax:"<color>";inherits:true;initial-value:rgba(255,248,230,.55)}
@property --pg{syntax:"<color>";inherits:true;initial-value:#E4ECEC}
@property --pg2{syntax:"<color>";inherits:true;initial-value:#D4E0E1}
@property --pgText{syntax:"<color>";inherits:true;initial-value:#12283A}
@property --pgText2{syntax:"<color>";inherits:true;initial-value:#46606E}
@property --pgLine{syntax:"<color>";inherits:true;initial-value:#B7C8CB}
@property --sheet{syntax:"<color>";inherits:true;initial-value:#F1F6F5}

:root{
  /* materials, not accents */
  --tar:#3A2418; --sailcloth:#E8DDC4; --brass:#C99A3C; --ensign:#B23A2E; --seaglass:#6FA8A0; --ink:#0E2A3B;
  --tarLit:#553623; --tarDeep:#1E130C; --timber:#6B4A33; --oak:#A58B6B; --oakShade:#7B644C;
  --rope:#8A7350; --iron:#2C2C30;
  --display:"IM Fell English SC","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Barlow Semi Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow","PingFang TC","PingFang SC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --ambK:0%; --bL:.72; --bR:.9; --bT:1.3; --rimX:-1; --shX:-1; --lamp:0; --stars:0;
  --dark:0; --rays:0; --foam:.4; --flagA:.6; --flagT:1.6s;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--pg);color:var(--pgText);font:400 16px/1.45 var(--sans);font-stretch:semi-condensed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:--pg 1.2s ease,--pg2 1.2s ease,--pgText 1.2s ease,--pgText2 1.2s ease,--pgLine 1.2s ease,--sheet 1.2s ease}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pgText);outline-offset:2px}

/* ===== the quiet board around the ship: a ship's log and a chart table =====
   Every surface is the hour's page or its chart sheet; rules, not boxes, carry structure.
   Square corners throughout: paper and brass, not rounded cards. */
a{color:inherit}
.top{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:12px 24px 10px}
.brand{font-weight:600;font-size:20px;letter-spacing:.01em}
.brand span{font-weight:400;color:var(--pgText2);font-size:16px;margin-left:8px}
.top .spacer{flex:1}
.clock{color:var(--pgText2);font-size:16px;font-variant-numeric:tabular-nums}
/* page-chrome classes never share a name with the scene's state classes (.live, .s-*, .sel, .hot, .over, .l) */
.top .livemark{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--pgText2)}
.top .livemark i{width:8px;height:8px;border-radius:50%;background:var(--seaglass);box-shadow:0 0 0 3px color-mix(in oklab,var(--seaglass) 30%,transparent)}
/* the engine badge is a small brass-riveted tag; the names are the config's own words */
.engine{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px var(--pgLine)}
.engine i{width:6px;height:6px;background:radial-gradient(circle at 35% 35%,#F2D9A0,var(--brass) 55%,#6E4E1A);border-radius:50%}
.engine b{font-weight:500;color:var(--pgText2)}
.gl{font-size:13px;color:var(--pgText2)}
.langs{display:flex;box-shadow:inset 0 0 0 1px var(--pgLine)}
.langs button{min-height:40px;min-width:44px;padding:4px 10px;font-size:16px}
.langs button[aria-pressed=true]{background:var(--pgText);color:var(--pg)}
/* the tally: six figures across the head of the log, ruled like a ledger's first line */
.counts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:0 24px;border-top:2px solid var(--pgText);border-bottom:1px solid var(--pgLine)}
.counts>div{padding:8px 14px 10px;border-left:1px solid var(--pgLine);min-width:0}
.counts>div:first-child{border-left:0;padding-left:2px}
.counts b{display:block;height:1.1em;overflow:hidden;font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.counts .roll{display:block}.counts .roll>span{display:block;height:1.1em}
.counts span.l{display:block;font-size:13px;color:var(--pgText2)}
/* a fitting, not a highlight: a brass strip over "waiting on you", an ensign strip over "blocked" */
.counts>div.hot{background:linear-gradient(var(--brass),var(--brass)) 0 -2px/100% 4px no-repeat}
.counts>div.bad{background:linear-gradient(var(--ensign),var(--ensign)) 0 -2px/100% 4px no-repeat}
h2.sec{margin:0 0 10px;font-size:20px;font-weight:600;line-height:1.2;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2.sec .n{font-size:16px;font-weight:500;color:var(--pgText2);font-variant-numeric:tabular-nums}
/* the state mark: a small pennant, the same swallowtail the crew fly on deck */
.mk{display:inline-block;flex:0 0 auto;width:13px;height:10px;background:var(--mkc,var(--pgLine));clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.mk.m-backlog{--mkc:var(--pgLine)}.mk.m-ready{--mkc:var(--pgText2)}.mk.m-working{--mkc:var(--pgText)}.mk.m-gate{--mkc:var(--ensign)}
.mk.m-review{--mkc:var(--seaglass)}.mk.m-captain{--mkc:var(--brass)}.mk.m-merged{--mkc:color-mix(in oklab,var(--seaglass) 55%,var(--pgLine))}
.mk.m-parked,.mk.m-closed,.mk.m-idle{--mkc:var(--pgLine)}
/* chart sheets: square, with a double neat line like a printed chart */
.sheet{background:var(--sheet);border:1px solid var(--pgLine);box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 4px color-mix(in oklab,var(--pgLine) 70%,transparent)}
.btn2{min-height:44px;padding:8px 18px;font-size:16px;font-weight:600;background:var(--pg);box-shadow:inset 0 0 0 1px var(--pgLine)}
.btn2:hover{box-shadow:inset 0 0 0 1px var(--pgText2)}
/* the one button that sends an order is a brass fitting with the words cut in, like the name plate */
.go{min-height:44px;padding:8px 22px;font-size:16px;font-weight:600;color:var(--tar);
  background:linear-gradient(180deg,#E2BE6A 0%,var(--brass) 42%,#9C7428 100%);
  box-shadow:0 0 0 1px #5E4316,inset 0 1px 0 rgba(255,240,200,.6);text-shadow:0 1px 0 rgba(255,236,190,.5)}
.go:disabled{filter:saturate(.3) brightness(.9);opacity:.55;cursor:not-allowed}
.go:not(:disabled):active{box-shadow:0 0 0 1px #5E4316,inset 0 1px 3px rgba(40,26,8,.45)}
.danger{min-height:44px;padding:8px 18px;font-size:16px;font-weight:600;background:var(--ensign);color:var(--sailcloth)}

/* ===== the decision deck: pending calls lead the page ===== */
.deckwrap{padding:18px 24px 14px}
.deckwrap[hidden]{display:none}
.deckrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.capstage{width:160px;text-align:center;padding-top:4px}
.capstage[hidden]{display:none}
/* the captain's portrait through a brass porthole: the same figure, the same pose as on deck */
.porthole{position:relative;width:152px;height:152px;margin:0 auto;border-radius:50%;padding:9px;
  background:conic-gradient(from 210deg,#6E4E1A,#E4C27A 18%,#9C7428 36%,#F2D9A0 55%,#8E6A22 74%,#C99A3C 90%,#6E4E1A);
  box-shadow:0 0 0 1px #4A3410,0 4px 10px rgba(14,42,59,.3)}
.porthole .glass{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;perspective:900px;
  background:linear-gradient(180deg,var(--sky0) 0%,var(--sky2) 60%,var(--timber) 60% 67%,var(--brass) 67% 68.5%,var(--tar) 68.5%);
  box-shadow:inset 0 0 0 2px #4A3410,inset 0 6px 14px rgba(0,0,0,.35)}
.porthole .glass::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(60% 40% at 32% 22%,rgba(255,255,255,.28),transparent 70%)}
.porthole .ppivot{left:17px;top:62px}
.capstage .lbl{margin-top:8px;line-height:1.25}
.capstage .lbl b{display:block;font-size:16px;font-weight:600}
.capstage .lbl span{display:block;font-size:13px;color:var(--pgText2)}
.dcard{padding:18px 22px 20px;min-width:0}
.dcard .meta{font-size:13px;color:var(--pgText2);font-variant-numeric:tabular-nums}
.dcard h3{margin:2px 0 6px;font-size:22px;font-weight:600;line-height:1.25;max-width:40em}
.links{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;font-size:16px}
.links a{text-decoration:underline;text-decoration-color:var(--pgLine);text-underline-offset:3px;text-decoration-thickness:1.5px}
.links a:hover{text-decoration-color:var(--pgText)}
.dbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px 28px;align-items:start}
.dbody>div,.deckrow>*{min-width:0}
@media(max-width:1100px){.dbody{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.deckrow{grid-template-columns:minmax(0,1fr)}.capstage{width:auto}}
.explanation{margin:0;font-size:16px;line-height:1.5;max-width:68ch}
/* the authored diagram in its frame: the chart the firstmate drew for this call */
.dg{margin:12px 0 0;padding:10px 12px 8px;background:var(--pg);border:1px solid var(--pgLine)}
.dg .scroll{overflow-x:auto}
/* a diagram never draws narrower than its viewBox (523 units), so a 13-unit label never renders under 13 px;
   a narrower frame scrolls instead of shrinking the text */
.dg svg{display:block;width:100%;min-width:523px;height:auto;font-family:var(--sans)}
.dg figcaption{margin-top:6px;font-size:13px;color:var(--pgText2)}
.dg .box{fill:var(--sheet);stroke:var(--pgText);stroke-width:1.2}
.dg .box.q{stroke-dasharray:5 4;stroke:var(--pgText)}
.dg .box.hot{fill:color-mix(in oklab,var(--brass) 22%,var(--sheet))}
.dg .ln{stroke:var(--pgText);stroke-width:1.2;fill:none}
.dg .t1{fill:var(--pgText);font-size:14px;font-weight:600}
.dg .t2{fill:var(--pgText2);font-size:13px}
.dg .hd{fill:var(--pgText2);font-size:13px;font-weight:600}
.change-fallback{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px;font-size:16px}
.change-fallback b{display:block;font-size:13px;font-weight:600;color:var(--pgText2)}
.change-fallback p{margin:2px 0 0}
.opts{margin:0;padding:0;list-style:none;border-top:1px solid var(--pgLine)}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;width:100%;min-height:44px;padding:9px 10px 10px 8px;text-align:left;border-bottom:1px solid var(--pgLine)}
.opt:hover:not(:disabled){background:color-mix(in oklab,var(--pgText) 5%,transparent)}
.opt .k{font-size:20px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.opt .d{font-size:16px;font-weight:500;line-height:1.35}
.opt .pc{grid-column:2;font-size:13px;line-height:1.4;color:var(--pgText2)}
.opt .pc b{font-weight:600;color:var(--pgText)}
.opt[aria-pressed=true]{background:color-mix(in oklab,var(--pgText) 9%,transparent);box-shadow:inset 3px 0 0 var(--pgText)}
.opt:disabled{cursor:default;opacity:.7}
.custom{display:block;margin-top:10px;font-size:13px;color:var(--pgText2)}
.custom[hidden]{display:none}
.custom textarea{display:block;width:100%;min-height:76px;margin-top:4px;padding:8px 10px;font:16px/1.4 var(--sans);color:var(--pgText);background:var(--pg);border:1px solid var(--pgLine);border-radius:0;resize:vertical}
.acts{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-top:12px}
.validation{font-size:13px;color:var(--pgText)}
.validation:empty{display:none}
.gates{margin:12px 0 0;padding:0;list-style:none;columns:2 180px;column-gap:18px;font-size:16px}
.gates li{display:flex;gap:8px;padding:2px 0;break-inside:avoid}
.gates li i{font-style:normal;width:14px;flex:0 0 14px;color:var(--seaglass);font-weight:600}
.gates li.n{color:var(--pgText2)}.gates li.n i{color:var(--ensign)}
.also{margin:14px 0 8px;font-size:16px;font-weight:600}
.dstrip{margin-bottom:8px;min-width:0}
.dstrip>summary{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;min-height:44px;padding:11px 14px;cursor:pointer;list-style:none}
.dstrip>summary::-webkit-details-marker{display:none}
.dstrip>summary::before{content:"";width:0;height:0;border:5px solid transparent;border-left:7px solid var(--pgText2);align-self:center}
.dstrip[open]>summary::before{transform:rotate(90deg)}
.dstrip>summary .st{font-size:16px;font-weight:500}
.dstrip>summary .picked{font-size:13px;font-weight:600;padding:1px 12px 2px 7px;background:var(--pgText);color:var(--pg);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%)}
.dstrip>.dcard{border:0;box-shadow:none;padding-top:4px}
#orderFeedback{margin:10px 0 0;font-size:16px}
#orderFeedback:empty{display:none}

/* ===== the crew roster: a muster list under the ship ===== */
.rostbar{margin-left:auto}
.roster{padding:10px 24px 6px}
.roster[hidden]{display:none}
.roster ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));column-gap:30px}
.rrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:1px 10px;align-items:baseline;align-content:start;padding:8px 0 9px;border-bottom:1px solid var(--pgLine)}
.rrow .nm{font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rrow .nm small{font-size:13px;font-weight:500;color:var(--pgText2);margin-left:8px}
.rrow .rpr{font-size:13px}
.rrow .en{grid-column:2/-1;font-size:13px;font-weight:500;color:var(--pgText)}
.rrow .jb{grid-column:2/-1;font-size:13px;color:var(--pgText2);line-height:1.4}
.rrow .jb b{font-weight:600;color:var(--pgText)}
.pb{display:inline-block;width:64px;height:4px;margin:0 6px 0 8px;vertical-align:middle;background:var(--pgLine)}
.pb i{display:block;height:100%;background:var(--pgText)}

/* ===== the fleet: seven ruled columns on one chart table ===== */
.fleet{padding:22px 24px 8px}
.lanes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
@media(max-width:1100px){.lanes{grid-template-columns:repeat(4,minmax(0,1fr))}.lane:nth-child(4n+1){border-left:0}}
@media(max-width:700px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}.lane:nth-child(odd){border-left:0}.lane:nth-child(even){border-left:1px solid var(--pgLine)}}
@media(max-width:460px){.lanes{grid-template-columns:minmax(0,1fr)}.lane{border-left:0!important}}
.lane{min-width:0;min-height:140px;padding:6px 10px 12px;border-left:1px solid var(--pgLine)}
.lane:first-child{border-left:0}
.lane h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 2px;padding:6px 0 7px;font-size:16px;font-weight:600;border-bottom:3px double var(--pgText)}
.lane h3 i{font-style:normal;font-weight:500;color:var(--pgText2);font-variant-numeric:tabular-nums}
/* the captain's column is the one that asks for him: a faint ink wash, and its rule in brass */
.lane.l-captain.has{background:color-mix(in oklab,var(--pgText) 6%,transparent)}
.lane.l-captain.has h3{border-bottom-color:var(--brass)}
.card{position:relative;padding:8px 2px 10px;border-bottom:1px solid var(--pgLine);background:var(--sheet)}
.lane.l-captain.has .card{background:transparent}
.card .hd{display:flex;align-items:center;gap:8px;min-height:32px}
.card .id{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.card .pr{font-size:13px;text-decoration:underline;text-decoration-color:var(--pgLine);text-underline-offset:3px}
.card .pr:hover{text-decoration-color:var(--pgText)}
.card .t{font-size:16px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.card .cw{margin-top:3px;font-size:13px;color:var(--pgText2);overflow-wrap:anywhere}
.card .dep{margin-top:3px;font-size:13px;color:var(--pgText)}
.card .dep::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border:1.5px solid var(--ensign);transform:rotate(45deg) translateY(-1px)}
.badge{display:inline-block;margin:7px 6px 0 0;padding:1px 14px 2px 7px;font-size:13px;font-weight:600;line-height:1.35;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%)}
.badge.b-gate{background:var(--ensign);color:var(--sailcloth)}
.badge.b-decision{background:var(--pgText);color:var(--pg)}
.badge.b-ask{background:var(--seaglass);color:var(--ink)}
.cmenu{margin-left:auto;min-width:36px;min-height:32px;font-size:20px;line-height:1;color:var(--pgText2)}
.cmenu:hover,.cmenu[aria-expanded=true]{color:var(--pgText);background:var(--pg2)}
.cacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cacts button{min-height:40px;padding:4px 14px;font-size:16px;background:var(--pg);box-shadow:inset 0 0 0 1px var(--pgLine)}
.cacts button:hover{box-shadow:inset 0 0 0 1px var(--pgText2)}
.card[draggable=true]{cursor:grab}
.card.lifted{opacity:.4}
.lane .more{margin:8px 0 0;font-size:13px;color:var(--pgText2)}
.setaside{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
@media(max-width:700px){.setaside{grid-template-columns:minmax(0,1fr)}}
#parked{background:var(--sheet);border:1px dashed var(--pgText2)}
#parked>summary,#history>summary{min-height:44px;padding:11px 14px;font-size:16px;font-weight:600;cursor:pointer}
#parked>summary i,#history>summary i{font-style:normal;font-weight:500;color:var(--pgText2);margin-left:6px;font-variant-numeric:tabular-nums}
.parked-cards,.history-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));column-gap:18px;padding:0 14px 10px}
#dropzone{display:flex;align-items:center;gap:10px;min-height:44px;padding:11px 14px;font-size:16px;color:var(--pgText2);border:1.5px dashed var(--ensign)}
#dropzone::before{content:"";width:12px;height:12px;flex:0 0 12px;background:var(--ensign);clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%)}
.fleet.dragging [data-zone]{outline:1.5px dashed var(--pgText2);outline-offset:3px}
.fleet [data-zone].over{outline:2px solid var(--pgText);outline-offset:3px}
#dropConfirm{margin-top:12px;padding:12px 16px 14px;background:var(--sheet);box-shadow:inset 4px 0 0 var(--ensign),0 0 0 1px var(--pgLine)}
#dropConfirm[hidden]{display:none}
#dropConfirm p{margin:0;font-size:16px;max-width:70ch}
#taskFeedback{margin:10px 0 0;font-size:16px}
#taskFeedback:empty{display:none}
#history{margin-top:14px;border-top:1px solid var(--pgLine)}
#history>summary{padding-left:2px}
.history-cards{padding:0 2px 8px}
.history-cards .card{background:transparent}

/* ===== the live log: a ship's log, newest entry at the head ===== */
.logwrap{padding:22px 24px 26px}
.log{margin:0;padding:0;list-style:none;max-height:340px;overflow:auto}
.log li{display:grid;grid-template-columns:76px 104px minmax(0,1fr);gap:12px;align-items:baseline;padding:7px 12px 8px;border-bottom:1px solid var(--pgLine)}
.log li:last-child{border-bottom:0}
.log time{font-size:13px;color:var(--pgText2);font-variant-numeric:tabular-nums}
.log .who{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.log .x{display:flex;gap:8px;align-items:baseline;font-size:16px;line-height:1.4}
.log .x .mk{transform:translateY(1px)}
.log .empty{display:block;font-size:16px;color:var(--pgText2)}
@media(max-width:620px){.log li{grid-template-columns:64px minmax(0,1fr)}.log .x{grid-column:1/-1}}
@media(max-width:700px){.counts{grid-template-columns:repeat(3,minmax(0,1fr));margin:0 14px}.counts>div:nth-child(4){border-left:0;padding-left:2px}
  .deckwrap,.fleet,.logwrap,.roster{padding-left:14px;padding-right:14px}}

/* ===== the scene: the one bold thing ===== */
.scene{position:relative;width:100%;overflow:hidden;background:var(--sky1);
  transition:--sky0 1.2s ease,--sky1 1.2s ease,--sky2 1.2s ease,--glow 1.2s ease,--sea0 1.2s ease,--sea1 1.2s ease,
    --sea2 1.2s ease,--sea3 1.2s ease,--isle 1.2s ease,--cloud 1.2s ease,--cloudS 1.2s ease,--amb 1.2s ease,--rim 1.2s ease;
  user-select:none;-webkit-user-select:none}
.scene>*{position:absolute}
.scene svg{display:block;overflow:visible}
#sky{left:0;top:0}
.stars{opacity:var(--stars);transition:opacity 1.2s ease}
.rays{opacity:var(--rays)}
.plx{left:0;display:flex;will-change:transform;pointer-events:none}
.plx svg{flex:0 0 auto}
.plx.isles{filter:blur(1.1px)}
.plx.clouds{filter:blur(.6px)}
.plx.squallband{opacity:var(--dark)}
.plx.near{filter:blur(.5px)}
.plx.foam{filter:blur(2.2px)}
.plx.crests{opacity:calc(var(--foam) * .7)}
.glowband{left:0;right:0;pointer-events:none;background:radial-gradient(60% 100% at var(--sunX,50%) 50%,var(--glow),transparent 70%);opacity:.55}
.darken{inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,42,59,.55),rgba(14,42,59,.15) 60%,rgba(14,42,59,.3));opacity:calc(var(--dark)*.8)}
#wake,#spray{left:0;top:0;pointer-events:none}
.vessel{left:0;top:0;will-change:transform}
.vessel>*{position:absolute;left:0;top:0}
.hull .deckhit{cursor:grab}
/* the hour lights the timber and canvas too, not only the crew */
.hull,.rig,.plate{filter:brightness(var(--shipB,1)) saturate(var(--shipS,1));transition:filter 1.2s ease}
.rig{pointer-events:none}
.jolly{transform-box:fill-box;transform-origin:0 50%;animation:flutter var(--flagT) ease-in-out infinite;transition:transform .8s ease}
@keyframes flutter{0%,100%{transform:skewY(calc(var(--flagA) * -7deg)) scaleX(1)}
  50%{transform:skewY(calc(var(--flagA) * 8deg)) scaleX(calc(1 - var(--flagA) * .1))}}
.calm .jolly{animation:none;transform:rotate(64deg) scaleX(.86)}
.lampglow{opacity:var(--lamp);transition:opacity 1.2s ease}

/* the name plate: brass is the material, the letters are cut into it */
.plate{transform:translate(-50%,-50%);padding:5px 16px 6px;text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,#E2BE6A 0%,var(--brass) 38%,#9C7428 100%);
  border-radius:3px;box-shadow:0 0 0 1.5px #5E4316,0 2px 4px rgba(20,12,6,.55),inset 0 1px 0 rgba(255,240,200,.6);
  font-family:var(--display);color:var(--tar);text-shadow:0 1px 0 rgba(255,236,190,.55);pointer-events:none}
.plate b{display:block;font-weight:400;font-size:22px;line-height:1.05;letter-spacing:.04em}
.plate span{display:block;font-size:16px;line-height:1.1;letter-spacing:.03em}

/* ===== crew: the prototype's box figures, lit by the hour ===== */
.crew{left:0;top:0;perspective:1100px;pointer-events:none}
.pivot,.ppivot{position:absolute;width:92px;height:100px;transform-style:preserve-3d;pointer-events:auto;cursor:grab;touch-action:none;
  transform-origin:46px 100px;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-26deg)) scale(var(--sc,.86));
  transition:transform .16s ease-out}
.pivot.dragging{cursor:grabbing;transition:none}
.ppivot{cursor:default;pointer-events:none}
.fig{position:absolute;inset:0;transform-style:preserve-3d}
.fig *{position:absolute;transform-style:preserve-3d}
.bx{width:var(--w);height:var(--h)}
.bx>i{display:block;border-radius:1.5px;background:color-mix(in oklab,var(--c) calc(100% - var(--ambK)),var(--amb))}
.bx>i.fr{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/2));
  box-shadow:inset calc(var(--rimX) * -2px) 0 0 0 var(--rim)}
.bx>i.sd{width:var(--d);height:var(--h);left:calc(var(--w)/2 - var(--d)/2);
  transform:rotateY(90deg) translateZ(calc(var(--w)/2));filter:brightness(var(--bR))}
.bx>i.tp{width:var(--w);height:var(--d);top:calc(var(--h)/2 - var(--d)/2);
  transform:rotateX(90deg) translateZ(calc(var(--h)/2));filter:brightness(var(--bT))}
.bx>i.lf{width:var(--d);height:var(--h);left:calc(var(--w)/2 - var(--d)/2);
  transform:rotateY(-90deg) translateZ(calc(var(--w)/2));filter:brightness(var(--bL))}
.bx>i.bk{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/-2)) rotateY(180deg);filter:brightness(.42)}
/* soft contact shadow, thrown away from the key light */
.fig .sh{left:50%;bottom:-7px;width:60px;height:14px;margin-left:calc(-30px + var(--shX) * 7px);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(20,12,6,.55),rgba(20,12,6,.18) 45%,transparent 72%);transform:translateZ(-14px)}
.fig .shoeL{--w:13px;--h:6px;--d:16px;left:31px;bottom:0}
.fig .shoeR{--w:13px;--h:6px;--d:16px;left:48px;bottom:0}
.fig .legL{--w:11px;--h:22px;--d:12px;left:32px;bottom:5px}
.fig .legR{--w:11px;--h:22px;--d:12px;left:49px;bottom:5px}
.fig .torso{--w:32px;--h:34px;--d:20px;left:30px;bottom:24px}
.fig .belt{--w:33px;--h:4px;--d:21px;left:29px;bottom:27px}
.fig .neck{--w:10px;--h:7px;--d:10px;left:41px;bottom:55px}
.fig .head{--w:21px;--h:20px;--d:19px;left:36px;bottom:61px}
.fig .eye{left:41px;bottom:70px;width:3px;height:3.5px;border-radius:1px;background:#1B1A1E;box-shadow:8px 0 0 #1B1A1E;transform:translateZ(10px)}
.fig .armL{--w:8px;--h:23px;--d:11px;left:22px;bottom:31px;transform-origin:50% 2px;transform:rotate(6deg)}
.fig .armR{--w:8px;--h:23px;--d:11px;left:62px;bottom:31px;transform-origin:50% 2px;transform:rotate(-6deg)}
.fig .handL,.fig .handR{--w:9px;--h:8px;--d:11px;left:-1px;bottom:-6px}
.fig .tool{left:-4px;bottom:-9px;width:0;height:0;opacity:0}
.fig .dprop{left:50%;bottom:-1px;margin-left:-13px;width:26px;height:20px;opacity:0;transform:translateZ(15px)}
/* hats by role */
.fig .brim{--w:30px;--h:3px;--d:26px;left:31px;bottom:78px}
.fig .crown{--w:22px;--h:8px;--d:20px;left:35px;bottom:80px}
.fig .trim{--w:31px;--h:1.5px;--d:27px;left:30.5px;bottom:80.5px;--c:var(--brass)}
.fig .cap{--w:22px;--h:9px;--d:20px;left:35px;bottom:79px}
.fig .capfold{--w:23px;--h:3px;--d:21px;left:34.5px;bottom:78px}
/* role materials */
.fig{--skin:#E9C7A2;--shirt:var(--sailcloth);--trouser:#4A3526;--shoe:#1E1712;--hat:#2A1D15}
.fig.r-fm{--shirt:#1F3A4F;--trouser:#D9CDB2;--hat:#1C1511}
.fig.r-r{--shirt:#3F6F69;--trouser:#2E2A26;--hat:#1C1511}
.fig .head,.fig .neck,.fig .handL,.fig .handR{--c:var(--skin)}
.fig .torso,.fig .armL,.fig .armR{--c:var(--shirt)}
.fig .legL,.fig .legR{--c:var(--trouser)}
.fig .shoeL,.fig .shoeR{--c:var(--shoe)}
.fig .belt{--c:#2A1D15}
.fig .brim,.fig .crown,.fig .cap{--c:var(--hat)}
.fig .capfold{--c:color-mix(in oklab,var(--hat) 80%,#000)}
/* state reads before action: blocked sags and dims, idle stands easy, nobody out of work moves */
.fig.s-gate{--ambK:42%;--amb:#4A2622}
.fig.s-gate .neck{bottom:52px}.fig.s-gate .head{bottom:57px}.fig.s-gate .eye{bottom:66px}
.fig.s-gate .brim{bottom:74px}.fig.s-gate .crown{bottom:76px}.fig.s-gate .cap{bottom:75px}.fig.s-gate .capfold{bottom:74px}.fig.s-gate .trim{bottom:76.5px}
.fig.s-gate .armR{transform:rotate(13deg)!important}.fig.s-gate .armL{transform:rotate(-8deg)!important}
.fig.s-idle{--ambK:18%;--amb:#6E7478}

/* ===== actions. the arms belong to the action; loops run only on a live run ===== */
.live.a-helm .armL,.live.a-helm .armR{animation:steer 2.4s ease-in-out infinite}
.a-helm .armL,.a-helm .armR{transform:rotate(-58deg)}
@keyframes steer{0%,100%{transform:rotate(-52deg)}50%{transform:rotate(-64deg)}}
.a-lookout .armR{transform:rotate(-106deg)}.a-lookout .armL{transform:rotate(-24deg)}
.live.a-lookout{animation:scan 4.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:rotateY(-17deg)}50%{transform:rotateY(19deg)}}
.a-signal .armR{transform:rotate(-140deg)}.a-signal .armL{transform:rotate(-20deg)}
.live.a-signal .armR{animation:wave .8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-132deg)}50%{transform:rotate(-158deg)}}
.a-point .armR{transform:rotate(-92deg)}.a-point .armL{transform:rotate(-40deg)}
.live.a-point{animation:bob 3s ease-in-out infinite}
.a-log .armR{transform:rotate(-70deg)}.a-log .armL{transform:rotate(-62deg)}
.live.a-log .armR{animation:scribble .9s ease-in-out infinite}
@keyframes scribble{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-58deg)}}
.a-haul .armL,.a-haul .armR{transform:rotate(-64deg)}
.live.a-haul .armL,.live.a-haul .armR{animation:haul 1.25s ease-in-out infinite}
.live.a-haul{animation:heave 1.25s ease-in-out infinite}
@keyframes haul{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-40deg)}}
@keyframes heave{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.a-capstan .armL{transform:rotate(-52deg)}.a-capstan .armR{transform:rotate(-58deg)}
.live.a-capstan .armR{animation:crank 1.1s linear infinite}
@keyframes crank{0%,100%{transform:rotate(-20deg)}25%{transform:rotate(-58deg)}50%{transform:rotate(-96deg)}75%{transform:rotate(-58deg)}}
.a-carry .armL,.a-carry .armR{transform:rotate(-78deg)}
.live.a-carry{animation:trudge 1.6s ease-in-out infinite}
@keyframes trudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.a-climb .armL{transform:rotate(-124deg)}.a-climb .armR{transform:rotate(-70deg)}
.live.a-climb .armL{animation:climbL 1.4s ease-in-out infinite}
.live.a-climb .armR{animation:climbR 1.4s ease-in-out infinite}
@keyframes climbL{0%,100%{transform:rotate(-124deg)}50%{transform:rotate(-70deg)}}
@keyframes climbR{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-124deg)}}
.a-hammer .armR{transform:rotate(-40deg)}.a-hammer .armL{transform:rotate(-48deg)}
.live.a-hammer .armR{animation:hammer .62s ease-in-out infinite}
@keyframes hammer{0%,100%{transform:rotate(-14deg)}45%{transform:rotate(-86deg)}}
.a-saw .armL{transform:rotate(-46deg)}.a-saw .armR{transform:rotate(-44deg)}
.live.a-saw .armR{animation:saw .7s ease-in-out infinite}
@keyframes saw{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-62deg)}}
.a-swab .armL{transform:rotate(-34deg)}.a-swab .armR{transform:rotate(-50deg)}
.live.a-swab .armR{animation:swab 1.5s ease-in-out infinite}
@keyframes swab{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(-72deg)}}
.a-lean .armL,.a-lean .armR{transform:rotate(-96deg)}
.a-coil .armL{transform:rotate(-70deg)}.a-coil .armR{transform:rotate(-62deg)}
.a-mend .armL{transform:rotate(-66deg)}.a-mend .armR{transform:rotate(-78deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* the legs shift weight only while the man is working */
.live .legL,.live .shoeL{animation:stepA var(--step,1.25s) ease-in-out infinite}
.live .legR,.live .shoeR{animation:stepB var(--step,1.25s) ease-in-out infinite}
.live.a-lean .legL,.live.a-lean .legR,.live.a-lean .shoeL,.live.a-lean .shoeR,
.live.a-helm .legL,.live.a-helm .legR,.live.a-helm .shoeL,.live.a-helm .shoeR{animation:none}
@keyframes stepA{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-5px) rotate(-12deg)}}
@keyframes stepB{0%,100%{transform:translateY(-5px) rotate(-12deg)}50%{transform:translateY(0) rotate(2deg)}}

/* ===== tools: right hand is the job, left hand steadies it ===== */
.a-hammer .tool:not(.l){opacity:1;width:16px;height:9px;border-radius:2px;transform:translateZ(6px);
  background:linear-gradient(180deg,#8E959C,#3E4449);box-shadow:0 0 0 1.5px #1E2226}
.a-hammer .tool:not(.l)::after{content:"";position:absolute;left:5px;top:8px;width:5px;height:13px;border-radius:2px;background:#6B4F2C;box-shadow:0 0 0 1px #2A2013}
.a-hammer .tool.l{opacity:1;width:18px;height:5px;left:-5px;bottom:-4px;border-radius:1px;background:var(--oak);box-shadow:0 0 0 1px #4A3622;transform:translateZ(7px)}
.a-saw .tool:not(.l){opacity:1;width:24px;height:6px;border-radius:1px;left:-14px;bottom:-4px;transform:translateZ(6px);
  background:linear-gradient(90deg,#D6DCE0,#6F7980);box-shadow:0 0 0 1px #262A2E}
.a-saw .tool.l{opacity:1;width:20px;height:5px;left:-6px;bottom:-3px;border-radius:1px;background:var(--oak);box-shadow:0 0 0 1px #4A3622;transform:translateZ(7px)}
.a-swab .tool:not(.l){opacity:1;width:4px;height:26px;border-radius:2px;left:2px;bottom:-22px;background:#6B4F2C;transform:translateZ(6px)}
.a-swab .tool:not(.l)::after{content:"";position:absolute;left:-6px;top:22px;width:16px;height:7px;border-radius:3px;background:#C9BEA2}
.a-lookout .tool:not(.l){opacity:1;width:26px;height:6px;border-radius:3px;left:-17px;bottom:2px;transform:translateZ(6px);
  background:linear-gradient(90deg,#E0B864,var(--brass) 40%,#7A5A20);box-shadow:0 0 0 1.5px #3E2C10}
.a-haul .tool:not(.l),.a-haul .tool.l{opacity:1;width:3px;height:30px;left:3px;bottom:-26px;background:var(--rope);transform:translateZ(6px) rotate(9deg)}
.a-carry .tool:not(.l){opacity:1;width:20px;height:16px;border-radius:2px;left:-6px;bottom:-14px;transform:translateZ(8px);
  background:linear-gradient(160deg,#8A6440,#4A3020);box-shadow:0 0 0 1px #24160C,inset 0 5px 0 -3px #A58B6B}
.a-capstan .tool:not(.l){opacity:1;width:14px;height:4px;border-radius:2px;left:-2px;bottom:-6px;background:#8A6438;transform:translateZ(6px)}
.a-log .tool:not(.l){opacity:1;width:3px;height:12px;border-radius:2px;left:1px;bottom:-9px;background:var(--sailcloth);transform:translateZ(8px) rotate(24deg)}
.a-log .tool.l{opacity:1;width:14px;height:11px;border-radius:1px;left:-4px;bottom:-8px;background:#6B2A22;box-shadow:inset 3px 0 0 #3E1812,0 0 0 1px #2A120C;transform:translateZ(8px)}
.a-point .tool.l{opacity:1;width:6px;height:17px;border-radius:3px;left:-1px;bottom:-13px;transform:translateZ(8px) rotate(-10deg);
  background:linear-gradient(180deg,var(--sailcloth),#A8997A);box-shadow:0 0 0 1px #5A4A2E}
.a-signal .tool:not(.l){opacity:1;width:16px;height:11px;left:-2px;bottom:-4px;transform:translateZ(6px);background:var(--ensign);
  clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%)}
.a-signal .tool.l{opacity:1;width:3px;height:16px;left:2px;bottom:-12px;background:#6B4F2C;transform:translateZ(6px);box-shadow:3px 1px 0 0 var(--seaglass)}
.a-climb .tool:not(.l),.a-climb .tool.l{opacity:1;width:4px;height:9px;border-radius:2px;left:0;bottom:-7px;background:var(--rope);transform:translateZ(6px)}
.a-lean .tool.l{opacity:1;width:9px;height:4px;border-radius:2px;left:-2px;bottom:-4px;background:#8A6438;transform:translateZ(6px)}
.a-coil .tool.l{opacity:1;width:16px;height:16px;left:-4px;bottom:-12px;border-radius:50%;transform:translateZ(8px);
  background:radial-gradient(circle,transparent 30%,var(--rope) 32% 44%,#6A5738 46% 54%,var(--rope) 56% 68%,transparent 70%)}
.a-mend .tool.l{opacity:1;width:18px;height:13px;left:-4px;bottom:-10px;border-radius:1px;background:var(--sailcloth);box-shadow:inset 0 -3px 0 #CFC2A4;transform:translateZ(8px) rotate(-8deg)}
.a-mend .tool:not(.l){opacity:1;width:2px;height:9px;left:2px;bottom:-7px;background:#B9C0C4;transform:translateZ(8px) rotate(30deg)}
/* the firstmate waiting on the captain holds up the card */
.fig.r-fm.s-captain .armL{transform:rotate(-128deg)!important;animation:none!important}
.fig.r-fm.s-captain .tool.l{opacity:1;width:14px;height:17px;left:-3px;bottom:-14px;background:var(--sailcloth);border-radius:1px;
  box-shadow:0 0 0 1px #6A5B40,inset 0 -4px 0 -2px var(--ensign);transform:translateZ(8px)}

/* ===== deck props: nobody mimes ===== */
.a-lean .dprop{opacity:1;height:22px;width:22px;margin-left:10px;border-radius:4px/7px;
  background:linear-gradient(90deg,#3D2A18,#6B4A2A 42%,#2C1D10);
  box-shadow:inset 0 4px 0 -2px var(--brass),inset 0 -4px 0 -2px var(--brass),0 0 0 1px #1A1109}
.a-capstan .dprop{opacity:1;height:17px;width:30px;margin-left:-15px;border-radius:5px;background:linear-gradient(180deg,#7D5630,#33200F);box-shadow:0 0 0 1px #1A1109,inset 0 3px 0 -1px var(--brass)}
.a-capstan .dprop::after{content:"";position:absolute;left:-7px;top:5px;width:44px;height:3px;border-radius:2px;background:#8A6438}
.a-climb .dprop{opacity:1;height:48px;width:22px;bottom:0;margin-left:-11px;
  background:repeating-linear-gradient(180deg,var(--rope) 0 2px,transparent 2px 9px),
    linear-gradient(90deg,transparent 2px,var(--rope) 2px 4px,transparent 4px calc(100% - 4px),var(--rope) calc(100% - 4px) calc(100% - 2px),transparent calc(100% - 2px))}
.a-haul .dprop{opacity:1;width:34px;height:12px;margin-left:8px;border-radius:2px;
  background:linear-gradient(180deg,#6B4A2A,#3A2616);box-shadow:0 0 0 1px #1A1109}
.a-haul .dprop::after{content:"";position:absolute;left:4px;top:-9px;width:26px;height:9px;
  background:repeating-linear-gradient(90deg,#8A6438 0 3px,transparent 3px 8px)}
.a-carry .dprop{opacity:1;width:20px;height:16px;margin-left:18px;border-radius:2px;background:linear-gradient(160deg,#8A6440,#4A3020);box-shadow:0 0 0 1px #24160C,0 -16px 0 -2px #6E4E30}
.a-hammer .dprop{opacity:1;width:30px;height:15px;margin-left:-4px;border-radius:2px;background:linear-gradient(180deg,#6E4A2C,#3A2616);
  box-shadow:0 0 0 1px #1A1109,inset 3px 3px 0 -1px var(--brass),inset -3px 3px 0 -1px var(--brass)}
.a-saw .dprop{opacity:1;width:36px;height:13px;margin-left:-6px;background:
  linear-gradient(180deg,var(--oak) 0 4px,transparent 4px),
  linear-gradient(90deg,transparent 3px,#5A4028 3px 6px,transparent 6px calc(100% - 6px),#5A4028 calc(100% - 6px) calc(100% - 3px),transparent calc(100% - 3px))}
.a-swab .dprop{opacity:1;width:14px;height:13px;margin-left:12px;border-radius:2px 2px 4px 4px;background:linear-gradient(90deg,#5A3E24,#7E5A36 50%,#4A321C);box-shadow:inset 0 3px 0 -1px var(--brass),0 0 0 1px #1A1109}
.a-point .dprop,.a-log .dprop{opacity:1;width:30px;height:15px;margin-left:10px;
  background:linear-gradient(180deg,var(--sailcloth) 0 4px,transparent 4px),
  linear-gradient(90deg,transparent 3px,#4A3322 3px 6px,transparent 6px calc(100% - 6px),#4A3322 calc(100% - 6px) calc(100% - 3px),transparent calc(100% - 3px))}
.a-signal .dprop{opacity:1;width:18px;height:13px;margin-left:12px;border-radius:1px;background:linear-gradient(180deg,#5A3E24,#3A2616);
  box-shadow:inset 4px 3px 0 -1px var(--ensign),inset -4px 3px 0 -1px var(--seaglass),0 0 0 1px #1A1109}
.a-coil .dprop{opacity:1;width:24px;height:8px;margin-left:10px;border-radius:50%;
  background:radial-gradient(ellipse,transparent 25%,var(--rope) 28% 42%,#6A5738 44% 55%,var(--rope) 57% 70%,transparent 72%)}
.a-mend .dprop{opacity:1;width:28px;height:9px;margin-left:8px;border-radius:3px;background:linear-gradient(180deg,var(--sailcloth),#C6B894);box-shadow:0 0 0 1px #8C7D5E}

/* ===== the captain: same geometry, dressed for it ===== */
.fig.r-cap{--skin:#E3BD96;--shirt:var(--ensign);--suitD:#7A2620;--trouser:#E2D6BC;--shoe:#15100D;--hat:#1A120D}
.fig.r-cap .torso{--h:38px;--w:34px;bottom:23px;left:29px}
.fig .tails{--w:32px;--h:14px;--d:20px;left:30px;bottom:12px;--c:var(--suitD)}
.fig .sash{left:28px;bottom:37px;width:36px;height:5px;background:linear-gradient(90deg,#8E6A22,var(--brass),#E4C27A);transform:translateZ(11px) rotate(-16deg)}
.fig .buckle{left:41px;bottom:25px;width:10px;height:7px;border-radius:2px;background:linear-gradient(180deg,#E4C27A,#8E6A22);transform:translateZ(11px)}
.fig .epaL,.fig .epaR{--w:11px;--h:5px;--d:12px;--c:var(--brass)}
.fig .epaL{left:20px;bottom:56px}.fig .epaR{left:53px;bottom:56px}
.fig .tricorn{--w:38px;--h:6px;--d:32px;left:23px;bottom:79px;--c:var(--hat)}
.fig .tricrown{--w:24px;--h:10px;--d:22px;left:30px;bottom:82px;--c:var(--hat)}
.fig .tritrim{--w:39px;--h:1.5px;--d:33px;left:22.5px;bottom:84.5px;--c:var(--brass)}
.fig .plume{left:52px;bottom:86px;width:22px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--sailcloth),#B9AD92);
  transform:translateZ(6px) rotate(-16deg);clip-path:polygon(0 40%,70% 0,100% 50%,70% 100%)}
.fig .patch{left:39px;bottom:69px;width:8px;height:7px;border-radius:2px;background:#0D0B0A;transform:translateZ(10px);box-shadow:9px -1px 0 -3px #0D0B0A}
.fig .beard{--w:16px;--h:6px;--d:14px;left:38px;bottom:60px;--c:#3A2F28}
.fig .scabbard{left:24px;bottom:12px;width:5px;height:24px;border-radius:2px;background:linear-gradient(180deg,#2A1D15,#140E0A);
  box-shadow:0 0 0 1px var(--brass);transform:translateZ(11px) rotate(18deg)}
.fig .hilt{left:25px;bottom:34px;width:9px;height:4px;border-radius:2px;background:linear-gradient(90deg,#8E6A22,#E4C27A);transform:translateZ(12px) rotate(18deg)}
.fig .cutlass{left:1px;bottom:-24px;width:5px;height:34px;border-radius:2px;opacity:0;transition:opacity .2s;
  background:linear-gradient(180deg,#EEF2F4,#8A949B);transform:translateZ(6px)}
.fig .cutlass::after{content:"";position:absolute;left:-4px;top:32px;width:13px;height:5px;border-radius:2px;background:linear-gradient(90deg,#8E6A22,#E4C27A)}
.fig.r-cap .armR,.fig.r-cap .armL{transition:transform .32s cubic-bezier(.2,.9,.3,1.3)}
.fig.c-idle .armR{transform:rotate(-14deg)}.fig.c-idle .armL{transform:rotate(-30deg)}
.fig.c-ready .armR{transform:rotate(-62deg)}.fig.c-ready .armL{transform:rotate(-30deg)}
.fig.c-order .armR{transform:rotate(-142deg)}.fig.c-order .armL{transform:rotate(-34deg)}
.fig.c-ready .cutlass,.fig.c-order .cutlass{opacity:1}
.fig.c-ready .hilt,.fig.c-order .hilt{opacity:0}

/* moments: reactions to a state change, never loops */
.fig.react{animation:jolt .55s cubic-bezier(.2,.8,.3,1)!important}
@keyframes jolt{0%{transform:translateY(-10px) scale(1.08)}100%{transform:none}}
.fig.cheer .armL,.fig.cheer .armR{transform:rotate(-150deg)!important;animation:none!important}
.fig.cheer{animation:cheerhop .8s ease-out 2!important}
@keyframes cheerhop{0%,55%,100%{transform:none}30%{transform:translateY(-12px)}72%{transform:translateY(-5px)}}
.fig.salute .armR{transform:rotate(-150deg)!important;animation:none!important;transition:transform .18s ease-out}

/* ===== helm and bell: fittings on the top deck ===== */
.helm,.bell{position:absolute;pointer-events:none;transform:translate(-50%,-100%)}
.helm svg,.bell svg{display:block}
.helm .wheel{transform-box:fill-box;transform-origin:50% 50%}
.helm.live .wheel{animation:correct 2.4s ease-in-out infinite}
@keyframes correct{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.helm.spin .wheel{animation:spin2 1.2s cubic-bezier(.45,0,.25,1)!important}
@keyframes spin2{to{transform:rotate(720deg)}}
.bell .bellbody{transform-box:fill-box;transform-origin:50% 0}
.bell.ring .bellbody{animation:ring 1.8s cubic-bezier(.3,.6,.4,1)}
@keyframes ring{0%{transform:rotate(0)}8%{transform:rotate(22deg)}24%{transform:rotate(-16deg)}42%{transform:rotate(10deg)}62%{transform:rotate(-5deg)}80%{transform:rotate(2deg)}100%{transform:rotate(0)}}

/* ===== name tags: sailcloth pennants, not cards ===== */
.pennants{left:0;top:0;pointer-events:none}
.pennant{position:absolute;--tx:-50%;transform:translate(var(--tx),-100%);pointer-events:auto;cursor:pointer;
  padding:3px 14px 4px 9px;min-width:40px;max-width:var(--pw,150px);text-align:left;
  color:var(--ink);background:
    repeating-linear-gradient(0deg,rgba(90,70,40,.06) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(90,70,40,.05) 0 1px,transparent 1px 3px),var(--sailcloth);
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%);
  box-shadow:inset 0 -3px 0 var(--hem,transparent)}
.pennant::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brass),#7A5A20)}
.pennant .who{display:block;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pennant .job{display:block;font-weight:500;font-size:13px;line-height:1.2;color:#44505A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the run's vendor and model is never cut: the pennant widens to it, and the name and job keep the deck's width */
.pennant.has-eng{max-width:none}
.pennant.has-eng .who,.pennant.has-eng .job{max-width:calc(var(--pw) - 23px)}
.pennant .eng{display:block;font-weight:500;font-size:13px;line-height:1.2;color:#44505A;white-space:nowrap}
.pennant.p-working{--hem:var(--tar)}
.pennant.p-review{--hem:var(--seaglass)}
.pennant.p-gate{--hem:var(--ensign);background:linear-gradient(90deg,transparent calc(100% - 22px),var(--ensign) calc(100% - 22px)),var(--sailcloth)}
.pennant.p-captain{--hem:var(--brass)}
.pennant.p-idle{opacity:.72}
/* the captain stands aftmost, so his pennant flies aft from its staff instead of spreading over the crewman forward of him */
.pennant.p-cap{color:var(--sailcloth);background:var(--ink);--hem:var(--ensign);max-width:210px;--tx:-14px}
.pennant.p-cap .job{color:#B9C3C4}
.pennant.sel{outline:2px solid var(--ink);outline-offset:2px}
.pennant.ping{animation:ping .8s cubic-bezier(.2,.8,.3,1)}
@keyframes ping{0%{transform:translate(var(--tx),-100%) scale(1)}35%{transform:translate(var(--tx),-100%) scale(1.1)}100%{transform:translate(var(--tx),-100%) scale(1)}}
.pennant:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ===== handoffs ===== */
.fx{left:0;top:0;pointer-events:none}
.flyer{position:absolute;left:0;top:0;width:24px;height:14px;margin:-7px 0 0 -12px;will-change:transform;pointer-events:none}
.flyer.k-order{background:linear-gradient(180deg,#F1E8D3,var(--sailcloth) 40%,#BFB08E);border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.flyer.k-order::after{content:"";position:absolute;left:8px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--ensign);box-shadow:inset 0 -1px 0 #6E1E18}
.flyer.k-pr{width:18px;height:15px;margin:-7px 0 0 -9px;border-radius:2px;background:
  linear-gradient(90deg,transparent 7px,#5A4028 7px 9px,transparent 9px),linear-gradient(180deg,transparent 6px,#5A4028 6px 8px,transparent 8px),var(--sailcloth);
  box-shadow:0 1px 2px rgba(0,0,0,.45)}
.flyer.k-approve{background:var(--seaglass);clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%);box-shadow:inset 3px 0 0 var(--brass)}
.flyer.k-reject{background:var(--ensign);clip-path:polygon(0 0,100% 50%,0 100%,22% 50%)}
.trail{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 7}
.trail.k-order{stroke:var(--sailcloth)}.trail.k-pr{stroke:var(--sailcloth)}.trail.k-approve{stroke:var(--seaglass)}.trail.k-reject{stroke:var(--ensign)}
.handnote{position:absolute;transform:translate(-50%,0);padding:2px 8px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--sailcloth);color:var(--ink);box-shadow:inset 3px 0 0 var(--kc,var(--tar))}
/* salvo */
.salvo .flash{opacity:0;transform-box:fill-box;transform-origin:100% 50%}
.salvo .smoke{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.salvo.fire .flash{animation:flash .34s ease-out both}
.salvo.fire .smoke{animation:puff 1.7s cubic-bezier(.15,.6,.3,1) both}
.salvo .smoke{r:18px}
@keyframes flash{0%{opacity:0;transform:scale(.25)}18%{opacity:1;transform:scale(1.35) translateX(-5px)}100%{opacity:0;transform:scale(2) translateX(-18px)}}
@keyframes puff{0%{opacity:0;transform:scale(.3)}16%{opacity:.95;transform:scale(1.1)}100%{opacity:0;transform:scale(3.4) translate(-12px,-14px)}}
.banner{left:3%;top:18px;pointer-events:none;padding:8px 26px 10px 18px;background:var(--sailcloth);color:var(--ink);
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%);box-shadow:inset 4px 0 0 var(--brass);opacity:0}
.banner b{display:block;font-weight:600;font-size:24px;line-height:1.1}
.banner span{display:block;font-size:16px}
.banner.on{animation:unfurl 3s cubic-bezier(.2,.8,.3,1) both}
@keyframes unfurl{0%{opacity:1;clip-path:polygon(0 0,0 0,0 50%,0 100%,0 100%)}
  16%{clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%)}85%{opacity:1}100%{opacity:0;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%)}}

/* ===== the caption: what just happened, in words ===== */
.caption{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;padding:12px 24px;min-height:48px;font-size:16px;border-bottom:1px solid var(--pgLine)}
.caption .selinfo{color:var(--pgText2)}

/* ===== prototype switches (not part of the board) ===== */
.switches{padding:14px 24px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,600px),1fr));gap:4px 40px}
.switches h2{grid-column:1/-1;margin:6px 0 8px;font-size:16px;font-weight:600}
.switches h2 span{font-weight:400;color:var(--pgText2);margin-left:10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.row>label,.row>.lab{flex:0 0 118px;font-size:16px;color:var(--pgText2)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{min-height:40px;padding:6px 12px;font-size:16px;border-radius:3px;background:var(--pg2);color:var(--pgText);
  box-shadow:inset 0 0 0 1px var(--pgLine)}
.seg button[aria-pressed=true]{background:var(--pgText);color:var(--pg);box-shadow:none}
.seg button kbd,.btn kbd{font:500 13px var(--sans);color:inherit;opacity:.7;margin-left:6px}
select{font:inherit;min-height:40px;padding:4px 8px;border-radius:3px;background:var(--pg2);color:var(--pgText);border:1px solid var(--pgLine)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.meter{grid-column:1/-1;font-size:13px;color:var(--pgText2);padding-top:6px}
.switches{margin-top:10px;border-top:2px solid var(--pgLine)}

/* ===== still: reduced motion or the motion switch off. the scene holds a key pose ===== */
.still .fig,.still .fig *,.still .helm .wheel,.still .jolly,.still .bell .bellbody{animation:none!important}
.still .pivot,.still .fig .armL,.still .fig .armR,.still .cutlass,.still .pennant,.still .jolly{transition:none!important}
.still .salvo.fire .flash{animation:none;opacity:0}
.still .salvo.fire .smoke{animation:none;opacity:.6;transform:scale(1.4)}
.still .banner.on{animation:none;opacity:1}
.still .scene,.still body{transition:none}
/* a hidden tab keeps its place and costs nothing */
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
@media (max-width:700px){.top,.stats,.caption,.switches{padding-left:14px;padding-right:14px}.row>label,.row>.lab{flex-basis:100%}}
</style>

  <button class="btn2 rostbar" id="rosterBtn" aria-controls="roster" aria-pressed="true"></button></div>

  <!-- where the captain sets work aside: both are drop targets, and a card's menu reaches the same two actions -->
  <div class="setaside">

<script>
'use strict';
/* =====================================================================
   0. small tools
   ===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
function seeded(seed) { let s = (seed >>> 0) || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
const f1 = n => (Math.round(n * 10) / 10);
const bez3 = (p0, p1, p2, p3, t) => { const u = 1 - t; return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3; };

/* =====================================================================
   1. the motion engine: easing, springs, tweens, one frame loop
   ===================================================================== */
const Ease = (() => {
  function cubicBezier(x1, y1, x2, y2) {
    const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = a => 3 * a;
    const at = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
    const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (at(t, x1, x2) - x) / s; }
      return at(clamp(t, 0, 1), y1, y2);
    };
  }
  return {
    cubicBezier,
    linear: x => x,
    inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
    outCubic: x => 1 - Math.pow(1 - x, 3),
    inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    order: cubicBezier(.3, 0, .2, 1),
    approve: cubicBezier(.2, .7, .2, 1),
    reject: cubicBezier(.6, 0, .4, 1),
  };
})();

class Spring {
  // a damped spring on one number; k stiffness, c damping (critical is 2*sqrt(k))
  constructor(v, k = 12, c = 6.9) { this.v = v; this.target = v; this.vel = 0; this.k = k; this.c = c; }
  to(t) { this.target = t; }
  snap(t) { this.v = this.target = t; this.vel = 0; }
  kick(dv) { this.vel += dv; }
  step(dt) { const a = -this.k * (this.v - this.target) - this.c * this.vel; this.vel += a * dt; this.v += this.vel * dt; }
  get settled() { return Math.abs(this.v - this.target) < 1e-3 && Math.abs(this.vel) < 1e-3; }
}

const Engine = {
  springs: [], tweens: [], onUpdate: null, onRender: null,
  raf: 0, last: 0, running: false, gates: { motion: true, visible: true, onscreen: true },
  stats: { frames: 0, scriptMs: 0, since: 0, fps: 0, ms: 0, vessel: 0, vps: 0 },
  spring(v, k, c) { const s = new Spring(v, k, c); this.springs.push(s); return s; },
  tween(dur, ease, fn, done) { const t = { t: 0, dur, ease, fn, done }; this.tweens.push(t); this.wake(); return t; },
  busy() { return this.tweens.length > 0 || this.springs.some(s => !s.settled) || (this.extraBusy && this.extraBusy()); },
  allowed() { const g = this.gates; return g.motion && g.visible && g.onscreen; },
  wake() { if (!this.raf && this.allowed()) { this.last = 0; this.raf = requestAnimationFrame(ts => this.frame(ts)); } },
  halt() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },
  // motion switched off mid-moment: every tween lands at its end state at once, nothing is left mid-air
  flush() { const ts = this.tweens.splice(0); for (const tw of ts) { tw.fn(tw.ease(1), 1); tw.done && tw.done(); } this.tweens.splice(0).forEach(tw => { tw.fn(1, 1); tw.done && tw.done(); }); },
  frame(ts) {
    this.raf = 0;
    if (!this.allowed()) return;
    // a calm sea holds 20 frames a second, a sea under way 30; a moment in progress gets the full rate
    const minGap = this.busy() ? 0 : 1000 / (this.idleFps ? this.idleFps() : 30) - 2;
    if (this.last && ts - this.last < minGap) { this.raf = requestAnimationFrame(t => this.frame(t)); return; }
    const dt = this.last ? Math.min(0.05, (ts - this.last) / 1000) : 1 / 60;
    this.last = ts;
    const t0 = performance.now();
    // fixed substeps keep the springs stable at any frame rate
    let rem = dt; while (rem > 1e-6) { const h = Math.min(rem, 1 / 120); for (const s of this.springs) s.step(h); rem -= h; }
    for (let i = this.tweens.length - 1; i >= 0; i--) {

function fitDiagrams(root = document) {
  const bad = [];
  root.querySelectorAll('.dg svg').forEach(svg => {
    if (!svg.getBoundingClientRect().width) return;
    const vbW = svg.viewBox.baseVal.width + svg.viewBox.baseVal.x;
    const boxes = [...svg.querySelectorAll('rect.box')].map(r => r.getBBox());
    svg.querySelectorAll('text').forEach(t => {
      const b = t.getBBox(), cy = b.y + b.height / 2;
      const box = boxes.find(r => b.x >= r.x && b.x < r.x + r.width && cy >= r.y && cy <= r.y + r.height);
      // a label keeps 4 units clear of its box's right edge, and 6 clear of the next label on its line
      const limit = box ? box.x + box.width - 4 : vbW;
      const next = [...svg.querySelectorAll('text')].find(o => o !== t && Math.abs(o.getBBox().y - b.y) < 2 && o.getBBox().x > b.x);
      const end = Math.min(limit, next ? next.getBBox().x - 6 : Infinity);
      if (b.x + b.width > end + .5) bad.push({ text: t.textContent, over: +(b.x + b.width - end).toFixed(1) });
    });
  });
  if (bad.length) console.warn('diagram labels past their box:', bad);
  return bad;
}

  const gates = d.kind === 'merge' ? '<ul class="gates">' + GATE_KEYS.map((n, i) => '<li class="' + (d.gates[i] ? 'y' : 'n') + '"><i aria-hidden="true">' + (d.gates[i] ? '&#10003;' : '&#8211;') + '</i>' + n + '. ' + esc(tr('gate' + n)) + '</li>').join('') + '</ul>' : '';
  return '<div class="dcard sheet" id="card-' + d.id + '"><div class="meta">' + esc(tr('metaFor', { id: d.id, task: d.task })) + '</div>'
    + '<h3>' + esc(L(c.title)) + '</h3>' + links
    + '<div class="dbody"><div><p class="explanation">' + esc(L(c.explanation)) + '</p>'
    + '<figure class="dg"><div class="scroll">' + diagramSVG(d) + '</div><figcaption>' + esc(tr('diagramBy', { id: d.id })) + '</figcaption></figure>' + gates + '</div>'
    + '<div>' + opts + custom + '<div class="acts"><span class="validation" id="validation-' + d.id + '"></span><button class="go confirm" data-id="' + d.id + '" disabled>' + esc(tr('confirmOrder')) + '</button></div></div></div></div>';
}
function portraitHTML() {
  faceSet = FACES_CAP;
  return '<div class="porthole"><div class="glass"><div class="ppivot" style="--sc:1.22;--rx:4deg;--ry:22deg"><div class="fig r-cap c-' + S.cap + '">'
    + '<div class="sh"></div>' + bx('armR', bx('handR', '<span class="cutlass"></span>')) + bx('shoeR') + bx('shoeL') + bx('legR') + bx('legL')
    + bx('tails') + bx('torso') + '<div class="sash"></div><div class="buckle"></div><div class="scabbard"></div><div class="hilt"></div>'
    + bx('epaL') + bx('epaR') + bx('armL', bx('handL')) + bx('neck') + bx('head') + '<div class="eye"></div><div class="patch"></div>' + bx('beard')
    + bx('tricorn') + bx('tricrown') + bx('tritrim') + '<div class="plume"></div></div></div></div></div>'
    + '<div class="lbl"><b>' + esc(tr('roleCaptain')) + '</b><span></span></div>';
}
function renderDeck() {
  const pend = pendingDecisions(), ids = new Set(pend.map(d => d.id));
  for (const m of [UI.picks, UI.drafts]) for (const id of [...m.keys()]) if (!ids.has(id)) m.delete(id);
  for (const id of [...UI.expanded]) if (!ids.has(id)) UI.expanded.delete(id);
  const wrap = $('#deckwrap');
  wrap.hidden = !pend.length && !UI.orderFb;
  $('#pcount').textContent = pend.length || '';
  // keep the captain's focus and caret through a re-render
  const f = document.activeElement, fId = f && f.dataset && f.dataset.id, fC = f && f.dataset && f.dataset.c, sel = f && f.tagName === 'TEXTAREA' ? [f.selectionStart, f.selectionEnd] : null;
  $('#deck').innerHTML = pend.map((d, i) => {
    if (i === 0) return fullCard(d) + (pend.length > 1 ? '<p class="also">' + esc(tr('alsoWaiting')) + '</p>' : '');
    const c = S.lang === 'en' ? d.details.en : d.details['zh-TW'], pick = UI.picks.get(d.id);
    return '<details class="dstrip sheet" data-id="' + d.id + '"' + (UI.expanded.has(d.id) ? ' open' : '') + '><summary><span class="meta">' + esc(tr('metaFor', { id: d.id, task: d.task })) + '</span>'
      + '<span class="st">' + esc(S.lang === 'zh-CN' ? cn(c.title) : c.title) + '</span>' + (pick ? '<span class="picked">' + esc(pick === 'custom' ? tr('customChoice') : pick) + '</span>' : '') + '</summary>' + fullCard(d) + '</details>';
  }).join('');
  const stage = $('#capstage'); stage.hidden = !pend.length;
  if (pend.length && !stage.firstChild) stage.innerHTML = portraitHTML();
  if (stage.firstChild) stage.querySelector('.lbl b').textContent = tr('roleCaptain');
  $('#deck').querySelectorAll('details.dstrip').forEach(el => el.addEventListener('toggle', () => { if (el.open) UI.expanded.add(el.dataset.id); else UI.expanded.delete(el.dataset.id); }));
  pend.forEach(d => validate(d.id));
  if (fId) {
    const r = [...$('#deck').querySelectorAll('[data-id]')].find(el => el.dataset.id === fId && el.tagName === f.tagName && (fC ? el.dataset.c === fC : !el.dataset.c));
    if (r) { r.focus({ preventScroll: true }); if (sel) r.setSelectionRange(...sel); }
  }
  // the captain's pose follows the deck: ready once a choice is picked, idle when nothing is
  const p = deckPose();
  if (p !== UI.lastDeckPose) { UI.lastDeckPose = p; if (S.cap !== p) setCapPose(p); }
  showCapPose(S.cap);
  $('#orderFeedback').textContent = UI.orderFb ? tr(UI.orderFb[0], UI.orderFb[1]) : '';
  fitDiagrams($('#deck'));
}
function validate(id) {
  const chosen = UI.picks.get(id), text = UI.drafts.get(id) || '';
  const ok = !!chosen && (chosen !== 'custom' || (text.trim().length > 0 && [...text].length <= 1000));
  document.querySelectorAll('.confirm[data-id="' + id + '"]').forEach(b => { b.disabled = !ok; });
  document.querySelectorAll('#validation-' + id).forEach(l => { l.textContent = chosen === 'custom' && !ok ? tr('customInvalid') : ''; });
  return ok;
}
function answer(id) {
  if (BOARD.answered.has(id) || !validate(id)) return;
  const d = FIX_DECISIONS.find(x => x.id === id), chosen = UI.picks.get(id), t = taskOf(d.task);
  UI.picks.delete(id); UI.drafts.delete(id);
  BOARD.answered.add(id);
  logEvent('captain', 'answered', { en: id + ': ' + (chosen === 'custom' ? 'your own answer' : 'option ' + chosen), 'zh-TW': id + '：' + (chosen === 'custom' ? '自訂回覆' : '選項 ' + chosen) });
  if (d.kind === 'merge' && chosen === 'A') {
    UI.orderFb = ['mergedFb', { task: d.task }];
    merge({ t, d });
    return;
  }
  // any other answer is an order: the call leaves the deck and its task returns to the plan (a hold parks it).
  // nothing is dispatched; the firstmate acts on the order in the live system
  if (d.kind === 'merge' && chosen === 'C') t.stage = 'parked';
  UI.orderFb = chosen === 'custom' ? ['customRecorded', { id }] : ['recorded', { id, c: chosen }];
  S.cap = UI.picks.size ? 'ready' : 'idle'; UI.lastDeckPose = null;
  syncShip();
  giveOrder();
  narrate('Order given on ' + id + ': bell and whistle, the helm spins twice, all hands answer.');
}
function selectLang(l) { S.lang = l; renderChrome(); renderBoard(); }
function renderBoard() {
  renderCounts();
  renderDeck();
  flip(renderLanes);
  renderRoster();
  renderLog();
}

// ---- the board's interactions: menu, drag and drop, the drop confirmation, the deck ----
$('#langs').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) selectLang(b.dataset.lang); });
$('#rosterBtn').addEventListener('click', () => { UI.rosterOn = !UI.rosterOn; renderChrome(); renderRoster(); });
$('#deck').addEventListener('click', e => {
  const o = e.target.closest('.opt'), c = e.target.closest('.confirm'), a = e.target.closest('[data-open]');
  if (a) { e.preventDefault(); narrate('On the live board this opens ' + a.dataset.open + ' in your editor.'); return; }
  if (o && !o.disabled) { UI.picks.set(o.dataset.id, o.dataset.c); renderDeck(); if (o.dataset.c === 'custom') document.querySelector('textarea[data-id="' + o.dataset.id + '"]')?.focus(); }
  else if (c && !c.disabled) answer(c.dataset.id);
});
$('#deck').addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') { UI.drafts.set(e.target.dataset.id, e.target.value); validate(e.target.dataset.id); } });
const fleet = $('#fleet');
function askDrop(id) { UI.menu = null; UI.confirming = id; renderBoard(); document.querySelector('[data-confirm-drop]')?.focus(); }
fleet.addEventListener('click', e => {
  const el = e.target.closest('[data-menu],[data-act],[data-confirm-drop],[data-cancel-drop]');
  if (!el) return;
  if (el.dataset.menu) {
    const id = el.dataset.menu; UI.menu = UI.menu === id ? null : id; renderBoard();
    if (UI.menu) document.querySelector('.cacts [data-for="' + id + '"]')?.focus();
    else document.querySelector('[data-menu="' + id + '"]')?.focus();
  } else if (el.dataset.act) { if (el.dataset.act === 'drop') askDrop(el.dataset.for); else taskAct(el.dataset.for, el.dataset.act); }
  else if (el.dataset.confirmDrop) taskAct(el.dataset.confirmDrop, 'drop');
  else if (el.dataset.cancelDrop) { const id = el.dataset.cancelDrop; UI.confirming = null; renderBoard(); document.querySelector('[data-menu="' + id + '"]')?.focus(); }
});
fleet.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !(UI.menu || UI.confirming)) return;
  const id = UI.menu || UI.confirming; UI.menu = null; UI.confirming = null; renderBoard();
  document.querySelector('[data-menu="' + id + '"]')?.focus(); e.stopPropagation();
});
fleet.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.card[draggable="true"]'); if (!card) return;
  UI.dragging = card.dataset.task; e.dataTransfer.setData('text/plain', UI.dragging); e.dataTransfer.effectAllowed = 'move';
  fleet.classList.add('dragging'); requestAnimationFrame(() => card.classList.add('lifted'));
});
fleet.addEventListener('dragend', () => { UI.dragging = null; fleet.classList.remove('dragging'); fleet.querySelectorAll('.over,.lifted').forEach(el => el.classList.remove('over', 'lifted')); });
// a zone takes a card only when that card offers the zone's action
const zoneFor = e => { const z = e.target.closest && e.target.closest('[data-zone]'); return z && UI.dragging && actionsFor(laneOf(taskOf(UI.dragging))).includes(z.dataset.zone) ? z : null; };
fleet.addEventListener('dragover', e => { const z = zoneFor(e); if (!z) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; z.classList.add('over'); });
fleet.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-zone]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
fleet.addEventListener('drop', e => {
  const z = zoneFor(e); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const id = UI.dragging; UI.dragging = null; fleet.classList.remove('dragging');
  if (z.dataset.zone === 'drop') askDrop(id); else taskAct(id, z.dataset.zone);
});

/* =====================================================================
   13. putting it together
   ===================================================================== */
function rebuild() {
  CREW = buildCrew();
  assignStates();
  // the crew's spacing does not depend on the mast height, so lay them out once to learn the tallest pennant
  G = geometry(); layoutCrew(); G = geometry(pennantLines());
  $('#scene').style.height = G.H + 'px';
  applyTime();
  buildSea();
  buildShip();
  buildCrewDOM();
  applyWeather(!S.motion);
  staticWake();
  renderStats();
  renderSwitches();
  if (!S.motion) renderStatic(); else render();
  showSel();
}
function restate() {
  // a state change: crew classes change in place, the weather eases to what the state now says
  assignStates();
  buildCrewDOM();
  const wx = applyWeather();
  staticWake();
  renderStats(); renderSwitches(); showSel();
  const g = CREW.find(c => c.st === 'gate'), np = pendingDecisions().length;
  narrate(wx === 'squall' ? 'Squall: ' + [g ? g.id + ' is blocked at gate 5 on ' + g.task[0] : '', np ? np + (np === 1 ? ' call waits' : ' calls wait') + ' on you' : ''].filter(Boolean).join(', and ') + '.'
    : wx === 'clearing' ? 'Clearing: the merge still holds the sea at a breeze under a clear sky.'
    : wx === 'calm' ? 'Calm: no work in flight. The ship rides at her mark, sails slack.'
    : 'Breeze: ' + liveRuns() + ' live ' + (liveRuns() === 1 ? 'run' : 'runs') + '. Wind and way scale with the runs.');
}
function setMotion(on, source) {
  S.motion = on; S.motionSource = source;
  document.documentElement.classList.toggle('still', !on);
  Engine.gates.motion = on;
  if (on) { Engine.wake(); } else { Engine.halt(); Engine.flush(); renderStatic(); }
  renderSwitches();
}
function act(k, v) {
  if (k === 'tod') { S.tod = v; applyTime(); buildSea(); buildShip(); buildCrewDOM(); staticWake(); tick(); renderSwitches(); narrate(TOD[todNow()].label + ': the key light moves to the ' + (TOD[todNow()].sun.moon ? 'moon' : 'sun') + '.'); }
  else if (k === 'weather') {
    if (v === 'clearing') { merge(); return; }
    // a new scenario starts its runs afresh; a squall brings its calls back unless their task has moved on
    if (v !== S.weather) { BOARD.handed.clear(); if (v === 'squall') BOARD.answered.clear(); }
    S.weather = v; restate();
  }
  else if (k === 'runs') { S.runs = +v; BOARD.handed.clear(); if (S.weather === 'calm') S.weather = 'breeze'; restate(); }
  else if (k === 'rate') { const r = RATES[+v - 1]; S.crew = r.max; rebuild(); narrate(r.name + ': ' + G.nm + (G.nm === 1 ? ' mast, ' : ' masts, ') + r.decks + (r.decks === 1 ? ' deck, ' : ' decks, ') + G.guns.length + ' guns, ' + S.crew + ' aboard.'); }
  else if (k === 'crew') { S.crew = clamp(S.crew + +v, 1, 24); rebuild(); }
  else if (k === 'action') { S.action = v; restate(); narrate(v === 'assigned' ? 'Actions as assigned by deck and state.' : 'Everyone ' + ACTIONS[v] + '.'); }
  else if (k === 'cap') { setCapPose(v); narrate('Captain: ' + CAP_POSE[v] + '.'); }
  else if (k === 'hand') handoff(v);
  else if (k === 'merge') merge();
  else if (k === 'order') { giveOrder(); narrate('Order given: bell and whistle, the helm spins twice, all hands answer.'); }
  else if (k === 'motion') setMotion(v === 'on', 'switch');
  else if (k === 'sound') { S.sound = v === 'on'; renderSwitches(); }
  else if (k === 'pr') openPR();
  else if (k === 'newtask') newTask();
  else if (k === 'reset') { resetBoard(); UI.menu = UI.confirming = UI.feedback = UI.orderFb = null; UI.picks.clear(); UI.drafts.clear(); restate(); narrate('The board is back to its opening fixture.'); }
}
$('#switches').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) act(b.dataset.k, b.dataset.v); });
$('#switches').addEventListener('change', e => { if (e.target.dataset.k === 'action') act('action', e.target.value); });

const cycle = (arr, cur) => arr[(arr.indexOf(cur) + 1) % arr.length];
addEventListener('keydown', e => {
  // a switch key never fires while the captain types, or while focus is in a card's action menu or the drop confirmation
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.target.closest && e.target.closest('[role="menu"],[role="alertdialog"]')) return;
  const k = e.key;
  const map = {
    t: () => act('tod', cycle(['local', 'dawn', 'day', 'dusk', 'night'], S.tod)),
    w: () => act('weather', cycle(['calm', 'breeze', 'squall'], S.weather)),
    m: () => act('merge'), o: () => act('order'),
    l: () => act('runs', S.runs % 3 + 1),
    '[': () => act('crew', -1), ']': () => act('crew', 1), '-': () => act('crew', -1), '=': () => act('crew', 1), '+': () => act('crew', 1),
    a: () => act('action', cycle(['assigned', ...Object.keys(ACTIONS).filter(a => a !== 'helm')], S.action)),
    c: () => act('cap', cycle(['idle', 'ready', 'order'], S.cap)),
    q: () => act('hand', 'order'), p: () => act('hand', 'pr'), y: () => act('hand', 'approve'), x: () => act('hand', 'reject'),
    r: () => act('motion', S.motion ? 'off' : 'on'), s: () => act('sound', S.sound ? 'off' : 'on'),
    u: () => act('pr'), n: () => act('newtask'),
  };
  if (/^[1-6]$/.test(k)) { act('rate', k); e.preventDefault(); return; }
  const fn = map[k.toLowerCase()]; if (fn) { fn(); e.preventDefault(); }
});

/* drag a figure to turn it, drag the deck to turn all hands, double-click to reset; a click selects */
let drag = null;
$('#scene').addEventListener('pointerdown', e => {
  const pv = e.target.closest('.pivot'), deck = e.target.closest('.deckhit');
  if (!pv && !deck) return;
  const ids = pv ? [pv.dataset.pivot] : [...document.querySelectorAll('.pivot')].map(p => p.dataset.pivot);
  drag = { x: e.clientX, y: e.clientY, ids, moved: false, pid: e.pointerId, src: pv, base: Object.fromEntries(ids.map(i => [i, { ...(ROT[i] || (i === 'captain' ? CAPDEF : DEF)) }])) };
  (pv || e.target).setPointerCapture && (pv || e.target).setPointerCapture(e.pointerId);
  e.preventDefault();
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; drag.ids.forEach(i => { const p = document.querySelector('.pivot[data-pivot="' + i + '"]'); if (p) { p.classList.add('dragging'); fullFaces(p); } }); }
  for (const i of drag.ids) { const b = drag.base[i]; ROT[i] = { ry: b.ry + dx * .6, rx: clamp(b.rx - dy * .35, -12, 38) }; }
  applyRot();
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.ids.forEach(i => document.querySelector('.pivot[data-pivot="' + i + '"]')?.classList.remove('dragging'));
  if (!drag.moved && drag.src) select(drag.src.dataset.pivot);
  drag = null;
});
$('#scene').addEventListener('dblclick', e => {
  const pv = e.target.closest('.pivot');
  if (pv) delete ROT[pv.dataset.pivot]; else if (e.target.closest('.deckhit')) for (const k in ROT) delete ROT[k];
  applyRot();
});
$('#pennants').addEventListener('click', e => { const b = e.target.closest('.pennant'); if (b) select(b.dataset.tag); });
function select(id) {
  S.selected = S.selected === id ? null : id;
  document.querySelectorAll('.pennant').forEach(p => p.classList.toggle('sel', p.dataset.tag === S.selected));
  showSel();
}

/* a hidden tab, an off-screen scene or reduced motion stops the loop; CSS loops pause with it */
document.addEventListener('visibilitychange', () => {
  Engine.gates.visible = !document.hidden;
  document.documentElement.classList.toggle('paused', document.hidden);
  if (document.hidden) Engine.halt(); else Engine.wake();
  showMeter();
});
new IntersectionObserver(es => { for (const en of es) { Engine.gates.onscreen = en.isIntersecting; document.documentElement.classList.toggle('paused', !en.isIntersecting || document.hidden); en.isIntersecting ? Engine.wake() : Engine.halt(); } showMeter(); }).observe($('#scene'));
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => { if (S.motionSource === 'system') setMotion(!e.matches, 'system'); });
let rsT = 0, lastW = 0;
new ResizeObserver(() => { const w = $('#scene').clientWidth; if (Math.abs(w - lastW) < 2) return; lastW = w; clearTimeout(rsT); rsT = setTimeout(rebuild, 120); }).observe($('#scene'));

initSprings();
document.documentElement.classList.toggle('still', !S.motion);
Engine.gates.motion = S.motion;
resetBoard();
renderChrome();
rebuild();
restate();
UI.booted = true;
tick(); setInterval(tick, 30000);
Engine.wake();
</script>
