name: ci
# Runs the very same bin/ci.sh the local gate runs, split by --stage and
# --shard into jobs that run in parallel: the fast checks, the bash suites
# sharded across N jobs, the bun tests, and the browser tests. Do not add a
# step here that is not in that script, or the two will disagree about what
# green means. One group of jobs is not a piece of that script: fail-first
# runs bin/fm-failfirst.sh on a pull request (T-153), which is gate 4's
# question asked by the machine, not a stage of the check - sharded like the
# bash suites, and merged by the `fail-first` job (T-158). The final `ci` job is the one required status check; it
# needs every other job and fails if any of them failed or was skipped, so
# branch protection and gate 5 read the same thing they always did (T-134).
# The ci job also checks that every suite ran exactly once.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

env:
  FM_CI_MAX_SECONDS: "600"

jobs:
  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: bin/ci.sh --stage fast
        run: bash bin/ci.sh --stage fast

  bash-timings:
    name: bash timings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timings: ${{ steps.timings.outputs.timings }}
    steps:
      # One best-effort read for all bash shards: none read is a split by size.
      - name: previous suite timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/timings
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -p 'suite-timings-*' -D /tmp/timings 2>/dev/null || true
          fi
          find /tmp/timings -name 'suite-timings-*.txt' -exec cat {} + > /tmp/timings.txt 2>/dev/null || true
          { echo 'timings<<FM_TIMINGS_END'; grep -v '^FM_TIMINGS_END$' /tmp/timings.txt || true; echo 'FM_TIMINGS_END'; } >> "$GITHUB_OUTPUT"

  bash:
    name: bash suites (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [bash-timings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: read-only bubblewrap runner diagnostics
        run: |
          set +e
          printf 'Diagnostic only; existing mandatory suites still decide CI.\n'
          printf 'ImageOS=%s ImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          cat /etc/os-release
          command -v bwrap
          bwrap --version
          dpkg-query -W bubblewrap
          stat -c '%n owner=%U:%G mode=%a' /usr/bin/bwrap
          for file in /proc/self/attr/current /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces; do
            printf 'Read %s\n' "$file"
            cat "$file" 2>&1
            printf 'read_exit=%s\n' "$?"
          done
          sed -n '/^Uid:/p; /^Gid:/p; /^Cap/p; /^NoNewPrivs:/p; /^Seccomp/p' /proc/self/status
          if [ -r /sys/kernel/security/apparmor/profiles ]; then
            grep -i bwrap /sys/kernel/security/apparmor/profiles
          fi
          for file in /etc/apparmor.d/bwrap /etc/apparmor.d/usr.bin.bwrap; do
            if [ -r "$file" ]; then printf 'Read profile %s\n' "$file"; cat "$file"; fi
          done
          printf 'Minimal network namespace, stock-style automatic user namespace\n'
          timeout 10s /usr/bin/bwrap --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          printf 'minimal_stock_style_exit=%s\n' "$?"
          printf 'Diagnostic comparison only: explicit isolated user namespace\n'
          timeout 10s /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          printf 'minimal_explicit_user_exit=%s\n' "$?"
          exit 0
      - name: "bin/ci.sh --stage bash --shard ${{ matrix.shard }}/6"
        env:
          FM_BASH_TIMINGS: ${{ needs.bash-timings.outputs.timings }}
          FM_CI_ASSIGNED_OUT: /tmp/suite-assigned/suite-assigned-${{ matrix.shard }}.txt
          FM_CI_TIMINGS_IN: /tmp/timings.txt
          FM_CI_TIMINGS_OUT: /tmp/suite-timings-${{ matrix.shard }}.txt
        run: |
          # Captain-approved T-264 v5 temporary bwrap-only attachment.
          set -euo pipefail
          fm_logs="$RUNNER_TEMP/firstmate-bwrap-control"
          mkdir -p "$fm_logs"
          fm_profile=/etc/apparmor.d/firstmate-ci-bwrap
          fm_hash=9282ddad7c69ba6ac8261ac95f8aa8708695c44da42dca19c53a705a29a98c78
          fm_owned=0
          fm_parser=/sbin/apparmor_parser
          [ -x "$fm_parser" ] || { echo 'ASK:T-264 missing AppArmor parser' >&2; exit 1; }
          [ "$(id -u)" != 0 ]
          grep -qx 'VERSION_ID="24.04"' /etc/os-release
          [ "$(stat -c '%u:%g:%a' /usr/bin/bwrap)" = 0:0:755 ]
          timeout 10s dpkg-query -W bubblewrap apparmor
          timeout 10s "$fm_parser" --version
          stat -c '%n owner=%U:%G mode=%a' "$fm_parser" /usr/bin/bwrap
          fm_max="$(cat /proc/sys/user/max_user_namespaces)"
          fm_globals() {
            local clone restrict maximum
            clone="$(cat /proc/sys/kernel/unprivileged_userns_clone)"
            restrict="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
            maximum="$(cat /proc/sys/user/max_user_namespaces)"
            printf 'globals clone=%s restrict=%s max=%s\n' "$clone" "$restrict" "$maximum"
            [ "$clone" = 1 ] && [ "$restrict" = 1 ] && [ "$maximum" = "$fm_max" ] &&
            [ "$(stat -c '%u:%g:%a' /usr/bin/bwrap)" = 0:0:755 ]
          }
          fm_compare() {
            local phase="$1" expected="$2" form rc bad=0
            for form in automatic explicit; do
              local args=()
              if [ "$form" = explicit ]; then args+=(--unshare-user); fi
              if timeout 10s /usr/bin/bwrap "${args[@]}" --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true > "$fm_logs/$phase-$form.stdout" 2> "$fm_logs/$phase-$form.stderr"; then rc=0; else rc=$?; fi
              printf '%s\n' "$rc" > "$fm_logs/$phase-$form.status"
              cat "$fm_logs/$phase-$form.stdout" "$fm_logs/$phase-$form.stderr"
              printf '%s %s exit=%s\n' "$phase" "$form" "$rc"
              if [ "$expected" = failure ]; then
                [ "$rc" = 1 ] && grep -q 'RTM_NEWADDR' "$fm_logs/$phase-$form.stderr" || bad=1
              else
                [ "$rc" = 0 ] || bad=1
              fi
            done
            [ "$bad" = 0 ]
          }
          fm_cleanup() {
            local result=$? cleanup_bad=0 remove_rc
            trap - EXIT
            set +e
            if [ "$fm_owned" = 1 ]; then
              if [ -f "$fm_profile" ] && [ ! -L "$fm_profile" ] && [ "$(sha256sum "$fm_profile" | cut -d ' ' -f 1)" = "$fm_hash" ]; then
                timeout 10s sudo "$fm_parser" -R "$fm_profile" > "$fm_logs/remove.stdout" 2> "$fm_logs/remove.stderr"
                remove_rc=$?
                printf '%s\n' "$remove_rc" > "$fm_logs/remove.status"
                cat "$fm_logs/remove.stdout" "$fm_logs/remove.stderr"
                [ "$remove_rc" = 0 ] || cleanup_bad=1
                sudo rm -- /etc/apparmor.d/firstmate-ci-bwrap || cleanup_bad=1
              else
                echo 'ASK:T-264 owned profile integrity changed; refusing unrelated removal' >&2
                cleanup_bad=1
              fi
              fm_globals || cleanup_bad=1
              fm_compare rollback failure || cleanup_bad=1
              timeout 10s cat /sys/kernel/security/apparmor/profiles > "$fm_logs/profiles-rollback.txt" || cleanup_bad=1
              if grep -q 'firstmate_ci_.*bwrap' "$fm_logs/profiles-rollback.txt"; then cleanup_bad=1; fi
            fi
            if [ "$cleanup_bad" != 0 ]; then echo 'ASK:T-264 profile cleanup/rollback refused' >&2; result=1; fi
            exit "$result"
          }
          trap fm_cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          fm_globals
          timeout 10s cat /sys/kernel/security/apparmor/profiles > "$fm_logs/profiles-before.txt"
          cat "$fm_logs/profiles-before.txt"
          [ ! -e "$fm_profile" ] && [ ! -L "$fm_profile" ]
          if grep -qi bwrap "$fm_logs/profiles-before.txt"; then
            echo 'ASK:T-264 existing bwrap profile requires approved takeover' >&2; exit 1
          fi
          # Bounded read-only kernel attachment inventory; no host private-root enumeration.
          timeout 10s python3 - <<'FM_ATTACHMENTS'
          from pathlib import Path
          from fnmatch import fnmatchcase
          root=Path('/sys/kernel/security/apparmor/policy/profiles')
          entries=list(root.iterdir())
          if len(entries)>4096: raise SystemExit('ASK:T-264 policy inventory exceeds bound')
          for entry in entries:
              with (entry/'attach').open('rb') as stream: attachment=stream.read(4097)
              if len(attachment)>4096: raise SystemExit('ASK:T-264 attachment exceeds bound')
              if fnmatchcase('/usr/bin/bwrap', attachment.strip().decode('utf-8')):
                  raise SystemExit('ASK:T-264 conflicting bwrap attachment')
          FM_ATTACHMENTS
          fm_compare before failure
          cat > "$fm_logs/profile" <<'FM_PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile firstmate_ci_bwrap /usr/bin/bwrap flags=(attach_disconnected) {
            allow capability,
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,
            allow px /** -> firstmate_ci_bwrap//&firstmate_ci_unpriv_bwrap,
          }
          profile firstmate_ci_unpriv_bwrap flags=(attach_disconnected) {
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,
            allow pix /** -> &firstmate_ci_unpriv_bwrap,
            audit deny capability,
          }
          FM_PROFILE
          [ "$(sha256sum "$fm_logs/profile" | cut -d ' ' -f 1)" = "$fm_hash" ]
          if timeout 10s "$fm_parser" -Q "$fm_logs/profile" > "$fm_logs/parse.stdout" 2> "$fm_logs/parse.stderr"; then fm_parse_rc=0; else fm_parse_rc=$?; fi
          printf '%s\n' "$fm_parse_rc" > "$fm_logs/parse.status"
          cat "$fm_logs/parse.stdout" "$fm_logs/parse.stderr"
          [ "$fm_parse_rc" = 0 ]
          # Fixed exclusive creation, never overwrite existing host policy.
          sudo /bin/bash -c 'set -eC; exec 3> /etc/apparmor.d/firstmate-ci-bwrap; trap "rm -- /etc/apparmor.d/firstmate-ci-bwrap" EXIT; cat >&3; trap - EXIT' < "$fm_logs/profile"
          fm_owned=1
          [ "$(sha256sum "$fm_profile" | cut -d ' ' -f 1)" = "$fm_hash" ]
          if timeout 10s sudo "$fm_parser" -a "$fm_profile" > "$fm_logs/load.stdout" 2> "$fm_logs/load.stderr"; then fm_load_rc=0; else fm_load_rc=$?; fi
          printf '%s\n' "$fm_load_rc" > "$fm_logs/load.status"
          cat "$fm_logs/load.stdout" "$fm_logs/load.stderr"
          [ "$fm_load_rc" = 0 ]
          fm_globals
          fm_compare after success
          # Additional fixed normal-uid probe observes child transition and capabilities.
          if timeout 10s /usr/bin/bwrap --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/sh -c 'cat /proc/self/attr/current; grep "^CapEff:" /proc/self/status' > "$fm_logs/child.stdout" 2> "$fm_logs/child.stderr"; then fm_child_rc=0; else fm_child_rc=$?; fi
          printf '%s\n' "$fm_child_rc" > "$fm_logs/child.status"
          cat "$fm_logs/child.stdout" "$fm_logs/child.stderr"
          [ "$fm_child_rc" = 0 ]
          grep -q 'firstmate_ci_unpriv_bwrap' "$fm_logs/child.stdout"
          grep -Eq '^CapEff:[[:space:]]+0+$' "$fm_logs/child.stdout"
          # Unchanged mandatory controls include all metadata denials and external roots.
          bash tests/pinned-context.test.sh
          bash tests/review-experiment-evidence.test.sh
          fm_globals
          printf '%s\n' "$FM_BASH_TIMINGS" > /tmp/timings.txt
          bash bin/ci.sh --stage bash --shard "${{ matrix.shard }}/6"
      - name: retain bubblewrap causal controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwrap-controls-bash-${{ matrix.shard }}
          path: ${{ runner.temp }}/firstmate-bwrap-control
          if-no-files-found: ignore
      - name: upload suite timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings-${{ matrix.shard }}
          path: /tmp/suite-timings-${{ matrix.shard }}.txt
          if-no-files-found: ignore
      - name: upload suite assignment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-assigned-${{ matrix.shard }}
          path: /tmp/suite-assigned/suite-assigned-${{ matrix.shard }}.txt
          if-no-files-found: ignore

  bun:
    name: bun tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: bin/ci.sh --stage bun
        run: bash bin/ci.sh --stage bun

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
      # the cache holds the browser binaries; the shared libraries chromium
      # needs are apt packages on the runner and are not in it. Gating both
      # on the cache gives a hit with a browser that cannot launch.
      - name: install the browser's system libraries
        run: bunx playwright install-deps chromium
      - name: install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: bin/ci.sh --stage e2e
        run: bash bin/ci.sh --stage e2e

  # Fail-first, run by the machine (T-153): the change's behaviour reverted
  # to the merge-base, its changed suites run on both trees, and each
  # assertion that went red on base named. A pull request only: on a push to
  # main there is no base to revert to. Its report is the job summary and
  # the fail-first-report artifact, which fm-review.sh puts in the prompt.
  #
  # Sharded (T-158): one job ran every changed suite twice and T-121's 18
  # ran past the 10-minute limit. So 6 shards each run their share, on head
  # and base, split by bin/ci.sh's own split of the bash suites, and the
  # `fail-first` job merges their parts into the one report. The timings the
  # split is balanced by are read once, here, and handed to every shard: a
  # green run on main finishing between two shards' downloads would give
  # them two different splits, and a suite to none of them. The bash shards
  # now read theirs once too, in bash-timings (T-196).
  fail-first-timings:
    name: fail-first timings
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timings: ${{ steps.timings.outputs.timings }}
    steps:
      # Best effort, like bash-timings: none read is a split by size.
      - name: previous suite timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/timings
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -p 'suite-timings-*' -D /tmp/timings 2>/dev/null || true
          fi
          find /tmp/timings -name 'suite-timings-*.txt' -exec cat {} + > /tmp/timings.txt 2>/dev/null || true
          { echo 'timings<<FM_TIMINGS_END'; grep -v '^FM_TIMINGS_END$' /tmp/timings.txt || true; echo 'FM_TIMINGS_END'; } >> "$GITHUB_OUTPUT"

  fail-first-shard:
    name: fail-first shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [fail-first-timings]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # the dependencies alone, in each tree: the suites it runs are bash
      # suites, which need no browser. A shard with no changed suite of its
      # own sets up nothing and succeeds at once.
      - name: install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: read-only bubblewrap runner diagnostics
        run: |
          set +e
          printf 'Diagnostic only; existing mandatory suites still decide CI.\n'
          printf 'ImageOS=%s ImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          cat /etc/os-release
          command -v bwrap
          bwrap --version
          dpkg-query -W bubblewrap
          stat -c '%n owner=%U:%G mode=%a' /usr/bin/bwrap
          for file in /proc/self/attr/current /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces; do
            printf 'Read %s\n' "$file"
            cat "$file" 2>&1
            printf 'read_exit=%s\n' "$?"
          done
          sed -n '/^Uid:/p; /^Gid:/p; /^Cap/p; /^NoNewPrivs:/p; /^Seccomp/p' /proc/self/status
          if [ -r /sys/kernel/security/apparmor/profiles ]; then
            grep -i bwrap /sys/kernel/security/apparmor/profiles
          fi
          for file in /etc/apparmor.d/bwrap /etc/apparmor.d/usr.bin.bwrap; do
            if [ -r "$file" ]; then printf 'Read profile %s\n' "$file"; cat "$file"; fi
          done
          printf 'Minimal network namespace, stock-style automatic user namespace\n'
          timeout 10s /usr/bin/bwrap --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          printf 'minimal_stock_style_exit=%s\n' "$?"
          printf 'Diagnostic comparison only: explicit isolated user namespace\n'
          timeout 10s /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true
          printf 'minimal_explicit_user_exit=%s\n' "$?"
          exit 0
      - name: "bin/fm-failfirst.sh --shard=${{ matrix.shard }}/6"
        env:
          FM_FF_TIMINGS: ${{ needs.fail-first-timings.outputs.timings }}
        run: |
          # Captain-approved T-264 v5 temporary bwrap-only attachment.
          set -euo pipefail
          fm_logs="$RUNNER_TEMP/firstmate-bwrap-control"
          mkdir -p "$fm_logs"
          fm_profile=/etc/apparmor.d/firstmate-ci-bwrap
          fm_hash=9282ddad7c69ba6ac8261ac95f8aa8708695c44da42dca19c53a705a29a98c78
          fm_owned=0
          fm_parser=/sbin/apparmor_parser
          [ -x "$fm_parser" ] || { echo 'ASK:T-264 missing AppArmor parser' >&2; exit 1; }
          [ "$(id -u)" != 0 ]
          grep -qx 'VERSION_ID="24.04"' /etc/os-release
          [ "$(stat -c '%u:%g:%a' /usr/bin/bwrap)" = 0:0:755 ]
          timeout 10s dpkg-query -W bubblewrap apparmor
          timeout 10s "$fm_parser" --version
          stat -c '%n owner=%U:%G mode=%a' "$fm_parser" /usr/bin/bwrap
          fm_max="$(cat /proc/sys/user/max_user_namespaces)"
          fm_globals() {
            local clone restrict maximum
            clone="$(cat /proc/sys/kernel/unprivileged_userns_clone)"
            restrict="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
            maximum="$(cat /proc/sys/user/max_user_namespaces)"
            printf 'globals clone=%s restrict=%s max=%s\n' "$clone" "$restrict" "$maximum"
            [ "$clone" = 1 ] && [ "$restrict" = 1 ] && [ "$maximum" = "$fm_max" ] &&
            [ "$(stat -c '%u:%g:%a' /usr/bin/bwrap)" = 0:0:755 ]
          }
          fm_compare() {
            local phase="$1" expected="$2" form rc bad=0
            for form in automatic explicit; do
              local args=()
              if [ "$form" = explicit ]; then args+=(--unshare-user); fi
              if timeout 10s /usr/bin/bwrap "${args[@]}" --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/true > "$fm_logs/$phase-$form.stdout" 2> "$fm_logs/$phase-$form.stderr"; then rc=0; else rc=$?; fi
              printf '%s\n' "$rc" > "$fm_logs/$phase-$form.status"
              cat "$fm_logs/$phase-$form.stdout" "$fm_logs/$phase-$form.stderr"
              printf '%s %s exit=%s\n' "$phase" "$form" "$rc"
              if [ "$expected" = failure ]; then
                [ "$rc" = 1 ] && grep -q 'RTM_NEWADDR' "$fm_logs/$phase-$form.stderr" || bad=1
              else
                [ "$rc" = 0 ] || bad=1
              fi
            done
            [ "$bad" = 0 ]
          }
          fm_cleanup() {
            local result=$? cleanup_bad=0 remove_rc
            trap - EXIT
            set +e
            if [ "$fm_owned" = 1 ]; then
              if [ -f "$fm_profile" ] && [ ! -L "$fm_profile" ] && [ "$(sha256sum "$fm_profile" | cut -d ' ' -f 1)" = "$fm_hash" ]; then
                timeout 10s sudo "$fm_parser" -R "$fm_profile" > "$fm_logs/remove.stdout" 2> "$fm_logs/remove.stderr"
                remove_rc=$?
                printf '%s\n' "$remove_rc" > "$fm_logs/remove.status"
                cat "$fm_logs/remove.stdout" "$fm_logs/remove.stderr"
                [ "$remove_rc" = 0 ] || cleanup_bad=1
                sudo rm -- /etc/apparmor.d/firstmate-ci-bwrap || cleanup_bad=1
              else
                echo 'ASK:T-264 owned profile integrity changed; refusing unrelated removal' >&2
                cleanup_bad=1
              fi
              fm_globals || cleanup_bad=1
              fm_compare rollback failure || cleanup_bad=1
              timeout 10s cat /sys/kernel/security/apparmor/profiles > "$fm_logs/profiles-rollback.txt" || cleanup_bad=1
              if grep -q 'firstmate_ci_.*bwrap' "$fm_logs/profiles-rollback.txt"; then cleanup_bad=1; fi
            fi
            if [ "$cleanup_bad" != 0 ]; then echo 'ASK:T-264 profile cleanup/rollback refused' >&2; result=1; fi
            exit "$result"
          }
          trap fm_cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          fm_globals
          timeout 10s cat /sys/kernel/security/apparmor/profiles > "$fm_logs/profiles-before.txt"
          cat "$fm_logs/profiles-before.txt"
          [ ! -e "$fm_profile" ] && [ ! -L "$fm_profile" ]
          if grep -qi bwrap "$fm_logs/profiles-before.txt"; then
            echo 'ASK:T-264 existing bwrap profile requires approved takeover' >&2; exit 1
          fi
          # Bounded read-only kernel attachment inventory; no host private-root enumeration.
          timeout 10s python3 - <<'FM_ATTACHMENTS'
          from pathlib import Path
          from fnmatch import fnmatchcase
          root=Path('/sys/kernel/security/apparmor/policy/profiles')
          entries=list(root.iterdir())
          if len(entries)>4096: raise SystemExit('ASK:T-264 policy inventory exceeds bound')
          for entry in entries:
              with (entry/'attach').open('rb') as stream: attachment=stream.read(4097)
              if len(attachment)>4096: raise SystemExit('ASK:T-264 attachment exceeds bound')
              if fnmatchcase('/usr/bin/bwrap', attachment.strip().decode('utf-8')):
                  raise SystemExit('ASK:T-264 conflicting bwrap attachment')
          FM_ATTACHMENTS
          fm_compare before failure
          cat > "$fm_logs/profile" <<'FM_PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile firstmate_ci_bwrap /usr/bin/bwrap flags=(attach_disconnected) {
            allow capability,
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,
            allow px /** -> firstmate_ci_bwrap//&firstmate_ci_unpriv_bwrap,
          }
          profile firstmate_ci_unpriv_bwrap flags=(attach_disconnected) {
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,
            allow pix /** -> &firstmate_ci_unpriv_bwrap,
            audit deny capability,
          }
          FM_PROFILE
          [ "$(sha256sum "$fm_logs/profile" | cut -d ' ' -f 1)" = "$fm_hash" ]
          if timeout 10s "$fm_parser" -Q "$fm_logs/profile" > "$fm_logs/parse.stdout" 2> "$fm_logs/parse.stderr"; then fm_parse_rc=0; else fm_parse_rc=$?; fi
          printf '%s\n' "$fm_parse_rc" > "$fm_logs/parse.status"
          cat "$fm_logs/parse.stdout" "$fm_logs/parse.stderr"
          [ "$fm_parse_rc" = 0 ]
          # Fixed exclusive creation, never overwrite existing host policy.
          sudo /bin/bash -c 'set -eC; exec 3> /etc/apparmor.d/firstmate-ci-bwrap; trap "rm -- /etc/apparmor.d/firstmate-ci-bwrap" EXIT; cat >&3; trap - EXIT' < "$fm_logs/profile"
          fm_owned=1
          [ "$(sha256sum "$fm_profile" | cut -d ' ' -f 1)" = "$fm_hash" ]
          if timeout 10s sudo "$fm_parser" -a "$fm_profile" > "$fm_logs/load.stdout" 2> "$fm_logs/load.stderr"; then fm_load_rc=0; else fm_load_rc=$?; fi
          printf '%s\n' "$fm_load_rc" > "$fm_logs/load.status"
          cat "$fm_logs/load.stdout" "$fm_logs/load.stderr"
          [ "$fm_load_rc" = 0 ]
          fm_globals
          fm_compare after success
          # Additional fixed normal-uid probe observes child transition and capabilities.
          if timeout 10s /usr/bin/bwrap --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/sh -c 'cat /proc/self/attr/current; grep "^CapEff:" /proc/self/status' > "$fm_logs/child.stdout" 2> "$fm_logs/child.stderr"; then fm_child_rc=0; else fm_child_rc=$?; fi
          printf '%s\n' "$fm_child_rc" > "$fm_logs/child.status"
          cat "$fm_logs/child.stdout" "$fm_logs/child.stderr"
          [ "$fm_child_rc" = 0 ]
          grep -q 'firstmate_ci_unpriv_bwrap' "$fm_logs/child.stdout"
          grep -Eq '^CapEff:[[:space:]]+0+$' "$fm_logs/child.stdout"
          # Unchanged mandatory controls include all metadata denials and external roots.
          bash tests/pinned-context.test.sh
          bash tests/review-experiment-evidence.test.sh
          fm_globals
          printf '%s\n' "$FM_FF_TIMINGS" > /tmp/timings.txt
          FM_CI_TIMINGS_IN=/tmp/timings.txt bash bin/fm-failfirst.sh \
            --shard="${{ matrix.shard }}/6" --part="/tmp/fail-first-part-${{ matrix.shard }}.json" \
            --setup 'bun install --frozen-lockfile' "origin/${{ github.base_ref }}"
      - name: retain bubblewrap causal controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwrap-controls-fail-first-${{ matrix.shard }}
          path: ${{ runner.temp }}/firstmate-bwrap-control
          if-no-files-found: ignore
      - name: upload the shard's part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-first-part-${{ matrix.shard }}
          path: /tmp/fail-first-part-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # The merge: it runs whatever the shards did, so a shard that failed, was
  # cancelled or never started still ends in one report - a fail naming the
  # suites no part reported.
  fail-first:
    name: fail-first
    needs: [fail-first-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: download the shards' parts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fail-first-part-*
          path: /tmp/fail-first-parts
          merge-multiple: true
      - name: bin/fm-failfirst.sh --merge
        run: |
          mkdir -p /tmp/fail-first-parts
          bash bin/fm-failfirst.sh --merge=/tmp/fail-first-parts \
            --report /tmp/fail-first.md "origin/${{ github.base_ref }}"
      - name: upload the fail-first report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-first-report
          path: /tmp/fail-first.md
          if-no-files-found: ignore

  # The one required status check (gate 5, branch protection): it needs
  # every job above and fails if any of them failed or was skipped, so a
  # required check that stays named `ci` still means every stage passed.
  # fail-first alone may be skipped, and only where it does not run: on a
  # push to main.
  ci:
    name: ci
    needs: [fast, bash, bun, e2e, fail-first]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bin
            tests
      - name: download suite assignments
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-assigned-*
          merge-multiple: true
          path: /tmp/suite-assigned
      - name: every suite ran once
        run: mkdir -p /tmp/suite-assigned && bash bin/ci.sh --coverage /tmp/suite-assigned
      - name: every stage passed
        run: |
          echo "fast=${{ needs.fast.result }} bash=${{ needs.bash.result }} bun=${{ needs.bun.result }} e2e=${{ needs.e2e.result }} fail-first=${{ needs.fail-first.result }}"
          ff="${{ needs.fail-first.result }}"
          if [ "${{ github.event_name }}" != pull_request ] && [ "$ff" = skipped ]; then ff=success; fi
          results="${{ needs.fast.result }} ${{ needs.bash.result }} ${{ needs.bun.result }} ${{ needs.e2e.result }} $ff"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "ci: a required job did not succeed" >&2
              exit 1
            fi
          done
