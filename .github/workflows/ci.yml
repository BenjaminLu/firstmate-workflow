name: ci
# Runs the very same bin/ci.sh the local gate runs, split by --stage and
# --shard into jobs that run in parallel: the fast checks, the bash suites
# sharded across N jobs, the bun tests, and the browser tests. Do not add a
# step here that is not in that script, or the two will disagree about what
# green means. One group of jobs is not a piece of that script: fail-first
# runs bin/fm-failfirst.sh on a pull request (T-153), which is gate 4's
# question asked by the machine, not a stage of the check - sharded like the
# bash suites, and merged by the `fail-first` job (T-158). The final `ci` job is the one required status check; it
# needs every other job and fails if any of them failed or was skipped, so
# branch protection and gate 5 read the same thing they always did (T-134).
# The ci job also checks that every suite ran exactly once.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

env:
  FM_CI_MAX_SECONDS: "600"

jobs:
  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: bin/ci.sh --stage fast
        run: bash bin/ci.sh --stage fast

  bash-timings:
    name: bash timings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timings: ${{ steps.timings.outputs.timings }}
    steps:
      # One best-effort read for all bash shards: none read is a split by size.
      - name: previous suite timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/timings
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -p 'suite-timings-*' -D /tmp/timings 2>/dev/null || true
          fi
          find /tmp/timings -name 'suite-timings-*.txt' -exec cat {} + > /tmp/timings.txt 2>/dev/null || true
          { echo 'timings<<FM_TIMINGS_END'; grep -v '^FM_TIMINGS_END$' /tmp/timings.txt || true; echo 'FM_TIMINGS_END'; } >> "$GITHUB_OUTPUT"

  bash:
    name: bash suites (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [bash-timings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: "bin/ci.sh --stage bash --shard ${{ matrix.shard }}/6"
        env:
          FM_BASH_TIMINGS: ${{ needs.bash-timings.outputs.timings }}
          FM_CI_ASSIGNED_OUT: /tmp/suite-assigned/suite-assigned-${{ matrix.shard }}.txt
          FM_CI_TIMINGS_IN: /tmp/timings.txt
          FM_CI_TIMINGS_OUT: /tmp/suite-timings-${{ matrix.shard }}.txt
        run: |
          printf '%s\n' "$FM_BASH_TIMINGS" > /tmp/timings.txt
          bash bin/ci.sh --stage bash --shard "${{ matrix.shard }}/6"
      - name: upload suite timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings-${{ matrix.shard }}
          path: /tmp/suite-timings-${{ matrix.shard }}.txt
          if-no-files-found: ignore
      - name: upload suite assignment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-assigned-${{ matrix.shard }}
          path: /tmp/suite-assigned/suite-assigned-${{ matrix.shard }}.txt
          if-no-files-found: ignore

  bun:
    name: bun tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: bin/ci.sh --stage bun
        run: bash bin/ci.sh --stage bun

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
      # the cache holds the browser binaries; the shared libraries chromium
      # needs are apt packages on the runner and are not in it. Gating both
      # on the cache gives a hit with a browser that cannot launch.
      - name: install the browser's system libraries
        run: bunx playwright install-deps chromium
      - name: install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: bin/ci.sh --stage e2e
        run: bash bin/ci.sh --stage e2e

  # Fail-first, run by the machine (T-153): the change's behaviour reverted
  # to the merge-base, its changed suites run on both trees, and each
  # assertion that went red on base named. A pull request only: on a push to
  # main there is no base to revert to. Its report is the job summary and
  # the fail-first-report artifact, which fm-review.sh puts in the prompt.
  #
  # Sharded (T-158): one job ran every changed suite twice and T-121's 18
  # ran past the 10-minute limit. So 6 shards each run their share, on head
  # and base, split by bin/ci.sh's own split of the bash suites, and the
  # `fail-first` job merges their parts into the one report. The timings the
  # split is balanced by are read once, here, and handed to every shard: a
  # green run on main finishing between two shards' downloads would give
  # them two different splits, and a suite to none of them. The bash shards
  # now read theirs once too, in bash-timings (T-196).
  fail-first-timings:
    name: fail-first timings
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timings: ${{ steps.timings.outputs.timings }}
    steps:
      # Best effort, like bash-timings: none read is a split by size.
      - name: previous suite timings
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/timings
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -p 'suite-timings-*' -D /tmp/timings 2>/dev/null || true
          fi
          find /tmp/timings -name 'suite-timings-*.txt' -exec cat {} + > /tmp/timings.txt 2>/dev/null || true
          { echo 'timings<<FM_TIMINGS_END'; grep -v '^FM_TIMINGS_END$' /tmp/timings.txt || true; echo 'FM_TIMINGS_END'; } >> "$GITHUB_OUTPUT"

  fail-first-shard:
    name: fail-first shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [fail-first-timings]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: cache bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # the dependencies alone, in each tree: the suites it runs are bash
      # suites, which need no browser. A shard with no changed suite of its
      # own sets up nothing and succeeds at once.
      - name: install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: "bin/fm-failfirst.sh --shard=${{ matrix.shard }}/6"
        env:
          FM_FF_TIMINGS: ${{ needs.fail-first-timings.outputs.timings }}
        run: |
          printf '%s\n' "$FM_FF_TIMINGS" > /tmp/timings.txt
          FM_CI_TIMINGS_IN=/tmp/timings.txt bash bin/fm-failfirst.sh \
            --shard="${{ matrix.shard }}/6" --part="/tmp/fail-first-part-${{ matrix.shard }}.json" \
            --setup 'bun install --frozen-lockfile' "origin/${{ github.base_ref }}"
      - name: upload the shard's part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-first-part-${{ matrix.shard }}
          path: /tmp/fail-first-part-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # The merge: it runs whatever the shards did, so a shard that failed, was
  # cancelled or never started still ends in one report - a fail naming the
  # suites no part reported.
  fail-first:
    name: fail-first
    needs: [fail-first-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: download the shards' parts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fail-first-part-*
          path: /tmp/fail-first-parts
          merge-multiple: true
      - name: bin/fm-failfirst.sh --merge
        run: |
          mkdir -p /tmp/fail-first-parts
          bash bin/fm-failfirst.sh --merge=/tmp/fail-first-parts \
            --report /tmp/fail-first.md "origin/${{ github.base_ref }}"
      - name: upload the fail-first report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fail-first-report
          path: /tmp/fail-first.md
          if-no-files-found: ignore

  # The one required status check (gate 5, branch protection): it needs
  # every job above and fails if any of them failed or was skipped, so a
  # required check that stays named `ci` still means every stage passed.
  # fail-first alone may be skipped, and only where it does not run: on a
  # push to main.
  ci:
    name: ci
    needs: [fast, bash, bun, e2e, fail-first]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bin
            tests
      - name: download suite assignments
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-assigned-*
          merge-multiple: true
          path: /tmp/suite-assigned
      - name: every suite ran once
        run: mkdir -p /tmp/suite-assigned && bash bin/ci.sh --coverage /tmp/suite-assigned
      - name: every stage passed
        run: |
          echo "fast=${{ needs.fast.result }} bash=${{ needs.bash.result }} bun=${{ needs.bun.result }} e2e=${{ needs.e2e.result }} fail-first=${{ needs.fail-first.result }}"
          ff="${{ needs.fail-first.result }}"
          if [ "${{ github.event_name }}" != pull_request ] && [ "$ff" = skipped ]; then ff=success; fi
          results="${{ needs.fast.result }} ${{ needs.bash.result }} ${{ needs.bun.result }} ${{ needs.e2e.result }} $ff"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "ci: a required job did not succeed" >&2
              exit 1
            fi
          done
