name: ci
# Runs the very same bin/ci.sh the local gate runs. Do not add steps here that
# are not in that script, or the two will disagree about what green means.
# Everything above the run step is installing what the script needs; the
# browser is cached because downloading it is most of the wall clock.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
      # the cache holds the browser binaries; the shared libraries chromium
      # needs are apt packages on the runner and are not in it. Gating both
      # on the cache gives a hit with a browser that cannot launch.
      - name: install the browser's system libraries
        run: bunx playwright install-deps chromium
      - name: install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: bin/ci.sh
        env:
          FM_CI_MAX_SECONDS: "600"
        run: bash bin/ci.sh
