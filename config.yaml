# firstmate-workflow

vendor: claude          # every role uses this agent unless overridden below
model:  opus-5
reviewer:               # optional: a different engine for review buys real
  vendor: cursor-agent  # adversarial value. delete this block to use one vendor.
  model:  composer
# worker:               # the same override exists for the worker; without it
#   vendor: codex       # the worker uses the top-level vendor above

concurrency: 3          # workers in flight at once
# roster:               # the fleet's given names, one person per name across
#   - mira              # workers and reviewers; a run takes one no live run
#   - noah              # holds. Without it bin/fm-herdr.py's DEFAULT_ROSTER
#                       # is used. Letters only, six at most.
editor: code            # what /open hands a file to

notifications:          # inside Herdr, a decision card the captain must answer
  herdr: true           # raises one notification; false raises none
  sound: true           # false shows it silently

fallback:               # tried in order when an adapter exits 2 (vendor unavailable)
  - claude
  - codex
  - cursor-agent
  - gemini

default_project: firstmate-workflow   # the project a script without --project runs for
projects:               # every repository firstmate drives; design section 15.2
  firstmate-workflow:   # this repository, hosting itself
    repo: .
    github: BenjaminLu/firstmate-workflow
    base: main
    required_check: ci
    design: design/design.md
    tasks: design/tasks.json
    # its contract is the top-level project: block below until T-050 moves it

project:                # how this repository is prepared and checked; see README
  # a fresh worktree has no node_modules and no browser, and without them the
  # check skips its end-to-end stage rather than failing
  setup: bun install --frozen-lockfile && bunx playwright install chromium
  check: bin/ci.sh
  check_env:
    FM_CI_MAX_SECONDS: 600   # GitHub's budget; the bare default is 180
  tests:
    - tests/**
    - "*.test.*"
    - "*.spec.*"
  test: case {file} in *.test.sh) bash {file} ;; esac
  docs:                 # changes that need no test; skills are behaviour
    - design/**
    - README.md
    - LICENSE
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - SECURITY.md
    - .github/ISSUE_TEMPLATE/**
    - .github/pull_request_template.md
