# External clones and private records: FM_HOME overrides this optional setting.
# home: ~/.firstmate  # must be outside every engine checkout
# firstmate-workflow

board:
  port: 4173            # FM_PORT overrides this for a one-off server
language: en            # en or zh-TW; viewer preferences still win

vendor: opposite-of-host # Claude firstmate -> Codex worker; Codex -> Claude
                         # named role vendors and --vendor still win
models:                 # each vendor's own model name (T-146), applied with
  claude: claude-opus-5-5   # the adapter's own flag, never guessed from a run;
  codex:  gpt-6-astra   # a round on any vendor, a fallback's included, gets
                        # that vendor's. A vendor named here with no model
                        # runs on its CLI's default, which the run records.
reviewer:               # the reviewer's engine is the captain's choice
  vendor: claude        # chosen 2026-09-24, kept 2026-09-29: claude, on
                        # models.claude above
  mode:   run           # diff: the reviewer reads the diff; run: it also runs
                        # the tests in a fresh checkout of the pull request
# worker:               # the same override exists for the worker; without it
#   vendor: codex       # the worker uses the top-level vendor above. A role's
#   model:  o1          # model: overrides models.<vendor> for its own vendor only

# billing:                # T-121: by default every vendor bills to the login
#   claude: api-key       # fm hands a round - the operator's subscription.
#                         # Name a vendor here only when its rounds should
#                         # bill per API key or per use instead; fm setup
#                         # asks this once. Without an entry, that vendor's
#                         # adapter sheds the environment variables it
#                         # documents as outranking a stored login
#                         # (ANTHROPIC_API_KEY among them) before every round,
#                         # so a variable left in the operator's own shell for
#                         # personal use cannot silently change what a round
#                         # bills to.

policy:                 # what every crew round may do, whichever vendor runs it
  worker:               # (T-105, T-117; design section 13.1). Each adapter
    procs: 2048         # enforces it with its CLI's flags, bin/fm-sandbox.sh
    cpu: 14400          # with an OS sandbox, or the adapter refuses the round.
  reviewer:             # What is not a key here cannot be loosened: the write
    procs: 2048         # roots, the never-readable paths, git push, gh, herdr,
    cpu: 14400          # browsers and MCP refused, no sockets, the env scrub,
                        # the OS sandbox itself. Keys: network (registries;
                        # default none, never GitHub or loopback), read and
                        # never_read (added to), procs and cpu. A project
                        # overrides them below. A sandbox regression is
                        # FM_CREW_UNSANDBOXED=1 in the operator's shell,
                        # never a key here.

concurrency: 3          # workers in flight at once
# host: herdr           # none|herdr|cmux|tmux: a terminal host opens a labelled
#                       # window that follows each round's log. Rounds run
#                       # headless either way; unset, the host is detected.
# rosters:              # the crew is drawn at random once per installation,
#   workers:            # 24 workers and 24 reviewers, into state/crew/; see
#     - mira            # bin/fm.sh roster. A list here pins that role's names
#   reviewers:          # instead. A name belongs to one role, so one in both
#     - noah            # lists is refused. Letters only, six at most.
editor: code            # what /open hands a file to

notifications:          # inside Herdr, a decision card the captain must answer
  herdr: true           # raises one notification; false raises none
  sound: true           # false shows it silently

fallback:               # tried in order when an adapter exits 2 (vendor unavailable)
  - claude
  - codex
  - cursor-agent
  - gemini

default_project: firstmate-workflow   # the project a script without --project runs for
projects:               # every repository firstmate drives; design section 15.2
  firstmate-workflow:   # this repository, hosting itself
    repo: .
    projection: comments # optional round-record publication; local posts nothing
    github: BenjaminLu/firstmate-workflow
    base: main
    required_check: ci
    design: design/design.md
    tasks: design/tasks
    policy:             # this project's override of the crew policy above
      network: registry.npmjs.org cdn.playwright.dev playwright.download.prss.microsoft.com playwright.azureedge.net storage.googleapis.com
                        # the only registries a round's commands reach: what
                        # `setup` downloads from. Never a GitHub host.

    project:                # how this repository is prepared and checked; see README
      # a fresh worktree has no node_modules and no browser, and without them the
      # check skips its end-to-end stage rather than failing
      setup: bun install --frozen-lockfile && bunx playwright install chromium
      check: bin/ci.sh
      check_env:
        FM_CI_MAX_SECONDS: 600   # GitHub's budget; the bare default is 180
      tests:
        - tests/**
        - "*.test.*"
        - "*.spec.*"
      test: case {file} in *.test.sh) bash {file} ;; esac
      docs:                 # changes that need no test; skills are behaviour
        - design/**
        - README.md
        - LICENSE
        - CODE_OF_CONDUCT.md
        - CONTRIBUTING.md
        - SECURITY.md
        - .github/ISSUE_TEMPLATE/**
        - .github/pull_request_template.md
